<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J-Suite</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1b2330; --muted:#6b7280; --line:#e2e7ee; --soft:#f7f9fb;
    --brand:#1B2A4E; --accent:#8BC34A; --accent-ink:#2c4a00; --danger:#c0392b;
  }
  body[data-biz="jam"]{ --brand:#002052; --accent:#0099e5; --accent-ink:#003a66; }
  body.dark{ --bg:#0f141b; --card:#1a212b; --ink:#e7ecf2; --muted:#aab7c7; --line:#33404e; --soft:#262f3b; --danger:#e8705f; }
  body.dark[data-biz="jam"]{ --accent:#37b0f0; }
  /* Dark mode: ghost buttons (e.g. wizard service tiles) used --brand for text+border, which stays dark navy in dark mode → invisible. Lift to readable ink. */
  body.dark .btn.ghost{ color:var(--ink); border-color:#4a5a6e; }
  body.dark .badge{ color:var(--ink); }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:72px}
  header{background:var(--brand);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px}
  .logo{font-weight:800;font-size:18px;letter-spacing:.5px;line-height:1}
  .logo .ac{color:var(--accent)}
  .bizsel{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}
  .bizsel option{color:#1b2330;background:#fff;font-weight:600}
  .wrap{max-width:780px;margin:0 auto;padding:14px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 4px 8px}
  h2:first-child{margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .nm{font-weight:700;font-size:16px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .s-Lead{background:#eef2ff;color:#3b46c4}.s-Contacted{background:#fff4e5;color:#b26a00}
  .s-Quoted{background:#e7f0ff;color:#1f5fbf}.s-Won{background:#e7f7ea;color:#1d8a3a}.s-Lost{background:#fdecec;color:#c0392b}
  .p-High{background:#fdecec;color:#c0392b}.p-Medium{background:#fff4e5;color:#b26a00}.p-Low{background:#eef2ff;color:#3b46c4}
  .subnav{display:flex;gap:6px;margin:0 4px 12px;flex-wrap:wrap}
  .subbtn{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600}
  .subbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .mbars{margin:8px 0}
  .mbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
  .mbl{flex:0 0 40%;color:var(--ink);font-weight:600;line-height:1.2}
  .mbt{flex:1;height:15px;background:var(--soft);border-radius:8px;overflow:hidden}
  .mbf{height:100%;background:var(--accent);border-radius:8px}
  .mbv{flex:0 0 auto;color:var(--muted);font-weight:700;white-space:nowrap;font-size:11px}
  .mdonut{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0}
  .mlg{font-size:12px}
  .lg{display:flex;align-items:center;gap:7px;margin:4px 0}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}
  .mcard{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:9px 0;background:var(--card)}
  .mcard .mt{font-weight:700;font-size:14px}
  .mcard .mu{font-size:12px;word-break:break-all}
  .mcard .mu a{color:var(--brand)}
  .mtag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:middle}
  .mtag.gap{background:#e0a800;color:#3a2c00}
  .mtag.warn{background:var(--danger);color:#fff}
  .msrc{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .msrc a{color:var(--brand)}
  .kpi{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .kpi .k{flex:1 1 28%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
  .kpi .kn{font-size:17px;font-weight:800;color:var(--brand);line-height:1.1}
  .kpi .kl{font-size:10.5px;color:var(--muted);margin-top:3px}
  .macc{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card);overflow:hidden}
  .macc>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;font-size:14.5px;color:var(--brand);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .macc>summary::-webkit-details-marker{display:none}
  .macc>summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:700}
  .macc[open]>summary::after{content:"\2013"}
  .macc[open]>summary{border-bottom:1px solid var(--line)}
  .maccb{padding:8px 14px 12px}
  .ochips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
  .ochip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--soft);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
  .ochip.good{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .osort{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .orank{font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:6px;flex:0 0 auto}
  .otable{width:100%;border-collapse:collapse;font-size:12px}
  .otable th,.otable td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .otable th{position:sticky;top:0;background:var(--soft);color:var(--muted);font-size:11px}
  .otable td:first-child{white-space:normal;min-width:150px;font-weight:600}
  .otable tr:hover td{background:var(--soft)}
  .tldr{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .tldr .t{flex:1 1 28%;min-width:92px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border-radius:12px;padding:11px 10px}
  .tldr .t .v{font-size:18px;font-weight:800;line-height:1.1}
  .tldr .t .k{font-size:10.5px;opacity:.92;margin-top:3px;line-height:1.2}
  .cal{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.5;border-left:4px solid var(--accent);background:var(--soft)}
  .cal b.h{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);margin-bottom:3px}
  .cal.warn{border-left-color:var(--danger)} .cal.warn b.h{color:var(--danger)}
  .cal.info{border-left-color:#0099e5} .cal.info b.h{color:#0070b8}
  .pill{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;white-space:nowrap;margin-left:6px;vertical-align:middle}
  .pill.qw{background:#1b7f4d;color:#fff} .pill.lp{background:#0070b8;color:#fff} .pill.risk{background:var(--danger);color:#fff}
  .tline{display:flex;gap:4px;margin:8px 0}
  .tline .seg{flex:1;border-radius:8px;padding:7px 6px;color:#fff;font-size:10.5px;font-weight:700;text-align:center}
  .xlink{background:transparent;color:var(--brand);border:1.5px solid var(--brand);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;width:auto;margin:4px 4px 4px 0}
  .m-Planned{background:#eef2ff;color:#3b46c4}.m-Active{background:#e7f7ea;color:#1d8a3a}.m-Paused{background:#fff4e5;color:#b26a00}.m-Done{background:#eceff3;color:#5b6677}
  .maptop{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  #map,#smap{height:60vh;min-height:320px;border-radius:12px;border:1px solid var(--line);z-index:1}
  .leaflet-container{font:inherit}
  .acwrap{position:relative}
  .acbox{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:50;max-height:210px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .acitem{padding:9px 11px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}
  .acitem:last-child{border-bottom:none}
  button{font-family:inherit;cursor:pointer}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;width:100%}
  .btn.acc{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
  .btn.sm{width:auto;padding:9px 13px;font-size:14px}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 2px 4px}
  textarea{min-height:70px;resize:vertical}
  .search{margin-bottom:10px}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav button{flex:1 0 auto;min-width:62px;background:none;border:none;padding:9px 4px 8px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.on{color:var(--brand)}
  nav .ic{font-size:20px;line-height:1}
  .fab{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;font-size:30px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:25;display:flex;align-items:center;justify-content:center}
  .overlay{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 26px;position:relative}
  .shead{display:flex;align-items:center;margin-bottom:6px}
  .shead h3{font-size:18px}
  .shead .cl{margin-left:auto;background:none;border:none;font-size:24px;color:var(--muted);padding:0 4px}
  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:15px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .note{background:var(--soft);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
  .note .t{color:var(--muted);font-size:11px;margin-bottom:2px}
  .qline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .qline select{flex:1}
  .qline input.q{width:64px;text-align:center}
  .qline input.pr{width:84px;text-align:right}
  .qline .rm{background:none;border:none;color:var(--danger);font-size:20px;padding:0 4px}
  .totbar{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--accent);padding:12px 2px;margin-top:8px;display:flex;align-items:center}
  .totbar .lab{font-weight:700}.totbar .amt{margin-left:auto;font-size:22px;font-weight:800;color:var(--brand)}
  .toggle{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
  .toggle input{width:auto}
  .secthd{display:flex;align-items:center;margin:18px 4px 6px}
  .secthd h2{margin:0}
  .secthd .ct{margin-left:auto;color:var(--muted);font-size:13px}
  .syncpill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:none}
  .grid2{display:grid;grid-template-columns:1fr;gap:0}
  .calhead{display:flex;align-items:center;gap:12px;margin:4px 4px 10px}
  .calhead .mtitle{font-weight:800;font-size:17px}
  .calnav{background:var(--brand);color:#fff;border:none;border-radius:8px;width:34px;height:34px;font-size:18px;font-weight:700}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
  .caldow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
  .calcell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:56px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .calcell.out{background:transparent;border-color:transparent;cursor:default}
  .calcell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .calcell .dnum{font-size:12px;font-weight:700;color:var(--muted)}
  .calcell.today .dnum{color:var(--brand)}
  .caljob{background:var(--brand);color:#fff;border-radius:4px;font-size:10px;line-height:1.3;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .calmore{font-size:10px;color:var(--muted)}
  @media(min-width:900px){.calcell{min-height:92px}.caljob{font-size:11px}}
  /* ---------- DESKTOP ---------- */
  @media(min-width:900px){
    body{font-size:17px;padding-bottom:0}
    header{height:60px;padding:0 26px}
    .logo{font-size:22px}
    nav{top:60px;bottom:0;left:0;right:auto;width:224px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding-top:16px}
    nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:15px 24px;font-size:15px;width:100%}
    nav button.on{color:var(--brand);background:rgba(0,0,0,.035);box-shadow:inset 4px 0 0 var(--brand)}
    nav .ic{font-size:20px}
    .wrap{margin-left:224px;max-width:1180px;padding:26px 40px}
    h2{font-size:14px}
    .nm{font-size:17px}.sub{font-size:14px}
    .card{padding:18px 22px;margin-bottom:12px}
    .li{padding:13px 0}
    .fab{right:34px;bottom:34px;width:60px;height:60px}
    .overlay{align-items:center}
    .sheet{max-width:620px;max-height:88vh;border-radius:16px;padding:24px}
    .grid2{grid-template-columns:1fr 1fr;gap:0 28px}
    .empty{padding:60px 16px}
  }
  @media(min-width:1400px){ .wrap{max-width:1320px} .grid2{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

  add("obx","CHANNEL PLAN (cost · eyes · leads) — broke-friendly order\nRULE: spend sweat before dollars; spend first dollars only where you pay per RESULT (a lead), not per impression.\n\nTIER 0 — FREE, do now:\n- Google Business Profile + reviews — $0, the #1 free asset; ranks you for 'pressure washing near me'. Ask every customer for a review.\n- Direct PM outreach (the call list) — $0, your #1 channel; one PM = many doors.\n- Referrals + review asks — $0, highest close rate.\n- Nextdoor + local FB groups — $0, post before/after photos.\n- Door hangers — ~$0.12 each, brothers distribute free; 1-3% response = 5-15 calls per 500.\n- Truck magnets + shirts + yard signs — ~$100-200 once, cheap rolling visibility.\n\nTIER 1 — first ~$250/mo:\n- Google Local Services Ads (LSA) — $12-30/lead, pay-per-lead, 'Google Guaranteed'. $250/mo ~ 12 leads, 30-40% close = 4-5 jobs/mo. BEST first paid dollar. Move the $10/day Google Search into LSA.\n\nTIER 2 — ~$300-1,500/mo when cash flows:\n- Meta ads (before/after) — $300-800/mo, CPL ~$18-22 = ~18-22 leads/mo.\n- Vehicle wrap — $2,500-5,000 once, 30-70k impressions/day, $0.36 CPM (cheapest ad there is), recoup 3-6 mo.\n- EDDM direct mail — $0.30-0.60/piece, target second-home/rental zips for house-watch.\n\nTIER 3 — later: full local SEO (durable, compounding), retargeting, sponsorships.\n\nAVOID: Angi/Thumbtack — shared leads, ~$100-2,500 CAC, bad ROI. Skip while broke.\nFull detail: 'Marketing Channel Plan.md'.");

  const add=(biz,text)=>{let dc=S[biz].docs.find(x=>x.id==="research");if(dc&&dc.text.indexOf("MONEY ON THE TABLE")<0){dc.text=dc.text+"\n\n"+text;dc.updatedAt=now();}};
  add("obx","MONEY ON THE TABLE (vs Pierce $15/hr, Chase $18/hr)\nThe point isn't a great hourly wage — it's that you keep the OWNER MARGIN above labor, which scales with the crew. Paying the brothers $18/hr, each job still nets the business: soft wash ~$248 ($71/clock-hr), pressure wash ~$126, house-watch ~$35 ($46/hr, recurring), junk ~$268 ($134/hr), windows ~$168, holiday lighting ~$856 ($214/hr). Every line beats the brothers' current wage AFTER paying them — so they get a raise and the business still profits.\n\nSCENARIOS (Ray owns 1/3): conservative ~$52k/yr business margin (Ray ~$17k), moderate ~$115k (Ray ~$38k), aggressive yr-2 two-crew ~$253k (Ray ~$84k).\n\nONE-STOP FRONT DOOR: OBX Lot Solutions is the single number a property manager calls for anything; Jamieson is the tech subcontractor; add more trades over time. MONEY RULE: when a job includes tech, Jamieson invoices that portion (Ray owns 100% of Jamieson vs 1/3 of OBX) — keep cleanup money in OBX, tech money in Jamieson.\n\nMORE SERVICES TO ADD: dryer vent ($100-187), deck/fence staining, trash-bin cleaning (subscription), pool/hot-tub service, dock/boat-bottom washing, HVAC coil cleaning, handyman/property maintenance, storm prep, golf-cart repair.\n\nFull detail: 'Opportunity Analysis — Is It Worth It.md' + 'Opportunity & Pricing Model.xlsx'.");
  add("jam","MONEY ON THE TABLE (vs Ray's $55/hr, ~$40k last year)\nEvery Jamieson hour is worth multiples of the escape room: Starlink install ~$135/Ray-hr (2.4x), rental tech package ~$175 (3.2x), permanent lighting ~$150 (2.7x), commercial AV/Q-Sys ~$206 (3.7x). Ray owns 100% of this.\n\nSCENARIOS (to Ray directly): part-time ~$63k/yr, half-time ~$115k, lean-in ~$200k.\n\nCOMBINED PATH: today ~$40k -> conservative OBX + part-time Jamieson ~$81k (2x) -> moderate + half-time ~$154k (3.8x) -> aggressive + lean-in $250k+.\n\nTHE PLAY: run OBX on the brothers (earns without you) so your scarce hours go to high-margin Jamieson work. Start with Starlink packages.\n\nFull detail: 'Opportunity Analysis — Is It Worth It.md' + 'Opportunity & Pricing Model.xlsx'.");

function setResearchDocs(){
  const set=(biz,text)=>{let dc=S[biz].docs.find(x=>x.id==="research");if(dc){dc.text=text;dc.deleted=false;dc.updatedAt=now();}else S[biz].docs.push({id:"research",text:text,updatedAt:now()});};
  set("obx","OBX LOT SOLUTIONS — Market Research (updated overnight)\n\nTHE BIG PICTURE\nThe Outer Banks runs on absentee owners and rentals. ~60% of homes here are second homes, ~52% sit vacant at any time, and there are 8,000-10,000+ vacation rentals in Dare County alone. Dare saw $2.1B in visitor spending in 2024 and ~45% of local jobs are tourism. NC also has a real skilled-trades labor shortage. Translation: thousands of pricey properties owned by people who aren't here, who need a reliable local to clean, wash, watch, and fix them — in a market short on reliable help. That gap is the whole opportunity.\n\nWHAT TO PUSH FIRST\n1) Pressure & soft washing — the engine.\n2) House-watch / property checks — the sleeper + the wedge.\n3) Keep junk removal (get the trailer).\n4) Bundle window + gutter cleaning onto wash visits.\n5) Queue holiday lighting for Q4.\n\nPRESSURE & SOFT WASHING (start now)\nSalt + humidity grow algae/mildew fast on the coast, so exteriors need washing on a recurring (often annual) basis — recurring demand is the point. US industry is $1.2B across ~32,000 businesses; gross margins commonly 40-65%. House exterior $192-400; pricing $0.30-0.80/sq ft; roof soft-wash ~$700. Lead with SOFT washing (houses, roofs, siding) for recurring money + concrete pressure washing. Sell annual plans. You already own a commercial unit and the brothers can run it.\n\nHOUSE-WATCH / PROPERTY CHECKS (start now)\nWith 60% absentee ownership, there's a huge base needing property checks — and insurers often require checks on vacant homes. Per-visit recurring, near-zero equipment, delivered with a photo/text report = high trust, high margin, sticky. It's also the WEDGE: once you're the trusted person at the property, you get the washing, junk, repairs, and Jamieson tech too. Offer tiered monthly/bi-weekly plans with a branded report.\n\nJUNK REMOVAL (keep)\n$350-850/job, solo margins 40-72%; tipping ~$62/ton. Trailer is the gating item. Good cash; pairs with clean-outs for the same PM/absentee customers.\n\nWINDOW + GUTTER (bundle, don't lead)\nWindows $150-370/visit, gutters $0.95-2.50/linear ft, both ~twice-yearly, 20-50% margin. Saturated as standalone — ATTACH them to wash/house-watch accounts as recurring add-ons.\n\nHOLIDAY LIGHTING (queue for Q4)\nLands when the OBX is dead = off-season cash. 30%+ net, materials only 10-12%, $8-35/linear ft; a 3-person crew nets $1,000-1,700/day; $100k+/season is doable. Decide by late summer, pre-sell Sept/Oct. Bridges into Jamieson's permanent lighting.\n\nTURNOVER CLEANING (defer)\nCleanliness is the #1 guest complaint and managers can't staff turnover days — huge market, but same-day weekend turns are risky with a part-time crew. Revisit once the crew is proven.\n\nHOW IT CONNECTS TO JAMIESON\nSame customers (property managers + second-home owners). House-watch opens the door; washing/junk are the recurring revenue; then Jamieson sells Starlink/wifi/smart locks/cameras/AV/lighting into the same door. One PM = dozens of doors for both businesses.\n\n(Full report with all numbers + sources: see 'Market Research & Strategy.md' in the project folder.)");
  set("jam","JAMIESON AUTOMATION — Market Research (updated overnight)\n\nTHE BIG PICTURE\nThe OBX is absentee-owner and rental-heavy: ~60% second homes, 8,000-10,000+ vacation rentals in Dare alone, a ~$100B US vacation-rental market, and a US smart-home market of ~$28-36B growing 17-27%/yr (41% of US households already have smart-home tech). These owners want reliable guest wifi, keyless entry, cameras, and systems that just work — and there are few skilled, reliable local integrators. Premium, relationship-sold work is wide open.\n\nWHAT TO PUSH FIRST\n1) Starlink + vacation-rental tech packages.\n2) Commercial AV / Q-Sys for restaurants & bars (your deepest edge).\n3) Permanent outdoor LED lighting (high-ticket bet).\nPlus: security cameras/smart home as cross-sell; EV/generators with a license workaround; boat fiberglass as a wildcard.\n\nSTARLINK + RENTAL-TECH PACKAGES (push now)\n71% of travelers prefer keyless entry; rentals need reliable wifi; Starlink's own installs carry $100-1,500 demand surcharges in busy areas (supply gap). You've done 3 installs already. Bundle Starlink + mesh wifi + smart lock + thermostat + cameras into a flat-rate 'rental-ready' package sold per door to PMs and owners. One PM = many doors.\n\nCOMMERCIAL AV / Q-SYS (your edge)\nThe OBX is dense with restaurants/bars, and you have real Q-Sys/QSC expertise — the exact platform for multi-zone hospitality audio, paging, and control. Few true pros compete locally. High-ticket installs + recurring support/programming. Relationship-sold: walk into venues, lead with Q-Sys. Hard for others to copy.\n\nPERMANENT OUTDOOR LED LIGHTING (high-ticket bet)\nTrimlight/Jellyfish/Gemstone-style systems are year-round (holiday + accent + security in one app), sold to affluent homes — the OBX is full of them, with likely little local competition. $1,800-2,500+ per home, $18-35/linear ft, ~$650 controller; margins like holiday lighting. It's technical (LED channels, controllers, app/network) = your wheelhouse, and it bridges OBX Lot Solutions' seasonal lighting into a premium product. Become a dealer this summer; sell in the fall.\n\nSECURITY CAMERAS + SMART HOME (cross-sell)\nSmart-home market ~$28-36B, growing fast, 41% household adoption. Cameras/locks/thermostats attach naturally to the rental package and any home you're already in.\n\nEV CHARGERS & GENERATORS (demand yes, license constraint)\nStrong demand (NC EV charging +39% YoY; coastal NC wants Generac standby generators, which book up before hurricane season). BUT both hardwire into the panel = NC licensed electrician required, which you're not yet. Options: partner with a licensed electrician (own mounting/config/automation + the customer), do plug-in EV chargers only (no license needed), or pursue a Limited electrical license later (2 yrs experience, up to $60k jobs). Secondary until you pick a path.\n\nWILDCARD: MOBILE BOAT FIBERGLASS/GELCOAT REPAIR\nYou have rare structural fiberglass skill; the OBX is boat-dense; NC sun cracks/fades gelcoat (recurring). Shops charge ~$110/hr, $450-500 for small repairs. A mobile service is a high-margin niche with thin competition. Worth a low-cost test (marina drop-bys).\n\nHOW IT CONNECTS TO OBX LOT SOLUTIONS\nSame customers. OBX Lot Solutions' house-watch/washing relationships become warm leads for Jamieson's high-margin Starlink/AV/lighting work. Keep brands separate (you own 100% of Jamieson) but work one shared PM list.\n\n(Full report with all numbers + sources: see 'Market Research & Strategy.md' in the project folder.)");
}

/* COGS layer — Part 3: render helpers (Cost/Price/Profit/Margin strip + floor warning). */
function cogsStrip(price, cost){
  const profit = price - cost, margin = price>0 ? profit/price : 0;
  const warn = belowMarginFloor(margin);
  return `<div class="cogs" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
    <div class="kp"><b>${money(cost)}</b><span class="kl">Cost</span></div>
    <div class="kp"><b>${money(price)}</b><span class="kl">Price</span></div>
    <div class="kp"><b>${money(profit)}</b><span class="kl">Profit</span></div>
    <div class="kp" style="${warn?'color:#c0392b':''}"><b>${pct(margin)}</b><span class="kl">Margin</span></div>
  </div>${warn?`<div class="note" style="border-left:4px solid #c0392b;background:#fdecea;color:#922;padding:8px;border-radius:6px">
    ⚠ Margin ${pct(margin)} is under the ${Math.round(MARGIN_FLOOR*100)}% floor — this discount is eating your profit. Hold the price or trim scope.</div>`:""}`;
}
function itemsCost(items){let c=0;(items||[]).forEach(it=>c+=(+it.cost||0)*(it.qty||1));return c;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(d){if(!d)return"";const p=d.split("-");return `${p[1]}/${p[2]}/${p[0].slice(2)}`}
/* active (non-deleted) accessors */
function actC(){return D().customers.filter(c=>!c.deleted)}
function actQ(){return D().quotes.filter(q=>!q.deleted)}
function actJ(){return D().jobs.filter(j=>!j.deleted)}
function actTodo(){return D().todos.filter(t=>!t.deleted)}
function actProps(){return (D().properties||[]).filter(p=>!p.deleted)}
function propsForCust(cid){return actProps().filter(p=>(p.customerIds||[]).indexOf(cid)>=0)}
function custsForProp(p){return (p.customerIds||[]).map(id=>D().customers.find(c=>c.id===id&&!c.deleted)).filter(Boolean)}
function propLabel(id){const p=(D().properties||[]).find(x=>x.id===id);return p?((p.label?p.label+" — ":"")+(p.address||"")):""}
function custName(id){const c=D().customers.find(x=>x.id===id);return c?(c.name||c.company||"—"):"—"}
function touch(r){r.updatedAt=now();return r}

/* ---------- TODAY ---------- */
function rToday(){
  const t=today();
  const calls=actC().filter(c=>["Lead","Contacted"].includes(c.status)||(c.next&&c.next<=t))
     .sort((a,b)=>(a.next||"9999")<(b.next||"9999")?-1:1);
  const jobs=actJ().filter(j=>!j.done&&j.date===t);
  const won=actC().filter(c=>c.status==="Won").length;
  const d7=new Date();d7.setDate(d7.getDate()+7);
  const wkEnd=d7.getFullYear()+"-"+String(d7.getMonth()+1).padStart(2,"0")+"-"+String(d7.getDate()).padStart(2,"0");
  const pipeline=actQ().filter(q=>!q.paid).reduce((s,q)=>s+(q.total||0),0);
  const outstanding=actQ().filter(q=>q.invoiced&&!q.paid).reduce((s,q)=>s+(q.total||0),0);
  const jobsWeek=actJ().filter(j=>!j.done&&j.date>=t&&j.date<=wkEnd).length;
  const dir=(D().docs.find(x=>x.id==="ceo"&&!x.deleted)||{}).text||"";
  let h=`<div class="secthd"><h2>From the CEO's desk · ${fmtDate(t)}</h2><button class="btn ghost sm" onclick="editDoc('ceo','CEO directive')">Edit</button></div>
    <div class="card" style="border-left:5px solid var(--accent)"><div style="white-space:pre-wrap;font-size:15px;line-height:1.55">${dir?esc(dir):'<span class="muted">No directive yet — tap Edit.</span>'}</div></div>
    <h2 style="margin-top:18px">Snapshot</h2>
    <div class="card row"><div class="grow"><div class="nm">${actC().length} customers · ${actQ().length} quotes · ${won} won</div>
    <div class="sub">${BIZ[S.biz].phone||"Jamieson Automation"}</div></div></div>
    <div class="card" style="display:flex;gap:6px;text-align:center">
      <div class="grow"><div style="font-size:20px;font-weight:800;color:var(--brand)">${money(pipeline)}</div><div class="sub">open pipeline</div></div>
      <div class="grow" style="border-left:1px solid var(--line)"><div style="font-size:20px;font-weight:800;color:var(--brand)">${money(outstanding)}</div><div class="sub">unpaid</div></div>
      <div class="grow" style="border-left:1px solid var(--line)"><div style="font-size:20px;font-weight:800;color:var(--brand)">${jobsWeek}</div><div class="sub">jobs this week</div></div>
    </div>`;
  const dueT=sortTodos(actTodo().filter(x=>!x.done&&x.due&&x.due<=t));
  if(dueT.length)h+=`<div class="secthd"><h2>To-do — due now</h2><span class="ct">${dueT.length}</span></div><div class="card">`+dueT.map(td=>liTodo(td,t)).join("")+`</div>`;
  h+=`<div class="secthd"><h2>To call / visit</h2><span class="ct">${calls.length}</span></div>`;
  h+= calls.length?`<div class="card">`+calls.slice(0,30).map(liCustomer).join("")+`</div>`
     :`<div class="empty">Nothing pending. Add customers or set follow-up dates.</div>`;
  h+=`<div class="secthd"><h2>Today's jobs</h2><span class="ct">${jobs.length}</span></div>`;
  h+= jobs.length?`<div class="card">`+jobs.map(liJob).join("")+`</div>`:`<div class="empty">No jobs scheduled today.</div>`;
  view.innerHTML=h;
}

  else if(!list.length)h+=`<div class="empty">No matches.</div>`;
  else h+=`<div class="card grid2">`+list.map(liCustomer).join("")+`</div>`;
  view.innerHTML=h;

window.saveCustomer=function(id,isNew){

function renderLines(){

    const isQuote=it.unit==="quote";
    const isJunk=/junk|haul|debris|clear|cleanout|dump|move-out/i.test(it.name||"");
    return `<div class="qline">
      <select onchange="lineSvc(${i},this.value)"><option value="">— service —</option>${opts}</select>
      <input class="q" type="number" min="1" value="${it.qty}" oninput="lineQty(${i},this.value)" title="qty">
      <input class="pr" type="number" value="${it.price}" ${isQuote?"":"readonly"} oninput="linePrice(${i},this.value)" title="price">

}

/* ---------- SCHEDULE ---------- */
let CALY=null,CALM=null;
function rSchedule(){
  const t=today();
  if(CALY==null){const d=new Date();CALY=d.getFullYear();CALM=d.getMonth();}
  const jobs=actJ().slice().sort((a,b)=>(a.date+(a.time||""))<(b.date+(b.time||""))?-1:1);
  let h=`<h2>Schedule</h2>`+renderCalendar(jobs);
  const groups={Today:[],Upcoming:[],Done:[]};
  jobs.forEach(j=>{if(j.done)groups.Done.push(j);else if(j.date>t)groups.Upcoming.push(j);else groups.Today.push(j);});
  if(!jobs.length)h+=`<div class="empty" style="padding:18px">No jobs yet — tap a day above or the + button.</div>`;
  ["Today","Upcoming","Done"].forEach(g=>{if(!groups[g].length)return;
    h+=`<div class="secthd"><h2>${g}</h2><span class="ct">${groups[g].length}</span></div><div class="card">`+groups[g].map(liJob).join("")+`</div>`;});
  view.innerHTML=h;
}
function renderCalendar(jobs){
  const t=today();const byDate={};jobs.forEach(j=>{(byDate[j.date]=byDate[j.date]||[]).push(j);});
  const first=new Date(CALY,CALM,1);const startDow=first.getDay();
  const dim=new Date(CALY,CALM+1,0).getDate();
  const mname=first.toLocaleString(undefined,{month:"long"});
  const dows=["Su","Mo","Tu","We","Th","Fr","Sa"];
  let cells=dows.map(d=>`<div class="caldow">${d}</div>`).join("");
  for(let i=0;i<startDow;i++)cells+=`<div class="calcell out"></div>`;
  for(let day=1;day<=dim;day++){
    const ds=CALY+"-"+String(CALM+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const dj=byDate[ds]||[];let inner=`<div class="dnum">${day}</div>`;
    dj.slice(0,2).forEach(j=>inner+=`<div class="caljob" style="${j.done?'opacity:.5;text-decoration:line-through':''}">${esc(j.title||'Job')}</div>`);
    if(dj.length>2)inner+=`<div class="calmore">+${dj.length-2} more</div>`;
    cells+=`<div class="calcell${ds===t?' today':''}" onclick="openDay('${ds}')">${inner}</div>`;
  }

function bpBrain(){

 const ord={L:0,M:1,S:2};
 items.sort((a,b)=>{

 });

 h+=`<div><div class="sub">Sort</div><select onchange="bpSetSort(this.value)">`+[["tier","Tier"],["lev","Leverage"],["value","Value"],["effort","Effort"],["cat","Category"]].map(o=>`<option value="${o[0]}" ${BPSORT===o[0]?"selected":""}>${o[1]}</option>`).join("")+`</select></div></div></div>`;
 h+=`<div class="sub" style="margin:2px 2px 6px">${items.length} item${items.length!==1?"s":""} ${BPF.inst||BPF.cat||BPF.tier||BPF.status?'<a href="#" onclick="BPF={inst:\'\',cat:\'\',tier:0,status:\'\'};render();return false">· clear filters</a>':""}</div>`;

obx:[
{key:"products",title:"Know what we sell",mins:8,body:`You can't sell or quote what you don't understand. Here is everything OBX Lot Solutions does, in plain words. You don't memorize prices — the app does that. You memorize what each service IS and who it's for.

THE ENGINE: PRESSURE & SOFT WASHING
• Soft wash = LOW pressure + a cleaning solution (bleach + soap). It KILLS the algae and mildew the coast grows. Use it on roofs, siding, screens, painted surfaces — anything high pressure would damage.
• Pressure wash = HIGH pressure, water only. Use it on concrete: driveways, sidewalks, dumpster pads.
• THE ONE RULE PEOPLE GET WRONG: never pressure-wash a roof or siding. It strips shingles and forces water behind siding. Soft wash those. If you remember one technical fact, remember this one.
• Why it repeats: salt + humidity bring the algae back every single year. So every wash customer is a yearly (recurring) customer if you offer it.

THE WEDGE: HOUSE-WATCH / PROPERTY CHECKS
• 60% of OBX homes are owned by people who don't live here. We visit on a schedule, walk the property, check for leaks/pests/storm/break-in damage, run water, and text them a photo report.
• It's ~30-45 minutes, almost no materials, high margin, and it repeats every month forever.
• It's our secret weapon: once we're the trusted person at a property, we get the washing, the junk, the gutters — AND the Jamieson tech work.

THE REST (we bundle these onto wash/house-watch accounts):
• Junk removal — by the load. Needs the trailer.
• Windows & gutters — never lead with these (too many competitors); attach them as add-ons.
• Parking-lot & commercial cleanup — litter/debris for lots and storefronts, priced by lot size (the Map tool draws it). Recurring is the goal.
• Seasonal money: dryer-vent cleaning, deck/fence seal, trash-bin cleaning, holiday lighting, storm prep.

THE BIG IDEA: We are not a "pressure washing company." We are the reliable property-care crew. One customer should buy many services from us, over many years. That is how a $300 driveway becomes a $4,000-a-year account.`,

{q:"Why is house-watch our 'secret weapon' even though it's a small ticket?",opts:["It's the most expensive service","It makes us the trusted person at the property, which leads to all the other work","It requires no driving","It only happens once"],a:1},

{key:"getclients",title:"Where our customers come from",mins:8,body:`We don't wait for the phone to ring. We go get the work. Here is exactly where it comes from, ranked by what actually pays off.

#1 — PROPERTY MANAGERS & HOAs (this is the whole game)
• One property manager controls DOZENS of homes/buildings. One "yes" = recurring revenue across many doors.
• They live on reliability. If you show up when you say you will, look professional, and send clean reports, you become their go-to. That's worth more than any ad.
• Your call list is already in the app and in the project folder. These are warm targets, not random numbers.

#2 — REFERRALS & REVIEW ASKS (highest close rate of anything)
• A happy customer's neighbor already trusts you. Ask every single customer two things: "Do you know anyone else who could use this?" and "Would you leave us a Google review?"
• This costs $0 and closes better than everything else. We'll drill the exact words in the sales module.

#3 — GOOGLE BUSINESS PROFILE (free, do it once)
• When someone Googles "pressure washing near me," our free Google listing is what shows up. Reviews make it rank higher — which is why #2 feeds #3.

#4 — BEING SEEN WHILE WORKING
• Yard sign at every job. Truck magnets. A flyer left on the neighbors' doors while you're already there. Free or nearly free, and it clusters work in one neighborhood (efficient driving).

#5 — LOCAL FACEBOOK GROUPS & NEXTDOOR
• Post before/after photos. Neighbors recommend neighbors. Great for residential washing and house-watch.

WHAT WE AVOID: Angi and Thumbtack. They sell the same lead to 3-5 contractors, most leads never answer, and it's a money pit. We win with free outreach + reviews instead.

YOUR JOB THIS WEEK: Most of our growth is just #1 and #2 — talk to property managers, and ask every customer for a review and a referral. Everything else supports those two.`,

{key:"sales",title:"Talking to people (the part we're nervous about)",mins:12,body:`None of us are natural salespeople. That's fine — actually it's an advantage. People are sick of slick salesmen. They want someone honest and reliable. That's literally us. Read this whole thing; it's the most important module.

THE MINDSET (reframe the fear)
• You are NOT "selling." You are offering to solve a problem they already have. Their driveway IS green. Their rental DOES need checking. You're the helpful local guy, not a pushy stranger.
• You will not be perfect and that's okay. Nervous-but-honest beats smooth-but-fake every time.
• Your only goal on a first contact is to get a yes to a SMALL next step (a walkthrough, a quote) — not to close a huge deal on the spot.

THE COLD CALL (property managers) — follow this word for word
1. Greeting: "Hi, this is [name] with OBX Lot Solutions, do you have a quick minute?"
2. Reason: "We do property cleanup and washing here on the Outer Banks — parking lots, building exteriors, soft washing, junk removal — and we work with property managers who need a reliable crew that just shows up."
3. The ask (small): "I'd love to swing by and give you a free quote on one of your properties. No pressure at all — would later this week work?"
4. Stop talking. Let them answer. Silence is fine.

IF YOU GET A VOICEMAIL: "Hi, this is [name] with OBX Lot Solutions — we do reliable exterior cleanup and washing for property managers on the Outer Banks. I'd love to give you a free quote. My number is [number]. Thanks so much." Then follow up in 3 days. Most yeses come on the 2nd or 3rd touch.

IN PERSON (walking into a storefront or rental office)
• "Hi, I'm [name] with OBX Lot Solutions — we keep properties clean out here, washing and cleanup. Are you the right person to talk to about your exterior, or is that someone else?" That last question is magic: it's easy to answer and gets you to the decision-maker.

HANDLING THE COMMON RESPONSES (don't panic — there are only a few)
• "We already have someone." → "Totally understand, most folks do. Can I leave you a card in case they ever fall through? We pride ourselves on actually showing up." (You're planting a seed. Reliability is your wedge — many crews flake.)
• "How much?" → "Depends on the size, which is why I'd rather look at it and give you an honest number for free. Could I take a quick look this week?"
• "Send me an email/info." → "Happy to. What's the best address?" Then actually follow up. (Note: only send when you're ready — we build trust before automating anything.)
• "Not interested." → "No problem at all, thanks for your time. Have a good one." Smile, move on. A no today is not a no forever.

THE TWO RULES THAT BEAT NERVES
1. Have the words ready (above) so you're never improvising.
2. Aim small: just get the walkthrough. The quote sells itself once you're standing on their property.

You will get told no a lot. That is the job, not a sign you're bad at it. Every no gets you closer to the yes that becomes a recurring account.`,

{key:"quoting",title:"Quoting without freezing up",mins:8,body:`The quote is where money is won or lost — and where nerves hit. Here's how to do it calmly, every time.

BEFORE YOU GIVE A NUMBER
• Walk the property WITH them if you can. Look engaged. Point things out: "See this algae on the north side? That's what soft washing takes care of." This builds trust and justifies the price.
• Use the app's Guided Quote. It already has our pricing and a sliding scale (bigger jobs cost less per unit). You don't do mental math — you pick the service and size, it gives the number. Trust the tool.
• For a commercial lot, use the Map tool: draw the lot, it estimates spaces and prices it. One tap.

PRESENTING THE NUMBER (this is the part to practice)
• Say it plainly and then STOP TALKING. "For the full house soft wash, that's $399." Silence. Do not nervously discount before they even respond. The quiet feels long; let it sit.
• If they hesitate, don't drop the price — add value or offer the recurring discount: "I can do 20% off if we set it up to recur each year, since the algae always comes back."
• ALWAYS offer recurring. Recurring revenue is the entire point of this business. "Most folks have us come back yearly — want me to set that up at the discounted rate?"

THE THINGS THAT MAKE A QUOTE FEEL FAIR (not cheap)
• You looked at it in person.
• You explained what's included (and what's not).
• You wrote it down / put it in the app and can text or print it cleanly. Looking professional lets us charge professional prices.

DON'T
• Don't undercut yourself out of nervousness. Our prices are already market-researched and fair.
• Don't quote a roof or big job you're unsure about on the spot — "Let me get you an exact number by tonight" is a perfectly strong answer.
• Don't forget the add-ons: gutters, windows, dryer vent. "While we're out, want us to knock out the gutters too?" More money per stop.`,

{key:"dothejob",title:"Doing the job so they never call anyone else",mins:7,body:`Getting the customer is hard. KEEPING them is easy — if the work and the experience are good. This is where reliability (our whole brand) is proven or broken.

THE STANDARD: leave it better than they imagined, and make it obvious.
• BEFORE photos and AFTER photos, every job. This is non-negotiable. It proves the work, it's free marketing, and it's your proof if anyone disputes.
• Protect their stuff: wet down plants before/after soft washing (the solution can burn them), move what needs moving, don't blast cars or windows you weren't hired for.
• Clean up after yourself completely. Coil hoses, pick up any debris, leave no trace but the clean surface.

SAFETY (we are no good to anyone hurt)
• Ladders and roofs: never alone if avoidable, never in wind. We SOFT wash roofs from the ground when we can.
• Chemicals: soft-wash solution is bleach-based — eye protection, don't mix chemicals, keep it off people, pets, and plants.
• Electricity + water don't mix — mind outlets, fixtures, and panels.

BEING PROFESSIONAL ON SITE (the brothers especially)
• Show up when we said. If we're running late, TEXT them — a heads-up turns a complaint into "wow, they communicate."
• Uniform/clean clothes, friendly, no cursing on site, truck not a mess.
• If you find a problem (a leak, a broken board, a wasp nest), photograph it and tell them. Now you're the trusted eyes on their property — that's house-watch and more work.

THE HANDOFF
• When done, walk them through it (or text the after photos if they're not there): "All done — here's the before and after. We protected the plants and cleaned up. Anything else look like it needs attention?"
• That last question opens the door to the next sale, naturally.`,

{key:"aftercare",title:"After the job: reviews, recurring & keeping them",mins:6,body:`The job isn't over when the truck is loaded. The 10 minutes after a job is where future money is made. Cheap to do, huge payoff.

1) ASK FOR THE REVIEW — every time, right then
• While they're happy and looking at the clean result: "If you were happy with this, the best thing you could do for our small business is leave us a quick Google review — it really helps. I can text you the link right now." Then actually text it.
• Reviews are what make us show up on Google. More reviews = more free leads forever.

2) ASK FOR THE REFERRAL
• "Do you know any neighbors or other folks who could use this? We give a little thank-you for anyone you send our way." Word of mouth closes better than any ad.

3) LOCK IN RECURRING
• "Since the algae always comes back, most folks have us return yearly at 20% off — want me to put you on the schedule so you don't have to think about it?" In the app, set them as a recurring customer so we follow up.

4) FOLLOW UP LATER (this is what separates us)
• A few days after: a short text — "Hope everything still looks great! Let us know if you need anything." Costs nothing, makes you unforgettable.
• Note in their customer record what we did and when, so next time we look like we remember them (because we will).

5) HANDLE COMPLAINTS LIKE GOLD
• If something's wrong, fix it fast and without arguing. "I'm sorry about that — we'll make it right." A well-handled complaint creates a more loyal customer than a perfect job. Never get defensive.

THE WHOLE POINT: a one-time $399 wash, done right and followed up, becomes a yearly account that also buys gutters, house-watch, and refers their neighbors. That's how we grow without spending on ads.`,

jam:[
{key:"products",title:"Know your products (the tech)",mins:12,body:`Jamieson is the premium, expert side. Customers pay for your KNOWLEDGE, not the box. So you have to actually know this. The full detail is in the Product & Install Guide; here's the working knowledge you carry in your head.

SMART LOCKS — first two questions on every job: how does it talk, and how does it mount?
• How it talks: Wi-Fi (joins home wifi, simplest, the default for most rentals, but needs good wifi AT THE DOOR), Z-Wave/Zigbee (needs a hub, best battery + scales to many doors — for PMs with lots of units), Bluetooth (no remote access — owner homes only), offline PIN like igloohome (no internet needed — for bad-wifi rentals).
• How it mounts: full deadbolt (cleanest, most features) vs retrofit like August (keeps the existing key, 10-minute install, HOA-friendly).
• Go-to for OBX rentals: a Wi-Fi deadbolt (Yale Assure 2 is the workhorse) unless wifi is weak at the door or it's a many-door PM.

STARLINK — it's about a clear view of sky + a clean cable path inside. Customer buys the $349 kit; we install. Standard, roof-pivot-mount, or pole-mount depending on the roof. Add a mesh node if the router can't cover the whole rental.

CAMERAS — the fork is PoE (wired) vs Wi-Fi. PoE records to a local NVR with NO monthly fee, higher res, far more reliable — recommend it for anyone with 4+ cameras. Wi-Fi cameras are cheaper up front but usually have monthly fees and drop under load.

NETWORKING (your home turf) — most "my lock/camera stopped working" calls are really WIFI COVERAGE problems. So networking underpins everything. Mesh for most homes; UniFi (your specialty) for big homes, multi-unit, commercial.

CLIMATE & LIGHTING — smart thermostats (low-voltage, no electrician, great for rentals), and permanent LED outdoor lighting (high-ticket, your wheelhouse, sell into the fall).

THE LICENSE LINE — burn this in: low-voltage, network, battery, plug-in, and mounting are YOU. Line-voltage (hardwired switches, panels) is a licensed electrician — partner it out. Staying on the right side of this protects you and the customer.

THE GOLDEN RULE: never sell just the device. Sell the working outcome — lock + wifi-at-the-door + code setup; camera + cable + NVR + app. That's why our quotes are higher AND fairer than a box-store DIY, and why they actually work.`,

{key:"getclients",title:"Where Jamieson customers come from",mins:7,body:`Jamieson is relationship- and search-driven, not a numbers game. Premium tech buyers want an expert they trust, not the cheapest guy.

#1 — CROSS-SELL THROUGH OBX (your unfair advantage)
• Every property manager and homeowner OBX Lot Solutions serves is a Jamieson lead. They already trust us at their property. "While we're out — did you know we also do Starlink, smart locks, and cameras for rentals?"
• Vacation-rental managers are the jackpot: they need locks, wifi, and cameras on EVERY door. Land one PM and it's tech work across their whole portfolio.

#2 — GOOGLE BUSINESS PROFILE + WEBSITE (search intent)
• People searching "OBX Starlink installer" or "smart lock installer Outer Banks" are ready to hire. Our GBP and the website (already built) are how they find us. Publish the site, set up the profile.

#3 — REFERRALS (premium work refers well)
• A homeowner who loves their new setup tells their neighbor. Ask. High-ticket installs have high trust and refer strongly.

#4 — TARGETED SEARCH ADS (small budget, later)
• A small budget on high-intent terms ("OBX Starlink install") reaches people who are ready to buy. Not impressions — buyers.

WHO WE TARGET: vacation-rental owners and managers (recurring, multi-door), then homeowners wanting security/automation/wifi, then small businesses needing cameras/networking.

THE PLAY: OBX gets us in the door cheap and proves we're reliable. Jamieson is the high-margin work we walk into once we're trusted. They feed each other.`,

{key:"sales",title:"The expert conversation (consultative selling)",mins:11,body:`Jamieson sales is different from OBX. You're not pitching a cheap service — you're being the trusted expert who designs the right solution. You don't need to be slick; you need to be the calm person who clearly knows more than they do. You ARE that person. Here's how to run the conversation.

THE MINDSET
• You're a consultant, not a salesman. Your job is to diagnose, then prescribe. A doctor doesn't nervously discount — they tell you what you need. Same here.
• Sell the OUTCOME, never the gadget. They don't want a "smart lock" — they want to stop driving over to let guests in. They don't want "a camera" — they want to know their rental is safe. Talk about their problem and their result.

THE DISCOVERY QUESTIONS (ask these, then shut up and listen)
• "Tell me what's frustrating you right now with [the rental / the wifi / access]."
• "How are you handling it today?" (find the pain)
• "How many doors / how big is the place / how's the wifi out there?" (this scopes the job)
• "Is this one property or several?" (PMs = bigger opportunity)
Listening here is the whole sale. The more they talk, the more you learn what to recommend — and the more they trust you.

THE RECOMMENDATION (be the expert)
• Tie it back to what they said: "Since you've got guests turning over every few days and the wifi's weak out there, I'd put in a Wi-Fi deadbolt with auto guest codes AND a mesh node so it never drops. That solves the lockout problem permanently."
• Explain the WHY in plain English. Confidence comes from explaining, not from jargon. Avoid acronym soup — say "so it never drops" not "to mitigate packet loss."

HANDLING "HOW MUCH?" AND PRICE PUSHBACK
• Don't flinch. State it and explain the value: "It's $X installed — that's the lock, the wifi coverage that makes it actually work, the guest-code setup, and me making sure it all runs. A box-store lock alone is cheaper, but it'll drop offline and you'll be back to driving over." Then stop talking.
• "Can you do it cheaper?" → "I can scope it to your budget — we could phase it, do the locks now and cameras later. But I won't cut the part that makes it reliable, because then it's not worth either of our time." Honesty like this WINS premium customers.
• "I can buy that lock on Amazon for less." → "Absolutely, the hardware's the same. What you're paying me for is making sure it works with your wifi, the guest codes are set up, and you've got someone local to call. That's the part that fails when people DIY it."

THE CLOSE (soft, confident)
• "Want me to put together a quote for that setup?" or "I can come scope it and have you an exact number — does this week work?"
• For PMs: "If this goes well on one unit, I'd love to be your guy for the whole portfolio."

You earn premium money by being the calm expert who tells the truth. That's not a personality you have to fake — it's just knowing your stuff (Module 1) and caring whether it actually works.`,

{key:"quoting",title:"Quoting the outcome",mins:7,body:`Jamieson quotes are bigger and more detailed than OBX. The way you build and present them is what makes a $379 lock install feel fair instead of expensive.

BUILD IT IN THE APP
• Use the Guided Quote. Pick the real line items — it's built to quote the OUTCOME, not just the part. A lock job isn't one line; it's: the lock (supply + install), wifi-at-the-door if needed, the PIN/code + PMS setup, and any mesh node.
• This itemization is a feature, not busywork: when the customer sees everything that's included, the price makes sense. A single big number with no breakdown feels scary; a clear list feels professional.

THE HARDWARE-VS-LABOR TRUTH
• Hardware is near pass-through (they could buy it themselves). Your LABOR and expertise are the product. Price your time — tech labor is your premium rate, worth far more than your old hourly. Don't apologize for it.

PRESENTING IT
• Walk them through the line items: "So this covers the lock, the mesh node so it never drops, the guest-code setup, and the whole thing tested and handed off to you." Then the total. Then stop.
• Tie every line back to a problem they told you about. That's what makes it feel custom and fair.

THE BUNDLE (more value, easier yes)
• Rentals: Starlink/wifi + smart lock + thermostat + cameras = the "rental-ready" package, sold per door. PMs love one number for a turnkey unit.
• Always mention the bundle even if they only asked about one piece: "Most rental owners do the lock and wifi together since one needs the other — want me to quote both?"

WHEN TO NOT QUOTE ON THE SPOT
• If it needs a site survey (wifi signal, cable paths, roof for Starlink), say so: "Let me scope the signal and cable run and I'll have you an exact number tonight — I'd rather be right than guess." That's the expert answer, and it protects your margin.

THE LICENSE LINE IN QUOTING
• If a job needs line-voltage electrical work, quote your part and note the electrician separately. Never quote work you're not licensed to do.`,

{key:"dothejob",title:"Doing the install right",mins:8,body:`A Jamieson install that works flawlessly and looks clean is what justifies the premium and earns the next job. A callback for something that drops offline destroys trust and eats your margin. Here are the rules that prevent that.

THE NUMBER ONE RULE: WI-FI AT THE DOOR
• Before you install any connected device, check the wifi signal exactly where it'll live. Weak signal is the #1 cause of callbacks. If it's weak, add coverage (mesh node / access point) — quote it, don't skip it. A lock that drops offline is worse than no lock.

TEST EVERYTHING BEFORE YOU LEAVE
• Lock: lock/unlock from the app, test a guest code, confirm it reports online. Camera: view the feed remotely (off wifi), check motion zones, confirm it's recording. Network: walk the property with your phone and confirm coverage everywhere it matters.
• "It worked when I left" must mean you actually tested it the way the customer will use it — including from off-site for remote features.

CLEAN, PROFESSIONAL WORK
• Cable runs hidden and tidy, sealed entries (coastal weather is brutal — a bad seal leaks), mounts level and solid (older OBX doors and walls are often out of square — shim and fit properly).
• Firmware updated, accounts set up properly, strong unique passwords (not "admin/admin").

DOCUMENT IT
• Photos of the install, note the gear installed, accounts/codes created, passwords stored securely for handoff. This makes the next visit faster and looks deeply professional.

SAFETY & THE LICENSE LINE ON SITE
• Ladders/roofs for Starlink: never in wind, never carelessly. Low-voltage only — if you hit anything line-voltage, stop and bring in the electrician. No exceptions; it's your license and their safety.

THE GOAL: it works the first time, every time, and looks like a pro did it. That's a customer for life and a referral engine.`,

{key:"aftercare",title:"Handoff, care & referrals",mins:6,body:`The handoff is where a premium customer becomes a loyal one. Tech that the customer can't use, or doesn't understand, generates callbacks and bad feelings even when the install is perfect. Nail the ending.

THE HANDOFF (train the customer)
• Walk them through using it, in their words: how to add a guest code, where to view the camera, what to do if the wifi blips. Hand them something simple (even a quick text with the key steps).
• Set expectations honestly: battery life ("the lock batteries last 6-12 months — I can come swap them or you can"), what needs occasional updates, who to call. Setting expectations prevents 'it broke' calls that aren't really breakage.

THE REVIEW & REFERRAL ASK
• "If you're happy with how this turned out, a Google review would mean a lot for the business — I'll text you the link." Premium reviews are gold for ranking on high-intent searches.
• "If you know other rental owners or neighbors who need this kind of setup, I'd love an introduction." High-ticket work refers extremely well because trust is high.

THE RECURRING / PORTFOLIO PLAY
• For PMs: "That unit's done — when you're ready, I can do the rest of your doors the same way." One good install is your audition for the whole portfolio.
• Offer ongoing care: battery swaps, firmware checks, adding doors over time. Recurring touchpoints = recurring revenue and you stay their guy.

FOLLOW UP
• A week later: "Everything still running smooth? Guest codes working ok?" Costs nothing, makes you unforgettable, and surfaces the next job.
• Log everything in the customer record — what you installed, passwords/accounts, when. Next time you look like you remember every detail (because the app does).

COMPLAINTS = OPPORTUNITY
• If something drops or fails, respond fast and own it: "I'll get that sorted." A tech issue handled quickly builds MORE trust than a job with no issues. Never get defensive, never blame the customer's wifi without checking.

THE WHOLE POINT: one flawless install + a clean handoff + a follow-up turns one door into a whole portfolio and a stream of referrals. That's how Jamieson scales on trust, not ad spend.`,

let TRMOD=null;
function trList(){return TRAINING[S.biz]||[];}
function trModObj(key){return trList().find(m=>m.key===key);}
function trK(key){return S.biz+"_"+key;}
function trProg(){const u=curUser();return (u&&u.training)||{};}
function trStat(key){return trProg()[trK(key)]||null;}
function rTraining(){
  if(TRMOD)return rTrainMod();
  const mods=trList(),prog=trProg();
  const done=mods.filter(m=>{const s=prog[trK(m.key)];return s&&s.done;}).length;
  const pct=mods.length?Math.round(done/mods.length*100):0;
  const bizName=S.biz==="obx"?"OBX Lot Solutions":"Jamieson Automation";
  let h=`<div class="secthd"><h2>Training · ${bizName}</h2></div>`;
  h+=`<div class="card"><div class="row"><div class="grow"><strong>Your progress</strong><div class="sub">${curUser()?esc(curUser().username)+" — ":""}${done} of ${mods.length} modules signed off</div></div><div style="font-size:24px;font-weight:800;color:var(--brand)">${pct}%</div></div>
    <div style="height:9px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent);transition:width .3s"></div></div></div>`;
  if(!curUser())h+=`<div class="card" style="border-left:4px solid var(--accent)"><strong>Sign in to record your sign-off.</strong><div class="sub">Open the Data tab and sign in (or create an account) so completed modules save under your name. You and each brother track your own.</div></div>`;
  h+=`<div class="card">`+mods.map((m,i)=>{const st=trStat(m.key);
    const badge=st&&st.done?`<span class="badge" style="background:#1b7f4d;color:#fff">✓ ${st.score}/${st.total}</span>`:`<span class="badge" style="background:var(--soft);color:var(--muted)">Not done</span>`;
    return `<div class="li" style="cursor:pointer" onclick="trOpen('${m.key}')"><div class="grow"><div class="nm">${i+1}. ${esc(m.title)}</div><div class="sub">${m.mins} min · ${m.quiz.length} questions${st&&st.done?" · signed off "+esc(st.date)+(st.by?" by "+esc(st.by):""):""}</div></div>${badge}</div>`;
  }).join("")+`</div>`;
  h+=`<p class="muted" style="margin:8px 4px">Read each module, then pass the quick check to sign off. The deeper field references live in the project folder (Service Guide, Product &amp; Install Guide).</p>`;
  view.innerHTML=h;
}
window.trOpen=function(key){TRMOD=key;render();};
window.trClose=function(){TRMOD=null;render();};
function rTrainMod(){
  const m=trModObj(TRMOD);if(!m){TRMOD=null;return rTraining();}
  const st=trStat(m.key),need=Math.ceil(m.quiz.length*0.7);
  let h=`<div class="secthd"><button class="btn ghost sm" onclick="trClose()">‹ All modules</button></div>`;

function mBars(rows){
  const max=Math.max.apply(null,rows.map(r=>r.v))||1;
  return `<div class="mbars">`+rows.map(r=>`<div class="mbar"><div class="mbl">${esc(r.l)}</div><div class="mbt"><div class="mbf" style="width:${Math.max(4,Math.round(r.v/max*100))}%"></div></div><div class="mbv">${esc(r.n)}</div></div>`).join("")+`</div>`;
}
function mDonut(rows){
  const colors=["#1B2A4E","#8BC34A","#0099E5","#e0a800","#c0392b","#6b7280","#9b59b6"];
  let acc=0;const R=54,C=2*Math.PI*R;
  const segs=rows.map((r,i)=>{const frac=r.v/100,len=frac*C,dash=len+" "+(C-len),off=-acc*C;acc+=frac;return `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${colors[i%colors.length]}" stroke-width="22" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"></circle>`;}).join("");
  const legend=rows.map((r,i)=>`<div class="lg"><span class="sw" style="background:${colors[i%colors.length]}"></span>${esc(r.l)} — ${r.v}%</div>`).join("");
  return `<div class="mdonut"><svg viewBox="0 0 140 140" width="140" height="140" style="flex:0 0 auto">${segs}</svg><div class="mlg">${legend}</div></div>`;
}
function mSrc(arr){return `<div class="msrc">Sources: `+arr.map(s=>`<a href="https://${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`).join(" · ")+`</div>`;}
function mComp(c){
  let h=`<div class="mcard"><div class="mt">${esc(c.name)}${c.tag?`<span class="mtag">${esc(c.tag)}</span>`:""}</div>`;
  if(c.url)h+=`<div class="mu"><a href="https://${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></div>`;
  const f=[];
  if(c.where)f.push(["Where",c.where]);if(c.services)f.push(["Services",c.services]);
  if(c.pricing)f.push(["Pricing",c.pricing]);if(c.reviews)f.push(["Reviews",c.reviews]);
  if(c.years)f.push(["In business",c.years]);if(c.size)f.push(["Est. size",c.size]);
  if(c.rev)f.push(["Revenue",c.rev]);if(c.model)f.push(["What's different",c.model]);
  if(c.note)f.push(["Takeaway",c.note]);
  h+=`<div style="font-size:12.5px;margin-top:5px;line-height:1.5">`+f.map(x=>`<div><b>${x[0]}:</b> ${esc(x[1])}</div>`).join("")+`</div></div>`;
  return h;
}
function mStream(s){
  return `<div class="mcard"><div class="mt">${esc(s.name)}${s.inIt?`<span class="mtag">we do this</span>`:`<span class="mtag gap">add this</span>`}</div>
    <div style="font-size:12.5px;margin-top:4px;line-height:1.5"><div><b>Customer:</b> ${esc(s.who)}</div><div><b>Typical ticket:</b> ${esc(s.ticket)}</div><div><b>Frequency:</b> ${esc(s.freq)}</div><div><b>Lifetime value:</b> ${esc(s.ltv)}</div>${s.note?`<div style="margin-top:3px;color:var(--muted)">${esc(s.note)}</div>`:""}</div></div>`;
}
function mLever(l){

    <div style="font-size:12.5px;margin-top:4px;line-height:1.5"><div><b>Investment:</b> ${esc(l.invest)}</div><div><b>Time horizon:</b> ${esc(l.horizon)}</div><div><b>Failure mode:</b> ${esc(l.fail)}</div>${l.caseStudy?`<div style="margin-top:4px"><b>Real example:</b> ${esc(l.caseStudy)}</div>`:""}</div></div>`;

function mSect(t,sub){return `<div class="secthd"><h2>${t}</h2></div>`+(sub?`<p class="muted" style="margin:0 4px 4px">${esc(sub)}</p>`:"");}
function mAcc(title,body,open){return `<details class="macc"${open?" open":""}><summary>${esc(title)}</summary><div class="maccb">${body}</div></details>`;}
function mCallout(type,title,body){return `<div class="cal ${type||""}"><b class="h">${esc(title)}</b>${esc(body)}</div>`;}
function mTimeline(){return `<div class="tline"><div class="seg" style="background:var(--accent);color:var(--accent-ink)">0-30 days</div><div class="seg" style="background:var(--brand)">31-60 days</div><div class="seg" style="background:#0070b8">61-90 days</div></div>`;}

function mIndustry(ind){
  let h=`<div class="card" style="border-left:5px solid var(--accent)"><div class="nm" style="font-size:16px">${esc(ind.name)}</div><div class="sub">${esc(ind.tag||"")}</div></div>`;

  if(ind.chart)h+=`<div class="card"><strong>${esc(ind.chart.title)}</strong>`+(ind.chart.type==="donut"?mDonut(ind.chart.rows):mBars(ind.chart.rows))+(ind.chart.note?`<div class="sub">${esc(ind.chart.note)}</div>`:"")+`</div>`;
  h+=`<div class="secthd"><h2>Who owns this pie</h2></div><div class="card">`+ind.players.map(p=>`<div class="li"><div class="grow"><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.note)}</div></div></div>`).join("")+`</div>`;

  if(ind.sources)h+=`<div class="card">`+mSrc(ind.sources)+`</div>`;
  return h;
}
function mReport(r){
  if(!r)return `<div class="empty" style="padding:16px">No report yet.</div>`;
  let h=`<div class="card"><div class="nm" style="font-size:16px">${esc(r.name)}</div><div class="sub">${esc(r.tagline)}</div></div>`;

  h+=mAcc("Market size — how big is the pie",size,true);

  h+=mAcc(`Comparable companies (${r.comparables.length}) — templates to grow into`,(r.compNote?`<p class="muted" style="margin:0 0 6px">${esc(r.compNote)}</p>`:"")+`<strong style="font-size:12px">Side-by-side</strong>`+mCompTable(r.comparables)+`<div class="sub" style="margin:8px 0 4px">Full profiles below.</div>`+r.comparables.map(mComp).join(""),false);
  h+=mAcc(`How money comes in (${r.streams.length} streams)`,r.streams.map(mStream).join(""),false);
  h+=mAcc(`How it grows (${r.levers.length} levers)`,r.levers.map(mLever).join(""),false);

}

{name:"Junk removal",inIt:true,who:"PMs, absentee owners, estate/rental clean-outs",ticket:"$350-850 per job",freq:"Episodic; spikes at rental turnover & estate clean-outs",ltv:"$700-2,500/yr from repeat PM accounts",note:"Needs the trailer (gating item). Fast-growing national market (~8%/yr). Pairs with the same customers."},
{name:"Gutters & windows (add-on)",inIt:true,who:"Existing wash/home-watch customers",ticket:"$149+ gutters; $150-370 window visit",freq:"~Twice a year",ltv:"$600-1,500/yr as recurring add-ons",note:"Do not lead with these (saturated) — attach them to existing accounts at near-zero acquisition cost."},
{name:"Seasonal: holiday lighting + storm prep",inIt:false,who:"Residential + commercial, second-home owners",ticket:"Holiday lighting quote-based (often $500-2,000+); storm board-up premium",freq:"Q4 lighting; hurricane-season storm prep",ltv:"$1,000-3,000/yr, highly seasonal",note:"ADD THIS. Holiday lighting fills the Q4 off-season; Jamieson can install permanent LED systems for an even bigger ticket. Storm prep is urgent + premium."},
{name:"Recurring maintenance subscriptions",inIt:false,who:"PMs and absentee owners wanting one worry-free vendor",ticket:"Bundled monthly fee covering watch + wash + add-ons",freq:"Monthly recurring",ltv:"$2,000-6,000/yr per home, very sticky",note:"ADD THIS. Package watch + seasonal washing + gutter/dryer-vent into one monthly plan. Predictable revenue is what makes the business sellable."},
{name:"Specialty add-ons: dryer-vent, trash-bin, deck seal, HVAC coil",inIt:false,who:"Existing residential customers",ticket:"$15 bin / $130 dryer-vent / $349+ deck seal",freq:"Recurring/subscription",ltv:"$300-900/yr extra per home",note:"ADD CHEAPLY. More money per stop with tools you mostly already own."}],
levers:[
{name:"Land recurring contracts with PMs & HOAs",invest:"Sweat only — calls + walkthroughs + reliability",horizon:"30-90 days to first contract",fail:"Flaking on schedule once you win it; PMs drop unreliable vendors instantly. Reliability IS the product.",caseStudy:"Men In Kilts built its whole franchise model on converting one-off calls into subscription relationships."},
{name:"Bundle into a whole-home / one-visit offer",invest:"Low — packaging + training, maybe a few tools",horizon:"Immediate; raises ticket on existing jobs",fail:"Over-promising services you cannot deliver well; quality slips and reviews suffer.",caseStudy:"Shack Shine invented 'house detailing' (wash + gutters + windows + lights in one visit) to raise average ticket and scale."},
{name:"Add junk removal (buy the trailer)",invest:"$2,000-6,000 used trailer + dump fees",horizon:"1-3 months to ramp",fail:"Underpricing loads / dump-fee surprises eating margin; not having the trailer when the PM calls.",caseStudy:"US junk removal is ~$10.4B growing ~8%/yr; franchises like 1-800-GOT-JUNK scaled this exact service."},
{name:"Route density + a second truck/crew",invest:"$15-40k for a second truck + a $20-30/hr operator",horizon:"6-18 months — only after recurring work fills the calendar",fail:"Adding crew before demand exists; the Georgetown operator made MORE money solo than with 8 staff. Scale only on full recurring schedule.",caseStudy:"Industry data: one properly-priced truck ~$300k/yr; $500k+ needs a second crew AND the contracts to feed it."},
{name:"Seasonal high-ticket: holiday lighting (Q4)",invest:"Lighting inventory + ladders; Jamieson can install permanent LED",horizon:"One season to establish; recurring each year",fail:"Buying too much inventory before demand; safety on ladders/roofs.",caseStudy:"Christmas Decor franchisees post median sales ~$205k (range $200k-600k); installers can clear ~$16k profit in a 2-month window, and existing service businesses that add lighting see 25-45% margins vs 10-15% on their base service. Outdoor-lighting market heading to ~$35.6B by 2030 (+13.7%/yr)."},
{name:"Acquire a retiring competitor or their client/route list",invest:"Varies — often ~0.5-1x annual revenue, or buy the client list/equipment cheaply",horizon:"Opportunistic — when a local operator retires or burns out",fail:"Overpaying for goodwill that walks away; buying a book of one-off (not recurring) customers that do not stick.",caseStudy:"Wipliance (AV) grew $5.6M -> $8.5M partly by acquiring an established local shop. Same applies here: many OBX solo washers will age out — buying their recurring accounts beats cold outreach."},
{name:"Brand + reviews + Google/LSA to lower acquisition cost",invest:"$0 for GBP/reviews; $200-300/mo for Local Services Ads later",horizon:"Reviews compound over months",fail:"No review-ask system = invisible on Google; paying for Angi/Thumbtack leads (a money pit) instead.",caseStudy:"Local-service customers start on Google; reviews drive the local-pack ranking that brings free leads forever."}],
examples:[
{tier:"Small — part-time / starting out",rev:"$80k-120k/yr",detail:"One person, mostly residential soft/pressure washing, customers from word-of-mouth + a Google profile + Nextdoor. Charges $299-549 per house wash, a few driveways a week. Margins thin until reviews and recurring plans build up. This is OBX Lot Solutions today with the brothers' part-time labor."},
{tier:"Mid — lean solo/duo, priced right",rev:"$250k-300k/yr",detail:"Solo or one helper, mix of residential washing + a handful of commercial recurring lots + home-watch accounts. Prices confidently, runs tight (~$50-60k expenses), keeps 25-35%. Mirrors the Georgetown KY operator who outperforms bigger crews by staying lean. Realistic 2-3 year target."},
{tier:"Upper — multi-crew, contract-fed",rev:"$500k-1M/yr",detail:"One to three trucks/crews fed by recurring commercial + PM/HOA contracts, junk removal, and seasonal lighting. Owner mostly sells and manages; operators run routes at $20-30/hr. Requires the recurring book to justify the headcount — add crew only after the calendar is full."}],
industries:[
{key:"washing",name:"Pressure & soft washing",tag:"The engine of the business.",kpis:[{n:"$1.2B",l:"US revenue (2024)"},{n:"~34,000",l:"US businesses"},{n:"+5.8%/yr",l:"new businesses"},{n:"~0.6%/yr",l:"revenue growth"}],size:"A $1.2B national market spread across ~34,000 mostly-tiny operators. Business count grows ~5.8%/yr but revenue only ~0.6%/yr — more people splitting a slow-growing pie. The lesson: win on reliability and price discipline, not by being one more cheap solo washer.",chart:{title:"How the national market splits (estimated)",type:"donut",rows:[{l:"Solo & small local",v:85},{l:"Regional multi-truck",v:10},{l:"National franchises",v:5}]},players:[{name:"Local solo washers & handymen",note:"Your real day-to-day competition — one person, word-of-mouth, inconsistent."},{name:"Men In Kilts",note:"Franchise; bundles window/gutter/wash into recurring (~$149k avg/location)."},{name:"Shack Shine",note:"Whole-home detailing franchise; one-visit bundle + holiday lights."},{name:"Window Gang / Spray-Net",note:"Other exterior-cleaning franchises with small national share."}],note:"Lead with soft washing (it kills the coastal algae), convert every wash to a recurring yearly plan, and out-professional the solo crowd.",sources:[{t:"IBISWorld",u:"www.ibisworld.com/united-states/industry/pressure-washing-services/6538/"}]},
{key:"junk",name:"Junk removal",tag:"Bigger, faster-growing, consolidating.",kpis:[{n:"$10.4B",l:"US market (2023)"},{n:"~8%/yr",l:"growth"},{n:"~43%",l:"top-6 franchise share"}],size:"Far larger and faster-growing than washing (~$10.4B, ~8%/yr) and the one slice that is CONSOLIDATING — the top six franchises hold ~43%. On the OBX those nationals are weak, leaving an open lane for a local hauler with a trailer.",chart:{title:"Market structure",type:"donut",rows:[{l:"Top-6 franchises",v:43},{l:"Everyone else",v:57}],note:"Franchise-led nationally, wide open locally."},players:[{name:"1-800-GOT-JUNK?",note:"The category leader; brand + call center."},{name:"College Hunks Hauling Junk",note:"Fast-growing franchise."},{name:"Junk King / JDog / Junkluggers",note:"Other national franchises; JDog is veteran-run."}],note:"Buy a used trailer (the gating item) and sell junk removal to the same PMs and absentee owners at turnovers and clean-outs.",sources:[{t:"Junk removal market",u:"www.globalgrowthinsights.com/market-reports/junk-removal-franchise-market-115275"}]},
{key:"watch",name:"Home watch",tag:"Small ticket, high margin, sticky.",kpis:[{n:"$34-68",l:"per visit"},{n:"~$7.4k/mo",l:"solo @ 20 hrs/wk"},{n:"Monthly",l:"recurring"}],size:"Low-ticket but the highest-margin, stickiest leg: $34-68 per 20-30 minute visit, recurring monthly, near-zero materials. A part-time operator can net ~$7,400/mo at 20 hrs/wk. The OBX is a textbook market — a majority of homes are absentee-owned.",chart:{title:"Typical visit pricing",type:"bars",rows:[{l:"Condo / basic",v:34,n:"$34"},{l:"National avg",v:44,n:"$44"},{l:"2025 standard",v:62,n:"$60-65"}],note:"Pricing has been rising — do not underprice."},players:[{name:"Local property managers",note:"Outer Banks Blue, Brindley Beach, KEES — bundle checks for owners (competitor + customer)."},{name:"Distinct Home Watch (Naples model)",note:"Shows the leg can scale into the millions with concierge add-ons."},{name:"NHWA-accredited solos",note:"Accreditation builds trust with absentee owners."}],note:"This is your wedge: once you are the trusted eyes at a property, you get the washing, junk, AND the Jamieson tech work.",sources:[{t:"Home-watch pricing",u:"www.yourhwp.com/home-watch-pricing"}]},
{key:"commercial",name:"Commercial lot & storefront cleanup",tag:"Recurring contracts are the prize.",kpis:[{n:"By size",l:"priced per lot/space"},{n:"Daily/wkly",l:"recurring"},{n:"PMs",l:"control many sites"}],size:"Litter, debris, dumpster-area and storefront cleanup priced by lot size (use the Map tool). Less glamorous but the most schedulable and the easiest to make recurring — and one property manager can mean many sites at once.",players:[{name:"Janitorial / facility-services firms",note:"Bigger players focus on interiors; exteriors are under-served."},{name:"Landscapers moonlighting",note:"Sometimes bundle cleanup; inconsistent."},{name:"Property managers / HOAs",note:"The buyers — land one and win the portfolio."}],note:"Chase recurring commercial/PM contracts here; predictable monthly revenue is what makes the whole business stable and sellable."}
],
