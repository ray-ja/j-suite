<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1b2330; --muted:#6b7280; --line:#e2e7ee; --soft:#f7f9fb;
    --brand:#1B2A4E; --accent:#8BC34A; --accent-ink:#2c4a00; --danger:#c0392b;
  }
  body[data-biz="jam"]{ --brand:#002052; --accent:#0099e5; --accent-ink:#003a66; }
  body.dark{ --bg:#0f141b; --card:#1a212b; --ink:#e7ecf2; --muted:#94a1b2; --line:#2a333f; --soft:#222b36; --danger:#e8705f; }
  body.dark[data-biz="jam"]{ --accent:#37b0f0; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:72px}
  header{background:var(--brand);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px}
  .logo{font-weight:800;font-size:18px;letter-spacing:.5px;line-height:1}
  .logo .ac{color:var(--accent)}
  .bizsel{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}
  .bizsel option{color:#1b2330;background:#fff;font-weight:600}
  .wrap{max-width:780px;margin:0 auto;padding:14px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 4px 8px}
  h2:first-child{margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .nm{font-weight:700;font-size:16px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .s-Lead{background:#eef2ff;color:#3b46c4}.s-Contacted{background:#fff4e5;color:#b26a00}
  .s-Quoted{background:#e7f0ff;color:#1f5fbf}.s-Won{background:#e7f7ea;color:#1d8a3a}.s-Lost{background:#fdecec;color:#c0392b}
  .p-High{background:#fdecec;color:#c0392b}.p-Medium{background:#fff4e5;color:#b26a00}.p-Low{background:#eef2ff;color:#3b46c4}
  .subnav{display:flex;gap:6px;margin:0 4px 12px;flex-wrap:wrap}
  .subbtn{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600}
  .subbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .m-Planned{background:#eef2ff;color:#3b46c4}.m-Active{background:#e7f7ea;color:#1d8a3a}.m-Paused{background:#fff4e5;color:#b26a00}.m-Done{background:#eceff3;color:#5b6677}
  .maptop{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  #map,#smap{height:60vh;min-height:320px;border-radius:12px;border:1px solid var(--line);z-index:1}
  .leaflet-container{font:inherit}
  .acwrap{position:relative}
  .acbox{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:50;max-height:210px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .acitem{padding:9px 11px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}
  .acitem:last-child{border-bottom:none}
  button{font-family:inherit;cursor:pointer}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;width:100%}
  .btn.acc{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
  .btn.sm{width:auto;padding:9px 13px;font-size:14px}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 2px 4px}
  textarea{min-height:70px;resize:vertical}
  .search{margin-bottom:10px}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
  nav button{flex:1;background:none;border:none;padding:9px 0 8px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.on{color:var(--brand)}
  nav .ic{font-size:20px;line-height:1}
  .fab{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;font-size:30px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:25;display:flex;align-items:center;justify-content:center}
  .overlay{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 26px;position:relative}
  .shead{display:flex;align-items:center;margin-bottom:6px}
  .shead h3{font-size:18px}
  .shead .cl{margin-left:auto;background:none;border:none;font-size:24px;color:var(--muted);padding:0 4px}
  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:15px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .note{background:var(--soft);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
  .note .t{color:var(--muted);font-size:11px;margin-bottom:2px}
  .qline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .qline select{flex:1}
  .qline input.q{width:64px;text-align:center}
  .qline input.pr{width:84px;text-align:right}
  .qline .rm{background:none;border:none;color:var(--danger);font-size:20px;padding:0 4px}
  .totbar{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--accent);padding:12px 2px;margin-top:8px;display:flex;align-items:center}
  .totbar .lab{font-weight:700}.totbar .amt{margin-left:auto;font-size:22px;font-weight:800;color:var(--brand)}
  .toggle{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
  .toggle input{width:auto}
  .secthd{display:flex;align-items:center;margin:18px 4px 6px}
  .secthd h2{margin:0}
  .secthd .ct{margin-left:auto;color:var(--muted);font-size:13px}
  .syncpill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:none}
  .grid2{display:grid;grid-template-columns:1fr;gap:0}
  .calhead{display:flex;align-items:center;gap:12px;margin:4px 4px 10px}
  .calhead .mtitle{font-weight:800;font-size:17px}
  .calnav{background:var(--brand);color:#fff;border:none;border-radius:8px;width:34px;height:34px;font-size:18px;font-weight:700}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
  .caldow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
  .calcell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:56px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .calcell.out{background:transparent;border-color:transparent;cursor:default}
  .calcell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .calcell .dnum{font-size:12px;font-weight:700;color:var(--muted)}
  .calcell.today .dnum{color:var(--brand)}
  .caljob{background:var(--brand);color:#fff;border-radius:4px;font-size:10px;line-height:1.3;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .calmore{font-size:10px;color:var(--muted)}
  @media(min-width:900px){.calcell{min-height:92px}.caljob{font-size:11px}}
  /* ---------- DESKTOP ---------- */
  @media(min-width:900px){
    body{font-size:17px;padding-bottom:0}
    header{height:60px;padding:0 26px}
    .logo{font-size:22px}
    nav{top:60px;bottom:0;left:0;right:auto;width:224px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding-top:16px}
    nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:15px 24px;font-size:15px;width:100%}
    nav button.on{color:var(--brand);background:rgba(0,0,0,.035);box-shadow:inset 4px 0 0 var(--brand)}
    nav .ic{font-size:20px}
    .wrap{margin-left:224px;max-width:1180px;padding:26px 40px}
    h2{font-size:14px}
    .nm{font-size:17px}.sub{font-size:14px}
    .card{padding:18px 22px;margin-bottom:12px}
    .li{padding:13px 0}
    .fab{right:34px;bottom:34px;width:60px;height:60px}
    .overlay{align-items:center}
    .sheet{max-width:620px;max-height:88vh;border-radius:16px;padding:24px}
    .grid2{grid-template-columns:1fr 1fr;gap:0 28px}
    .empty{padding:60px 16px}
  }
  @media(min-width:1400px){ .wrap{max-width:1320px} .grid2{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>

  if(!S.propsV2){["obx","jam"].forEach(b=>{(S[b].customers||[]).forEach(c=>{
    const emb=(c.properties&&c.properties.length)?c.properties:(c.address?[{label:"Main",address:c.address}]:[]);

    if(c.properties)delete c.properties;});});S.propsV2=true;save();}
  if(!S.seeded){seedTodos();seedDocs();S.seeded=true;save();}

  add("obx","CHANNEL PLAN (cost · eyes · leads) — broke-friendly order\nRULE: spend sweat before dollars; spend first dollars only where you pay per RESULT (a lead), not per impression.\n\nTIER 0 — FREE, do now:\n- Google Business Profile + reviews — $0, the #1 free asset; ranks you for 'pressure washing near me'. Ask every customer for a review.\n- Direct PM outreach (the call list) — $0, your #1 channel; one PM = many doors.\n- Referrals + review asks — $0, highest close rate.\n- Nextdoor + local FB groups — $0, post before/after photos.\n- Door hangers — ~$0.12 each, brothers distribute free; 1-3% response = 5-15 calls per 500.\n- Truck magnets + shirts + yard signs — ~$100-200 once, cheap rolling visibility.\n\nTIER 1 — first ~$250/mo:\n- Google Local Services Ads (LSA) — $12-30/lead, pay-per-lead, 'Google Guaranteed'. $250/mo ~ 12 leads, 30-40% close = 4-5 jobs/mo. BEST first paid dollar. Move the $10/day Google Search into LSA.\n\nTIER 2 — ~$300-1,500/mo when cash flows:\n- Meta ads (before/after) — $300-800/mo, CPL ~$18-22 = ~18-22 leads/mo.\n- Vehicle wrap — $2,500-5,000 once, 30-70k impressions/day, $0.36 CPM (cheapest ad there is), recoup 3-6 mo.\n- EDDM direct mail — $0.30-0.60/piece, target second-home/rental zips for house-watch.\n\nTIER 3 — later: full local SEO (durable, compounding), retargeting, sponsorships.\n\nAVOID: Angi/Thumbtack — shared leads, ~$100-2,500 CAC, bad ROI. Skip while broke.\nFull detail: 'Marketing Channel Plan.md'.");
  add("jam","CHANNEL PLAN (cost · eyes · leads) — premium/relationship-driven\nJamieson wins on trust + search-intent, not impressions.\n\nTIER 0 — FREE, do now:\n- Google Business Profile + reviews — $0; rank for 'OBX Starlink installer', 'home automation OBX'.\n- Publish the website (already built) — your SEO foundation.\n- Outreach to vacation-rental managers — $0; sell Starlink/wifi/locks per door (cross-sell from OBX Lot Solutions PM relationships).\n- Referrals — $0; every clean install = a referral, so ask.\n- Nextdoor + local FB groups — $0, portfolio photos.\n\nTIER 1 — first ~$200/mo:\n- Small Google Search budget on high-intent terms ('OBX Starlink install', 'smart lock installer OBX') — buyers there are ready to hire. Use LSA where home-tech/security categories apply.\n\nTIER 2 — ~$300-1,000/mo when cash flows:\n- Targeted Meta ads for high-ticket installs (Starlink, permanent lighting) with strong before/after creative.\n- Vehicle wrap (shared with the work truck) — cheap impressions.\n\nTIER 3 — later: local SEO build-out, retargeting.\n\nAVOID: Angi/Thumbtack (bad ROI, shared leads).\nFull detail: 'Marketing Channel Plan.md'.");

  add("obx","MONEY ON THE TABLE (vs Pierce $15/hr, Chase $18/hr)\nThe point isn't a great hourly wage — it's that you keep the OWNER MARGIN above labor, which scales with the crew. Paying the brothers $18/hr, each job still nets the business: soft wash ~$248 ($71/clock-hr), pressure wash ~$126, house-watch ~$35 ($46/hr, recurring), junk ~$268 ($134/hr), windows ~$168, holiday lighting ~$856 ($214/hr). Every line beats the brothers' current wage AFTER paying them — so they get a raise and the business still profits.\n\nSCENARIOS (Ray owns 1/3): conservative ~$52k/yr business margin (Ray ~$17k), moderate ~$115k (Ray ~$38k), aggressive yr-2 two-crew ~$253k (Ray ~$84k).\n\nONE-STOP FRONT DOOR: OBX Lot Solutions is the single number a property manager calls for anything; Jamieson is the tech subcontractor; add more trades over time. MONEY RULE: when a job includes tech, Jamieson invoices that portion (Ray owns 100% of Jamieson vs 1/3 of OBX) — keep cleanup money in OBX, tech money in Jamieson.\n\nMORE SERVICES TO ADD: dryer vent ($100-187), deck/fence staining, trash-bin cleaning (subscription), pool/hot-tub service, dock/boat-bottom washing, HVAC coil cleaning, handyman/property maintenance, storm prep, golf-cart repair.\n\nFull detail: 'Opportunity Analysis — Is It Worth It.md' + 'Opportunity & Pricing Model.xlsx'.");
  add("jam","MONEY ON THE TABLE (vs Ray's $55/hr, ~$40k last year)\nEvery Jamieson hour is worth multiples of the escape room: Starlink install ~$135/Ray-hr (2.4x), rental tech package ~$175 (3.2x), permanent lighting ~$150 (2.7x), commercial AV/Q-Sys ~$206 (3.7x). Ray owns 100% of this.\n\nSCENARIOS (to Ray directly): part-time ~$63k/yr, half-time ~$115k, lean-in ~$200k.\n\nCOMBINED PATH: today ~$40k -> conservative OBX + part-time Jamieson ~$81k (2x) -> moderate + half-time ~$154k (3.8x) -> aggressive + lean-in $250k+.\n\nTHE PLAY: run OBX on the brothers (earns without you) so your scarce hours go to high-margin Jamieson work. Start with Starlink packages.\n\nFull detail: 'Opportunity Analysis — Is It Worth It.md' + 'Opportunity & Pricing Model.xlsx'.");

function setResearchDocs(){
  const set=(biz,text)=>{let dc=S[biz].docs.find(x=>x.id==="research");if(dc){dc.text=text;dc.deleted=false;dc.updatedAt=now();}else S[biz].docs.push({id:"research",text:text,updatedAt:now()});};
  set("obx","OBX LOT SOLUTIONS — Market Research (updated overnight)\n\nTHE BIG PICTURE\nThe Outer Banks runs on absentee owners and rentals. ~60% of homes here are second homes, ~52% sit vacant at any time, and there are 8,000-10,000+ vacation rentals in Dare County alone. Dare saw $2.1B in visitor spending in 2024 and ~45% of local jobs are tourism. NC also has a real skilled-trades labor shortage. Translation: thousands of pricey properties owned by people who aren't here, who need a reliable local to clean, wash, watch, and fix them — in a market short on reliable help. That gap is the whole opportunity.\n\nWHAT TO PUSH FIRST\n1) Pressure & soft washing — the engine.\n2) House-watch / property checks — the sleeper + the wedge.\n3) Keep junk removal (get the trailer).\n4) Bundle window + gutter cleaning onto wash visits.\n5) Queue holiday lighting for Q4.\n\nPRESSURE & SOFT WASHING (start now)\nSalt + humidity grow algae/mildew fast on the coast, so exteriors need washing on a recurring (often annual) basis — recurring demand is the point. US industry is $1.2B across ~32,000 businesses; gross margins commonly 40-65%. House exterior $192-400; pricing $0.30-0.80/sq ft; roof soft-wash ~$700. Lead with SOFT washing (houses, roofs, siding) for recurring money + concrete pressure washing. Sell annual plans. You already own a commercial unit and the brothers can run it.\n\nHOUSE-WATCH / PROPERTY CHECKS (start now)\nWith 60% absentee ownership, there's a huge base needing property checks — and insurers often require checks on vacant homes. Per-visit recurring, near-zero equipment, delivered with a photo/text report = high trust, high margin, sticky. It's also the WEDGE: once you're the trusted person at the property, you get the washing, junk, repairs, and Jamieson tech too. Offer tiered monthly/bi-weekly plans with a branded report.\n\nJUNK REMOVAL (keep)\n$350-850/job, solo margins 40-72%; tipping ~$62/ton. Trailer is the gating item. Good cash; pairs with clean-outs for the same PM/absentee customers.\n\nWINDOW + GUTTER (bundle, don't lead)\nWindows $150-370/visit, gutters $0.95-2.50/linear ft, both ~twice-yearly, 20-50% margin. Saturated as standalone — ATTACH them to wash/house-watch accounts as recurring add-ons.\n\nHOLIDAY LIGHTING (queue for Q4)\nLands when the OBX is dead = off-season cash. 30%+ net, materials only 10-12%, $8-35/linear ft; a 3-person crew nets $1,000-1,700/day; $100k+/season is doable. Decide by late summer, pre-sell Sept/Oct. Bridges into Jamieson's permanent lighting.\n\nTURNOVER CLEANING (defer)\nCleanliness is the #1 guest complaint and managers can't staff turnover days — huge market, but same-day weekend turns are risky with a part-time crew. Revisit once the crew is proven.\n\nHOW IT CONNECTS TO JAMIESON\nSame customers (property managers + second-home owners). House-watch opens the door; washing/junk are the recurring revenue; then Jamieson sells Starlink/wifi/smart locks/cameras/AV/lighting into the same door. One PM = dozens of doors for both businesses.\n\n(Full report with all numbers + sources: see 'Market Research & Strategy.md' in the project folder.)");
  set("jam","JAMIESON AUTOMATION — Market Research (updated overnight)\n\nTHE BIG PICTURE\nThe OBX is absentee-owner and rental-heavy: ~60% second homes, 8,000-10,000+ vacation rentals in Dare alone, a ~$100B US vacation-rental market, and a US smart-home market of ~$28-36B growing 17-27%/yr (41% of US households already have smart-home tech). These owners want reliable guest wifi, keyless entry, cameras, and systems that just work — and there are few skilled, reliable local integrators. Premium, relationship-sold work is wide open.\n\nWHAT TO PUSH FIRST\n1) Starlink + vacation-rental tech packages.\n2) Commercial AV / Q-Sys for restaurants & bars (your deepest edge).\n3) Permanent outdoor LED lighting (high-ticket bet).\nPlus: security cameras/smart home as cross-sell; EV/generators with a license workaround; boat fiberglass as a wildcard.\n\nSTARLINK + RENTAL-TECH PACKAGES (push now)\n71% of travelers prefer keyless entry; rentals need reliable wifi; Starlink's own installs carry $100-1,500 demand surcharges in busy areas (supply gap). You've done 3 installs already. Bundle Starlink + mesh wifi + smart lock + thermostat + cameras into a flat-rate 'rental-ready' package sold per door to PMs and owners. One PM = many doors.\n\nCOMMERCIAL AV / Q-SYS (your edge)\nThe OBX is dense with restaurants/bars, and you have real Q-Sys/QSC expertise — the exact platform for multi-zone hospitality audio, paging, and control. Few true pros compete locally. High-ticket installs + recurring support/programming. Relationship-sold: walk into venues, lead with Q-Sys. Hard for others to copy.\n\nPERMANENT OUTDOOR LED LIGHTING (high-ticket bet)\nTrimlight/Jellyfish/Gemstone-style systems are year-round (holiday + accent + security in one app), sold to affluent homes — the OBX is full of them, with likely little local competition. $1,800-2,500+ per home, $18-35/linear ft, ~$650 controller; margins like holiday lighting. It's technical (LED channels, controllers, app/network) = your wheelhouse, and it bridges OBX Lot Solutions' seasonal lighting into a premium product. Become a dealer this summer; sell in the fall.\n\nSECURITY CAMERAS + SMART HOME (cross-sell)\nSmart-home market ~$28-36B, growing fast, 41% household adoption. Cameras/locks/thermostats attach naturally to the rental package and any home you're already in.\n\nEV CHARGERS & GENERATORS (demand yes, license constraint)\nStrong demand (NC EV charging +39% YoY; coastal NC wants Generac standby generators, which book up before hurricane season). BUT both hardwire into the panel = NC licensed electrician required, which you're not yet. Options: partner with a licensed electrician (own mounting/config/automation + the customer), do plug-in EV chargers only (no license needed), or pursue a Limited electrical license later (2 yrs experience, up to $60k jobs). Secondary until you pick a path.\n\nWILDCARD: MOBILE BOAT FIBERGLASS/GELCOAT REPAIR\nYou have rare structural fiberglass skill; the OBX is boat-dense; NC sun cracks/fades gelcoat (recurring). Shops charge ~$110/hr, $450-500 for small repairs. A mobile service is a high-margin niche with thin competition. Worth a low-cost test (marina drop-bys).\n\nHOW IT CONNECTS TO OBX LOT SOLUTIONS\nSame customers. OBX Lot Solutions' house-watch/washing relationships become warm leads for Jamieson's high-margin Starlink/AV/lighting work. Keep brands separate (you own 100% of Jamieson) but work one shared PM list.\n\n(Full report with all numbers + sources: see 'Market Research & Strategy.md' in the project folder.)");
}

let QITEMS=[];let CURQ=null;
window.openQuote=function(id,customerId,preset){

function renderLines(){
  const c=cat();
  document.getElementById("qlines").innerHTML=QITEMS.map((it,i)=>{
    const groups=[];c.forEach(s=>{if(!groups.includes(s.cat))groups.push(s.cat);});
    const opts=groups.map(g=>`<optgroup label="${esc(g)}">`+c.filter(s=>s.cat===g).map(s=>`<option value="${s.id}" ${it.serviceId===s.id?"selected":""}>${esc(s.name)}</option>`).join("")+`</optgroup>`).join("");
    const isQuote=it.unit==="quote";
    return `<div class="qline">
      <select onchange="lineSvc(${i},this.value)"><option value="">— service —</option>${opts}</select>
      <input class="q" type="number" min="1" value="${it.qty}" oninput="lineQty(${i},this.value)" title="qty">
      <input class="pr" type="number" value="${it.price}" ${isQuote?"":"readonly"} oninput="linePrice(${i},this.value)" title="price">
      <button class="rm" onclick="rmLine(${i})">×</button></div>`;
  }).join("")||`<div class="muted">No items yet — add one.</div>`;
  renderTot();
}
window.addLine=function(){QITEMS.push({serviceId:"",name:"",unit:"flat",price:0,qty:1});renderLines();};
window.rmLine=function(i){QITEMS.splice(i,1);renderLines();};
window.lineSvc=function(i,sid){const s=cat().find(x=>x.id===sid);if(!s)return;
  QITEMS[i]={serviceId:s.id,name:s.name,unit:s.unit,price:s.price,qty:QITEMS[i].qty||1};renderLines();};
window.lineQty=function(i,v){QITEMS[i].qty=Math.max(1,parseInt(v)||1);renderTot();};
window.linePrice=function(i,v){QITEMS[i].price=parseFloat(v)||0;renderTot();};
function quoteCalc(){let sub=0;QITEMS.forEach(it=>sub+=(it.price||0)*(it.qty||1));
  const rec=document.getElementById("q_rec")&&document.getElementById("q_rec").checked;
  const disc=rec?sub*0.2:0;return{sub,disc,total:sub-disc,rec};}
window.renderTot=function(){const t=quoteCalc();const el=document.getElementById("q_tot");if(el)el.textContent=money(t.total);};
function quoteFigures(){if(!document.getElementById("q_rec")&&CURQ&&CURQ.total!=null)return{sub:CURQ.subtotal,disc:CURQ.discount,total:CURQ.total};return quoteCalc();}
window.saveQuote=function(id){
  const t=quoteCalc();const d=D();
  const obj={id:id||uid(),customerId:val("q_cust"),cust:val("q_custfree")||(val("q_cust")?custName(val("q_cust")):""),
    date:today(),items:JSON.parse(JSON.stringify(QITEMS)),recurring:t.rec,subtotal:t.sub,discount:t.disc,total:t.total};
  if(!obj.items.length){alert("Add at least one line item.");return;}
  touch(obj);

  if(obj.customerId){const c=d.customers.find(x=>x.id===obj.customerId);if(c&&(c.status==="Lead"||c.status==="Contacted")){c.status="Quoted";touch(c);}}
  save();closeModal();render();
};

window.togglePaid=function(id){const q=D().quotes.find(x=>x.id===id);q.paid=!q.paid;if(q.paid)q.invoiced=true;touch(q);save();openQuote(id);};

/* ---------- SCHEDULE ---------- */
let CALY=null,CALM=null;
function rSchedule(){
  const t=today();
  if(CALY==null){const d=new Date();CALY=d.getFullYear();CALM=d.getMonth();}
  const jobs=actJ().slice().sort((a,b)=>(a.date+(a.time||""))<(b.date+(b.time||""))?-1:1);
  let h=`<h2>Schedule</h2>`+renderCalendar(jobs);
  const groups={Today:[],Upcoming:[],Done:[]};
  jobs.forEach(j=>{if(j.done)groups.Done.push(j);else if(j.date>t)groups.Upcoming.push(j);else groups.Today.push(j);});
  if(!jobs.length)h+=`<div class="empty" style="padding:18px">No jobs yet — tap a day above or the + button.</div>`;
  ["Today","Upcoming","Done"].forEach(g=>{if(!groups[g].length)return;
    h+=`<div class="secthd"><h2>${g}</h2><span class="ct">${groups[g].length}</span></div><div class="card">`+groups[g].map(liJob).join("")+`</div>`;});
  view.innerHTML=h;
}
function renderCalendar(jobs){
  const t=today();const byDate={};jobs.forEach(j=>{(byDate[j.date]=byDate[j.date]||[]).push(j);});
  const first=new Date(CALY,CALM,1);const startDow=first.getDay();
  const dim=new Date(CALY,CALM+1,0).getDate();
  const mname=first.toLocaleString(undefined,{month:"long"});
  const dows=["Su","Mo","Tu","We","Th","Fr","Sa"];
  let cells=dows.map(d=>`<div class="caldow">${d}</div>`).join("");
  for(let i=0;i<startDow;i++)cells+=`<div class="calcell out"></div>`;
  for(let day=1;day<=dim;day++){
    const ds=CALY+"-"+String(CALM+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const dj=byDate[ds]||[];let inner=`<div class="dnum">${day}</div>`;
    dj.slice(0,2).forEach(j=>inner+=`<div class="caljob" style="${j.done?'opacity:.5;text-decoration:line-through':''}">${esc(j.title||'Job')}</div>`);
    if(dj.length>2)inner+=`<div class="calmore">+${dj.length-2} more</div>`;
    cells+=`<div class="calcell${ds===t?' today':''}" onclick="openDay('${ds}')">${inner}</div>`;
  }
  return `<div class="calhead"><button class="calnav" onclick="calShift(-1)">‹</button>
    <div class="mtitle">${mname} ${CALY}</div><button class="calnav" onclick="calShift(1)">›</button>
    <button class="btn ghost sm" style="margin-left:auto" onclick="calToday()">Today</button></div>
    <div class="calgrid">${cells}</div>`;
}
window.calShift=function(n){CALM+=n;if(CALM<0){CALM=11;CALY--;}if(CALM>11){CALM=0;CALY++;}render();};
window.calToday=function(){const d=new Date();CALY=d.getFullYear();CALM=d.getMonth();render();};
window.openDay=function(ds){
  const jobs=actJ().filter(j=>j.date===ds).sort((a,b)=>(a.time||"")<(b.time||"")?-1:1);

const PRI_ORDER={High:0,Medium:1,Low:2};
function sortTodos(list){return list.slice().sort((a,b)=>{
  if(!!a.done!==!!b.done)return a.done?1:-1;
  if((PRI_ORDER[a.priority]??1)!==(PRI_ORDER[b.priority]??1))return (PRI_ORDER[a.priority]??1)-(PRI_ORDER[b.priority]??1);
  return (a.due||"9999")<(b.due||"9999")?-1:1;});}
function rTodos(){
  const t=today();const list=sortTodos(actTodo());

let MAP=null,MAP_MODE="draw",MPOLY=[],MCOUNT=[],MSQFT=325,MPOLYL=null,MCOUNTL=null,MPINL=null;
function rMap(){
  view.innerHTML=`<div class="secthd"><h2>Map · quote &amp; leads</h2></div>
    <div class="maptop"><input id="map_search" placeholder="Search an address…" style="flex:1;min-width:140px" onkeydown="if(event.key==='Enter')mapSearch()"><button class="btn ghost sm" onclick="mapSearch()">Go</button></div>
    <div class="maptop">
      <button class="subbtn on" id="mb_draw" onclick="setMapMode('draw')">▱ Draw lot</button>
      <button class="subbtn" id="mb_count" onclick="setMapMode('count')">• Count spaces</button>
      <button class="subbtn" id="mb_pin" onclick="setMapMode('pin')">📍 Drop pin</button>
      <button class="btn ghost sm" onclick="mapClear()">Clear</button>
    </div>
    <div class="maptop"><label style="margin:0">Sq ft / space</label><input id="map_sqft" type="number" value="${MSQFT}" style="width:80px" onchange="MSQFT=parseFloat(this.value)||325;mapRecalc()"><span class="muted">~325 incl. drive aisles</span></div>
    <div id="map"></div>
    <div class="card" id="map_res" style="margin-top:10px"><span class="muted">Pick "Draw lot", then tap the corners of a parking lot on the satellite view — it estimates the number of spaces and quotes it. Or drop pins to map leads.</span></div>
    <p class="muted" style="margin-top:8px">Ownership lookup: <a href="https://gis.darenc.com/" target="_blank" rel="noopener">Dare County GIS</a> · <a href="https://www.maps.arcgis.com/" target="_blank" rel="noopener">Currituck GIS</a>. The map needs an internet connection.</p>`;
  setTimeout(initMap,40);
}
function initMap(){
  const el=document.getElementById("map");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML='<div class="muted" style="padding:24px">Map library didn\'t load — you need an internet connection for the map.</div>';return;}
  MAP=L.map("map").setView([36.07,-75.70],11);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,attribution:"Imagery © Esri"}).addTo(MAP);
  MPINL=L.layerGroup().addTo(MAP);MPOLYL=L.layerGroup().addTo(MAP);MCOUNTL=L.layerGroup().addTo(MAP);
  MPOLY=[];MCOUNT=[];
  renderPlaces();setMapMode(MAP_MODE);
  MAP.on("click",mapClick);
}
window.setMapMode=function(m){MAP_MODE=m;["draw","count","pin"].forEach(x=>{const b=document.getElementById("mb_"+x);if(b)b.classList.toggle("on",x===m);});};
function mapClick(e){
  if(MAP_MODE==="draw"){MPOLY.push(e.latlng);drawPoly();mapRecalc();}
  else if(MAP_MODE==="count"){MCOUNT.push(e.latlng);drawCount();mapRecalc();}
  else if(MAP_MODE==="pin"){addPlacePrompt(e.latlng);}
}
function drawPoly(){MPOLYL.clearLayers();
  MPOLY.forEach(p=>L.circleMarker(p,{radius:4,color:"#8BC34A",fillColor:"#8BC34A",fillOpacity:1}).addTo(MPOLYL));
  if(MPOLY.length>=2)L.polygon(MPOLY,{color:"#8BC34A",weight:2,fillOpacity:0.15}).addTo(MPOLYL);}
function drawCount(){MCOUNTL.clearLayers();
  MCOUNT.forEach((p,i)=>L.marker(p,{icon:L.divIcon({className:"",iconSize:[20,20],html:'<div style="background:#1B2A4E;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;text-align:center;line-height:20px">'+(i+1)+'</div>'})}).addTo(MCOUNTL));}
function polyAreaSqft(){
  if(MPOLY.length<3)return 0;
  const lat0=MPOLY[0].lat*Math.PI/180, mx=p=>p.lng*111320*Math.cos(lat0), my=p=>p.lat*110540;
  let a=0;for(let i=0;i<MPOLY.length;i++){const j=(i+1)%MPOLY.length;a+=mx(MPOLY[i])*my(MPOLY[j])-mx(MPOLY[j])*my(MPOLY[i]);}
  return Math.abs(a/2)*10.7639;
}
window.mapRecalc=function(){
  const res=document.getElementById("map_res");if(!res)return;
  if(MAP_MODE==="count"||MCOUNT.length){res.innerHTML=`<div class="nm">${MCOUNT.length} spaces counted</div><div class="sub">Tap each space to count; tap "Quote" when done.</div><button class="btn acc sm" style="margin-top:8px" onclick="quoteLot(${MCOUNT.length})">Quote parking-lot cleanup</button>`;return;}
  const sqft=polyAreaSqft();
  if(sqft<50){res.innerHTML=`<span class="muted">Tap the corners of the lot to estimate spaces.</span>`;return;}
  const spaces=Math.round(sqft/MSQFT);
  res.innerHTML=`<div class="nm">~${Math.round(sqft).toLocaleString()} sq ft → ~${spaces} parking spaces</div><div class="sub">at ${MSQFT} sq ft/space (incl. drive aisles)</div><button class="btn acc sm" style="margin-top:8px" onclick="quoteLot(${spaces})">Quote parking-lot cleanup (${spaces} spaces)</button>`;
};
window.mapClear=function(){MPOLY=[];MCOUNT=[];if(MPOLYL)MPOLYL.clearLayers();if(MCOUNTL)MCOUNTL.clearLayers();mapRecalc();};
window.mapSearch=function(){
  const q=(document.getElementById("map_search")||{}).value;if(!q)return;
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q))
    .then(r=>r.json()).then(d=>{if(d&&d[0])MAP.setView([+d[0].lat,+d[0].lon],19);else alert("Address not found.");})
    .catch(()=>alert("Search failed — need an internet connection."));
};
window.quoteLot=function(spaces){
  const price=spaces<=25?79:spaces<=50?129:spaces<=100?199:spaces<=200?349:spaces<=300?499:spaces<=500?799:Math.round(spaces*1.6);

function getRates(){try{const d=D().docs.find(x=>x.id==="rates"&&!x.deleted);if(d)return JSON.parse(d.text);}catch(e){}return JSON.parse(JSON.stringify(RATES_DEFAULT[S.biz]));}
function setRates(obj){let d=D().docs.find(x=>x.id==="rates");if(d){d.text=JSON.stringify(obj);d.updatedAt=now();}else D().docs.push({id:"rates",text:JSON.stringify(obj),updatedAt:now()});save();}
function tierPrice(qty,tiers){let rem=qty,prev=0,sum=0;for(let k=0;k<tiers.length;k++){const cap=tiers[k][0],rate=tiers[k][1];const span=Math.min(rem,cap-prev);if(span>0){sum+=span*rate;rem-=span;}prev=cap;if(rem<=0)break;}return sum;}
function rnd5(n){return Math.round(n/5)*5;}
/* each calculator returns {name, price, notes:[]} */
function calcQuote(key,inp){
  const R=getRates(),r=R[key];if(!r)return null;
  let price=0,notes=[],name=r.label,qty=inp.qty||0;
  if(key==="softwash"||key==="roofwash"||key==="pressure"||key==="deck"){
    price=tierPrice(qty,r.tiers);
    if(inp.stories>=3&&r.stories3)price*=r.stories3;else if(inp.stories>=2&&r.stories2)price*=r.stories2;
    if(inp.steep&&r.steep)price*=r.steep;
    if(inp.heavy&&r.heavy){price*=r.heavy;notes.push("Heavy soiling/algae — extra solution & dwell time.");}
    if(inp.oil&&r.oil)price*=r.oil;
    price=Math.max(price,r.min);name=r.label+" — "+qty+" "+r.unit;
  } else if(key==="windows"){
    price=tierPrice(qty,r.tiers); if(inp.intext)price*=r.intext; if(inp.upper)price+=r.upperAdd*inp.upper;
    price=Math.max(price,r.min);name=r.label+" — "+qty+" panes"+(inp.intext?" (in+out)":"");
  } else if(key==="gutters"){
    price=tierPrice(qty,r.tiers); if(inp.stories>=2)price*=r.stories2; price=Math.max(price,r.min);
    name=r.label+" — "+qty+" ft";
  } else if(key==="parking"){
    price=tierPrice(qty,r.tiers)*(r.freq[inp.freq]||1); price=Math.max(price,r.min);
    name=r.label+" — "+qty+" spaces ("+(inp.freq||"one-time")+")";
    if((inp.freq||"one-time")!=="one-time")notes.push("Recurring route — price is per service.");
  } else if(key==="housewatch"){
    price=(r.base+(r.size[inp.size]||0))*(r.freq[inp.freq]||1);
    name=r.label+" — "+(inp.size||"medium")+" home, "+(inp.freq||"monthly")+" (per visit)";
    notes.push("Recurring — bill per visit on the chosen frequency.");
  } else if(key==="junk"){
    price=r.base+r.perEighth*(inp.eighths||1)+r.dumpFee; name=r.label+" — ~"+(inp.eighths||1)+"/8 truck";
    notes.push("Includes ~$"+r.dumpFee+" dump fee estimate; confirm on site.");
  } else if(key==="lock"){
    const n=Math.max(1,inp.count||1),hw=r.hardware[inp.type]||0;
    price=hw*n+r.install+r.addl*(n-1)+(inp.hub?r.hub:0)+(inp.code?r.code*n:0);
    name=r.label+" — "+n+"× "+(inp.type||"wifi");
    if(inp.weakwifi)notes.push("Weak Wi-Fi at the door — add a mesh node / access point or it'll drop.");
  } else if(key==="camera"){
    const n=Math.max(1,inp.count||1);
    price=r.nvr+r.perCam*n+r.install1+r.addl*(n-1)+r.run*(inp.runs||n);
    name=r.label+" — "+n+" cameras";
  } else if(key==="network"){
    price=r.base+r.perAp*(inp.aps||0)+r.perDrop*(inp.drops||0)+(inp.design?r.design:0);
    name=r.label+" — "+(inp.aps||0)+" AP / "+(inp.drops||0)+" drops";
  } else if(key==="starlink"){
    price=(r.mount[inp.mount]||r.mount.eave)+r.perExt*(inp.ext||0); name=r.label+" — "+(inp.mount||"eave")+" mount";
  } else if(key==="labor"){
    price=r.rate*(inp.hours||1); name=r.label+" — "+(inp.hours||1)+" hr";
  }
  return {name:name,price:rnd5(price),notes:notes};
}

  let prop=WZ.cust.propertyId?d.properties.find(x=>x.id===WZ.cust.propertyId):null;
  if(!prop&&WZ.cust.address){prop=actProps().find(x=>(x.address||"").toLowerCase()===WZ.cust.address.toLowerCase()&&(x.customerIds||[]).indexOf(cust.id)>=0);}
  if(!prop){prop={id:uid(),label:"Main",address:WZ.cust.address||"",accessNotes:"",lat:null,lng:null,customerIds:[cust.id],updatedAt:now()};d.properties.push(prop);geocodeProp(prop);}
  else if((prop.customerIds||[]).indexOf(cust.id)<0){prop.customerIds.push(cust.id);touch(prop);}
  const q={id:uid(),customerId:cust.id,cust:cust.name,propertyId:prop.id,address:prop.address||WZ.cust.address||"",date:today(),items:WZ.items.map(it=>({serviceId:"",name:it.name,unit:"quote",price:it.price,qty:1})),recurring:rec,subtotal:sub,discount:disc,total:total};
  touch(q);d.quotes.push(q);save();
  CURQ=q;QITEMS=q.items;WZ.savedTotal=total;WZ.step="done";render();
};
function wizDone(){
  return `<div class="card" style="text-align:center;padding:30px 18px">
    <div style="font-size:40px">✅</div>
    <div class="nm" style="font-size:22px;margin:6px 0">Quote ready</div>
    <div style="font-size:34px;font-weight:800;color:var(--brand)">${money(WZ.savedTotal)}</div>

  </div>`;}

/* ---------- SALES: route planners (OSRM-optimized) ---------- */
let SALESSUB="prospect",SMAP=null,SLAYER=null,SORDERED=[],SADDED=[],JOBDATE="";
function rSales(){
  if(!JOBDATE)JOBDATE=today();
  const subs=[["prospect","Prospecting route"],["jobs","Job route"]];
  let h=`<div class="secthd"><h2>Sales · route planner</h2></div>
    <div class="subnav">`+subs.map(s=>`<button class="subbtn ${SALESSUB===s[0]?"on":""}" onclick="salesSub('${s[0]}')">${s[1]}</button>`).join("")+`</div>`;
  if(SALESSUB==="prospect"){
    const places=(D().places||[]).filter(p=>!p.deleted&&p.lat!=null);
    h+=`<div class="card"><div class="muted" style="margin-bottom:6px">Check the target accounts to visit (pins saved on the Map tab), or add a stop by address. Then optimize the loop.</div>
      ${places.length?places.map(p=>`<label class="toggle" style="margin-top:6px"><input type="checkbox" class="sstop" data-lat="${p.lat}" data-lng="${p.lng}" data-name="${esc(p.name)}"> ${esc(p.name)}${p.owner?" · "+esc(p.owner):""}</label>`).join(""):`<div class="muted">No saved pins yet — drop some on the Map tab, or add an address below.</div>`}
      <div class="acwrap" style="margin-top:10px"><input id="s_addr" placeholder="Add a stop by address…" oninput="addrSuggest('s_addr','s_abox')"><div class="acbox" id="s_abox"></div></div>
      <button class="btn ghost sm" style="margin-top:6px" onclick="salesAddAddr()">+ Add this address</button>
      <div id="s_added"></div></div>`;
  } else {
    const jobs=actJ().filter(j=>!j.done&&j.date===JOBDATE);
    h+=`<div class="card"><label>Route date</label><input type="date" id="s_jobdate" value="${JOBDATE}" onchange="JOBDATE=this.value;render()">
      <div style="margin-top:8px" class="muted">${jobs.length} job(s) on ${fmtDate(JOBDATE)}. A job needs a property with a saved location (set the property's address to map it).</div>
      ${jobs.map(j=>{const p=j.propertyId?(D().properties||[]).find(x=>x.id===j.propertyId):null;const ok=p&&p.lat!=null;return `<div class="li"><div class="grow"><div class="nm" style="font-size:15px">${esc(j.title)}</div><div class="sub">${p?esc(p.label||p.address||""):"no property linked"}${ok?"":' · <span style="color:var(--danger)">⚠ no location</span>'}</div></div></div>`;}).join("")}</div>`;
  }
  h+=`<div class="card"><label>Start / home base (optional — defaults to first stop)</label><div class="acwrap"><input id="s_home" value="${esc(localStorage.getItem("jra_home")||"")}" placeholder="Your start address" oninput="addrSuggest('s_home','s_hbox')" onchange="localStorage.setItem('jra_home',this.value)"><div class="acbox" id="s_hbox"></div></div>
    <button class="btn acc" style="margin-top:10px" onclick="salesOptimize()">⚡ Optimize route</button>
    <div id="s_result" style="margin-top:10px"><span class="muted">Build your stops, then optimize.</span></div></div>
    <div id="smap"></div>
    <p class="muted" style="margin-top:8px">Free optimized routing (OSRM). "Navigate" hands off to Google Maps for live turn-by-turn. Needs an internet connection.</p>`;
  view.innerHTML=h;SORDERED=[];
  setTimeout(function(){initSMap();renderAdded();},40);
}
window.salesSub=function(s){SALESSUB=s;SADDED=[];SORDERED=[];render();};
function initSMap(){const el=document.getElementById("smap");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML='<div class="muted" style="padding:20px">Map needs an internet connection.</div>';return;}
  SMAP=L.map("smap").setView([36.07,-75.70],10);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,attribution:"Imagery © Esri"}).addTo(SMAP);
  SLAYER=L.layerGroup().addTo(SMAP);
}
window.salesAddAddr=function(){const v=val("s_addr");if(!v){alert("Type an address first.");return;}
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(v)).then(r=>r.json()).then(d=>{if(!d||!d[0]){alert("Address not found.");return;}
    SADDED.push({name:v,lat:+d[0].lat,lng:+d[0].lon});renderAdded();}).catch(function(){alert("Lookup failed — need internet.");});};
function renderAdded(){const el=document.getElementById("s_added");if(!el)return;el.innerHTML=SADDED.map((s,i)=>`<div class="li"><div class="grow">📍 ${esc(s.name)}</div><button class="rm" onclick="SADDED.splice(${i},1);renderAdded()">×</button></div>`).join("");}
function collectStops(){let stops=[];
  if(SALESSUB==="prospect"){document.querySelectorAll(".sstop:checked").forEach(cb=>{const la=parseFloat(cb.getAttribute("data-lat")),ln=parseFloat(cb.getAttribute("data-lng"));if(!isNaN(la)&&!isNaN(ln))stops.push({name:cb.getAttribute("data-name"),lat:la,lng:ln});});SADDED.forEach(s=>stops.push(s));}
  else{actJ().filter(j=>!j.done&&j.date===JOBDATE).forEach(j=>{const p=j.propertyId?(D().properties||[]).find(x=>x.id===j.propertyId):null;if(p&&p.lat!=null)stops.push({name:j.title,lat:p.lat,lng:p.lng});});}
  return stops;}
window.salesOptimize=function(){
  const stops=collectStops();const home=val("s_home");const res=document.getElementById("s_result");
  const go=function(homePt){let all=stops.slice();if(homePt)all.unshift(homePt);
    if(all.length<2){res.innerHTML='<span style="color:var(--danger)">Add at least 2 stops with a location.</span>';return;}
    res.innerHTML='<span class="muted">Optimizing…</span>';
    const coords=all.map(s=>s.lng+","+s.lat).join(";");
    fetch("https://router.project-osrm.org/trip/v1/driving/"+coords+"?source=first&roundtrip=true&overview=full&geometries=geojson")
      .then(r=>r.json()).then(d=>{if(d.code!=="Ok"){res.innerHTML='<span style="color:var(--danger)">Routing failed: '+esc(d.message||d.code)+'</span>';return;}drawRoute(d,all);})
      .catch(function(){res.innerHTML='<span style="color:var(--danger)">Routing error — need internet.</span>';});};
  if(home){fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(home)).then(r=>r.json()).then(d=>go(d&&d[0]?{name:"Start",lat:+d[0].lat,lng:+d[0].lon}:null)).catch(function(){go(null);});}
  else go(null);
};
function drawRoute(d,all){const trip=d.trips[0];const ordered=[];d.waypoints.forEach((w,i)=>{ordered[w.waypoint_index]=all[i];});SORDERED=ordered.filter(Boolean);
  if(SLAYER){SLAYER.clearLayers();L.geoJSON(trip.geometry,{style:{color:"#2A6CF0",weight:5,opacity:.8}}).addTo(SLAYER);
    SORDERED.forEach((s,i)=>L.marker([s.lat,s.lng]).addTo(SLAYER).bindPopup((i+1)+". "+esc(s.name)));
    try{SMAP.fitBounds(L.geoJSON(trip.geometry).getBounds(),{padding:[30,30]});}catch(e){}}
  const mi=(trip.distance/1609.34).toFixed(1),min=Math.round(trip.duration/60);
  document.getElementById("s_result").innerHTML=`<div class="nm">${SORDERED.length} stops · ${mi} mi · ~${min} min driving</div>
    <ol style="margin:8px 0 8px 18px;font-size:14px">${SORDERED.map(s=>`<li>${esc(s.name)}</li>`).join("")}</ol>
    <button class="btn acc sm" onclick="salesNavigate()">🧭 Navigate (Google Maps)</button>`;}
window.salesNavigate=function(){if(!SORDERED.length)return;const o=SORDERED[0];const wp=SORDERED.slice(1).map(s=>s.lat+","+s.lng).join("|");
  window.open("https://www.google.com/maps/dir/?api=1&origin="+o.lat+","+o.lng+"&destination="+o.lat+","+o.lng+(wp?"&waypoints="+encodeURIComponent(wp):""),"_blank");};

/* ---------- DATA + SYNC ---------- */
window.openRatesEditor=function(){modal("Pricing rates",`<p class="muted" style="margin-bottom:8px">Advanced — edit the numbers, keep the format. Tiers are [up-to-amount, price-per-unit]; multipliers like 1.25 add 25%.</p>
  <textarea id="rates_json" style="min-height:300px;font-family:monospace;font-size:12px">${esc(JSON.stringify(getRates(),null,2))}</textarea>
  <p id="rates_err" class="muted"></p>
  <div class="row" style="gap:8px;margin-top:10px"><button class="btn acc grow" onclick="saveRatesEditor()">Save</button><button class="btn ghost grow" onclick="resetRates()">Reset to defaults</button></div>`);};
window.saveRatesEditor=function(){try{const o=JSON.parse(document.getElementById("rates_json").value);setRates(o);closeModal();alert("Pricing rates saved.");}catch(e){const el=document.getElementById("rates_err");if(el)el.innerHTML='<span style="color:var(--danger)">Invalid format: '+esc(e.message)+'</span>';}};
window.resetRates=function(){if(!confirm("Reset pricing rates to defaults?"))return;setRates(JSON.parse(JSON.stringify(RATES_DEFAULT[S.biz])));closeModal();alert("Reset to defaults.");};
function rData(){
  const counts=b=>`${S[b].customers.filter(x=>!x.deleted).length} customers · ${S[b].quotes.filter(x=>!x.deleted).length} quotes · ${S[b].jobs.filter(x=>!x.deleted).length} jobs`;
  const last=S.sync.last?new Date(S.sync.last).toLocaleString():"never";
  view.innerHTML=`<h2>Sync</h2>
    <div class="card">
      <label>Sync server URL</label><input id="sy_url" value="${esc(S.sync.url)}" placeholder="http://your-server:4000">
      <label>Access token (shared secret)</label><input id="sy_token" value="${esc(S.sync.token)}" placeholder="set this same on the server">
      <div class="toggle"><input type="checkbox" id="sy_auto" ${S.sync.auto?"checked":""}><label style="margin:0">Auto-sync when the app opens</label></div>
      <div class="row" style="gap:8px;margin-top:12px">
        <button class="btn grow" onclick="saveSync()">Save settings</button>
        <button class="btn acc grow" onclick="syncNow()">Sync now</button></div>
      <p class="muted" style="margin-top:8px">Last synced: ${last}. <span id="sy_msg"></span></p>
    </div>
    <h2>Appearance</h2>
    <div class="card"><div class="toggle" style="margin-top:0"><input type="checkbox" id="th_dark" ${localStorage.getItem("jra_theme")==="dark"?"checked":""} onchange="toggleTheme()"><label style="margin:0">Dark mode</label></div></div>
    <h2>Team</h2>
    <div class="card">
      <div class="row"><div class="grow"><div class="nm">${curUser()?esc(curUser().username):"Not signed in"}</div><div class="sub">${curUser()?"signed in on this device":"sign in to tag your work"}</div></div>
      ${curUser()?`<button class="btn ghost sm" onclick="logoutUser()">Sign out</button>`:`<button class="btn ghost sm" onclick="openLogin()">Sign in</button>`}</div>
      ${users().length?`<div style="margin-top:8px">`+users().map(u=>`<div class="li"><div class="grow">${esc(u.username)}${curUser()&&curUser().id===u.id?" · you":""}</div><button class="btn danger sm" onclick="delUser('${u.id}')">Remove</button></div>`).join("")+`</div>`:`<div class="muted" style="margin-top:8px">No accounts yet.</div>`}
      <button class="btn ghost" style="margin-top:10px" onclick="openCreateAccount()">+ Add account</button>
    </div>
    <h2>Pricing rates</h2>
    <div class="card"><p class="muted" style="margin-bottom:8px">These drive the Guided Quote prices. Tune them any time.</p>
      <button class="btn ghost" onclick="openRatesEditor()">Edit pricing rates</button></div>
    <h2>This device</h2>
    <div class="card"><div class="nm">OBX Lot Solutions</div><div class="sub">${counts("obx")}</div></div>
    <div class="card"><div class="nm">Jamieson Automation</div><div class="sub">${counts("jam")}</div></div>
    <h2>Backup</h2>
    <div class="card">
      <p class="muted" style="margin-bottom:10px">Data lives on this device. Export a backup any time; import to restore or move it manually.</p>
      <button class="btn ghost" onclick="exportData()">Export backup (.json)</button>
      <label>Import backup</label><input type="file" accept="application/json" id="impfile" onchange="importData(this)">
    </div>
    <p class="muted" style="margin:14px 4px">App v2 · offline-first · syncs to your server</p>`;
}
window.saveSync=function(){S.sync.url=val("sy_url");S.sync.token=val("sy_token");
  S.sync.auto=document.getElementById("sy_auto").checked;save();syMsg("Saved.");renderSyncPill();};
function syMsg(t){const e=document.getElementById("sy_msg");if(e)e.textContent=t;}
function renderSyncPill(){const b=document.getElementById("syncbtn");
  if(!S.sync.url){b.style.display="none";return;}
  b.style.display="";b.textContent="⟳ Sync";}
window.syncNow=async function(){
  if(!S.sync.url){if(TAB==="data")syMsg("Set a server URL first.");else{TAB="data";render();}return;}
  syMsg("Syncing…");const btn=document.getElementById("syncbtn");if(btn)btn.textContent="⟳ …";
  try{
    const res=await fetch(S.sync.url.replace(/\/+$/,"")+"/sync",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:S.sync.token,state:{obx:S.obx,jam:S.jam,users:S.users}})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(!data||!data.state||!data.state.obx)throw new Error("bad response");
    S.obx=data.state.obx;S.jam=data.state.jam;if(data.state.users)S.users=data.state.users;S.sync.last=now();save();
    render();syMsg("Synced ✓");
  }catch(e){syMsg("Sync failed: "+e.message);if(btn)btn.textContent="⟳ Sync";}
};
window.exportData=function(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="business-app-backup-"+today()+".json";a.click();
};
window.importData=function(inp){
  const file=inp.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.obx||!o.jam)throw 0;
    if(!confirm("Replace all current data with this backup?"))return;
    o.sync=o.sync||S.sync;S=o;S.biz=S.biz||"obx";save();setBiz(S.biz);alert("Imported.");}
    catch(e){alert("That doesn't look like a valid backup file.")}};
  r.readAsText(file);
};

/* ---------- helpers ---------- */
function val(id){const e=document.getElementById(id);return e?e.value.trim():""}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
let _acT=null;
window.addrSuggest=function(inpId,boxId){clearTimeout(_acT);const inp=document.getElementById(inpId),box=document.getElementById(boxId);if(!inp||!box)return;const q=inp.value.trim();if(q.length<4){box.innerHTML="";return;}_acT=setTimeout(function(){fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=us&q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){box.innerHTML=(d||[]).map(function(x){return '<div class="acitem" data-a="'+esc(x.display_name)+'" onclick="addrPick(\''+inpId+'\',\''+boxId+'\',this)">'+esc(x.display_name)+'</div>';}).join("");}).catch(function(){});},350);};
window.addrPick=function(inpId,boxId,el){const inp=document.getElementById(inpId);inp.value=el.getAttribute("data-a");document.getElementById(boxId).innerHTML="";try{inp.dispatchEvent(new Event("change"));}catch(e){}};
function applyTheme(){document.body.classList.toggle("dark",localStorage.getItem("jra_theme")==="dark");}
window.toggleTheme=function(){const dark=localStorage.getItem("jra_theme")!=="dark";localStorage.setItem("jra_theme",dark?"dark":"light");applyTheme();};

/* ---------- USERS / lightweight accounts ---------- */
async function hashPw(pw){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+"::jsuite"));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
  catch(e){let h=5381;const s=pw+"::jsuite";for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "f"+h.toString(16);}
}
function users(){return (S.users||[]).filter(u=>!u.deleted);}
function curUser(){const id=localStorage.getItem("jra_session");return users().find(u=>u.id===id)||null;}
function userName(id){const u=(S.users||[]).find(x=>x.id===id);return u?u.username:"";}
window.openCreateAccount=function(){modal("New account",`
  <p class="muted" style="margin-bottom:8px">No email needed — just a username and password. This is lightweight identity for your team (for assigning to-dos), not bank-grade security.</p>
  <label>Username</label><input id="u_name" autocomplete="off">
  <label>Password</label><input id="u_pw" type="password" autocomplete="new-password">
  <button class="btn acc" style="margin-top:14px" onclick="createAccount()">Create account</button>`);};
window.createAccount=async function(){
  const un=val("u_name"),pw=val("u_pw");
  if(!un||!pw){alert("Username and password required.");return;}
  if(users().some(u=>u.username.toLowerCase()===un.toLowerCase())){alert("That username is taken.");return;}
  if(!S.users)S.users=[];
  S.users.push({id:uid(),username:un,passhash:await hashPw(pw),updatedAt:now()});
  const u=S.users[S.users.length-1];localStorage.setItem("jra_session",u.id);
  save();closeModal();render();
};
window.openLogin=function(){modal("Sign in",`
  <label>Username</label><input id="l_name" autocomplete="off">
  <label>Password</label><input id="l_pw" type="password" autocomplete="off">
  <button class="btn acc" style="margin-top:14px" onclick="loginUser()">Sign in</button>`);};
window.loginUser=async function(){
  const un=val("l_name"),pw=val("l_pw");
  const u=users().find(x=>x.username.toLowerCase()===un.toLowerCase());
  if(!u||u.passhash!==await hashPw(pw)){alert("Wrong username or password.");return;}
  localStorage.setItem("jra_session",u.id);closeModal();render();
};
window.logoutUser=function(){localStorage.removeItem("jra_session");render();};
window.delUser=function(id){if(!confirm("Remove this account?"))return;
  const u=S.users.find(x=>x.id===id);u.deleted=true;u.updatedAt=now();
  if(localStorage.getItem("jra_session")===id)localStorage.removeItem("jra_session");
  save();render();};

/* ---------- boot ---------- */
applyTheme();
load();
/* if the app is served from the sync server, default the sync URL to that origin */
if(!S.sync.url && location.protocol.indexOf("http")===0){S.sync.url=location.origin;save();}
setBiz(S.biz);
if(S.sync.url&&S.sync.token&&S.sync.auto)syncNow();
if("serviceWorker" in navigator && window.isSecureContext){navigator.serviceWorker.register("sw.js").catch(function(){});}
/* v2 */
</script>
