jam:{
name:"Jamieson Automation — smart home, AV, networking & Starlink",
tagline:"Custom installation of locks, cameras, networking/wifi, Starlink, AV and lighting — premium, expertise-priced work.",
tldr:{rec:"Attach a recurring support plan (RMR) to every install and price labor at $125/hr — RMR is ~50% margin and builds sellable value.",risk:"Your time is the cap (you also run OBX); with no RMR you stay a pure labor business with nothing recurring."},
kpis:[{n:"~$30B",l:"US pro smart-home (CEDIA)"},{n:"~20,000",l:"US integrators"},{n:"+16.3%/yr",l:"home-automation services growth"},{n:"$4.7B",l:"control systems (largest cat.)"},{n:"~50%",l:"margin on RMR vs ~20% one-time"},{n:"$3-6M",l:"OBX local serviceable (est.)"}],
sizeText:"The US professional smart-home industry is roughly $30B (CEDIA), served by about 20,000 integrators. The broader home-automation services market was ~$35.8B in 2024 and is projected to grow ~16.3%/yr toward ~$119B by 2032 — one of the fastest-growing service markets you could be in. Within the pro spend, integrated control systems are the largest category (~$4.7B) with audio close behind (~$4.3B).\n\nThe single most important number here is margin: a multi-year service plan (RMR — recurring monthly revenue) carries ~50% margin versus ~20% on one-time installs. The big money in this industry is not the install — it is the ongoing support contract attached to it.\n\nOBX local serviceable (rough estimate): with dense second-home and vacation-rental stock needing locks, wifi, cameras and Starlink, plus light commercial, the local pie is on the order of $3-6M/yr. No published OBX-specific figure exists — this is triangulated from rental/second-home counts x per-door tech spend.",
sizeSrc:[{t:"CEDIA — US smart home ~$30B",u:"cedia.org/smart-home-professionals/news/cedias-reinvigorated-research-approach-uncovers-us-professional-smart-home-industry-nears-30-billion/"},{t:"US home-automation services growth",u:"www.psmarketresearch.com/market-analysis/us-home-automation-services-market"}],
share:{title:"US home-automation services market ($B) — trajectory",type:"bars",rows:[{l:"2024 actual",v:35.8,n:"$35.8B"},{l:"2028 (est. @16.3%)",v:65.5,n:"~$65B"},{l:"2032 projected",v:118.9,n:"$118.9B"}],note:"Fast, durable growth. Small and mid-size integrators are forecasting the most growth — that is your lane."},
concentration:"Highly fragmented (~20,000 integrators, mostly small local shops). Hardware brands (Control4/Snap One, Crestron, Savant) and security giants (ADT) consolidate the PRODUCT layer, but the INSTALL/service layer is wide open locally.",
players:[
{name:"Snap One / Control4, Crestron, Savant, Lutron",note:"The control-system brands integrators install. You become a dealer; they do not compete for your local install/service work."},
{name:"ADT, Vivint, Ring (Amazon)",note:"National security/DIY brands. They own mindshare but deliver cookie-cutter installs — you win on custom, local, reliable, and networking depth."},
{name:"~20,000 local/regional integrators",note:"The real competition is other small shops. Most are weak on networking — your IT/first-principles strength is the differentiator."},
{name:"Starlink (SpaceX) + its installer ecosystem",note:"Starlink sells the kit; install is open to anyone. A flood of small installers — productize and bundle to stand out."}],
localNote:"Real OBX-area tech installers. Soundwaves is the established incumbent; the rest are smaller or Starlink-focused.",
localComps:[
{name:"Soundwaves Integrated Solutions",url:"sndwaves.com",where:"Kitty Hawk, serving the OBX & Eastern NC",services:"Home theater, whole-home audio, IP camera systems, prewire, Starlink, satellite TV, certified repair center",pricing:"Premium custom-install pricing; quote-based",reviews:"Testimonials on obx-tv.com; BBB profile",years:"Since 2004 — first CEDIA-certified integrator on the OBX",size:"Established, the incumbent premium integrator",note:"Your toughest, most credible competitor. Compete on networking depth, rental-ready packages for PMs, and faster/leaner service — do not try to out-home-theater them on day one."},
{name:"OBX Tech (OBXtec)",url:"obxtec.com",where:"Outer Banks",services:"WiFi/networking, Starlink, TV mounting, AV, smart home, security cameras, IT, POS setup, seasonal lighting",pricing:"Not published — custom quote (info@obxtec.com / 252-686-1451); Starlink official install benchmark ~$199",reviews:"Positive local recommendations; on Yelp home-automation list",size:"Small-to-mid local tech-services shop",note:"Closest to your exact positioning. Differentiate with productized rental packages and the OBX Lot Solutions cross-sell channel they do not have."},
{name:"OBX Starlink",url:"obxstarlink.com",where:"Nags Head, Corolla, Duck + more",services:"Starlink install, whole-home wifi, ongoing support",pricing:"Quote-based install + support",size:"Starlink-specialist, small",note:"Single-service specialist. You can match on Starlink AND attach locks/cameras/networking they do not lead with."},
{name:"JAMCY Communications",url:"jamcycommunications.com",where:"Eastern NC, SW VA, NE SC incl. OBX/Hatteras/Ocracoke",services:"Starlink installs, specializing in hard-to-reach/challenging sites",pricing:"Quote-based",size:"Regional Starlink installer",note:"Regional, not OBX-rooted. Local presence + bundling beats a traveling installer on rentals."},
{name:"Pro Starlink Installers",url:"prostarlinkinstallers.com",where:"Surf City / Outer Banks; residential, commercial, marine",services:"Starlink install incl. boats/maritime",pricing:"Quote-based",size:"Specialist installer",note:"Marine angle is interesting — a niche you could add for OBX boat owners."},
{name:"Mountain Side Technologies",url:"mountainsidetechnologies.com",where:"Serves OBX among other areas",services:"Starlink, TV mounting, WiFi, security cameras",pricing:"Quote-based",size:"Small multi-service",note:"Generalist overlap; thin local roots on the OBX."},
{name:"Smart Connections NC",url:"smartconnectionsnc.com",where:"North Carolina",services:"Starlink professional installation + smart-home services",pricing:"Quote-based",size:"Small NC shop",note:"Statewide-ish; not OBX-focused — local reputation wins."},
{name:"Nextech NC",url:"nextech-nc.com",where:"North Carolina",services:"Starlink installation + tech services",pricing:"Quote-based",size:"Small NC shop",note:"Another Starlink-led generalist. The pattern: lots of Starlink installers, few true networking/automation experts — be the expert."}],
compNote:"Integrators elsewhere who scaled — the RMR model is the lesson.",
comparables:[
{name:"Sage Audio Video Technology",tag:"$10M in 8 yrs, RMR",url:"cepro.com/business-support/recurring-revenue/sage_av_technology_rmr_service_plans/",where:"Manhattan, NY",rev:"On track for ~$10M revenue in year 8",model:"Standardizes every project (sales-design-service) and sells a 'Sage Support' RMR plan to every client via remote-management software (OvrC). Mix of residential + commercial, two offices.",note:"The blueprint: attach a recurring support plan to every single install. That is what turns a labor business into a valuable, sellable company."},
{name:"RMR-built integrators (CE Pro data)",tag:"value multiplier",url:"cepro.com/news/what-are-the-benefits-types-of-recurring-revenue-models/139895/",where:"US (industry-wide)",rev:"RMR programs add $600k-$1.9M in business value by year 5",model:"Multi-tier service plans at ~50% margin vs ~20% on one-time installs; remote monitoring reduces truck rolls.",note:"Even a modest RMR book dramatically raises both monthly cash and the eventual sale price of Jamieson."},
{name:"Control4 / Snap One dealer model",tag:"productized",url:"cepro.com/news/snap-one-control4-connect-assist-programs-recurring-revenue/132789/",where:"US dealer network",rev:"Dealers add recurring revenue via Connect & Assist programs",model:"Become an authorized dealer, sell standardized packages + a branded remote-support subscription the platform helps you run.",note:"A turnkey way to add RMR without building your own monitoring stack — lean into your networking strength."},
{name:"Wipliance",tag:"$5.6M -> $8.5M",url:"wipliance.com/press/ce-pro-100/wipliance-named-in-2024s-ce-pro-100-list",where:"Washington state",rev:"$5.6M (2019, 151 installs) growing to $8.5M (2021); CE Pro 100 #38",model:"Standardized residential integration at scale; grew partly by ACQUIRING an established local shop (Huppin's).",note:"A real, named target for the $5-8M tier — and a reminder that buying out a retiring local installer is a legit growth move once you have cash."},
{name:"Prewire/builder-partnership integrators",tag:"pipeline play",where:"US new-construction markets",rev:"Steady project pipeline from a few builder relationships",model:"Lock in structured-wiring/prewire contracts with home builders and renovation contractors so installs are booked before the house is finished.",note:"On the OBX, partner with builders and the property managers OBX Lot Solutions already serves to get specced in early."},
{name:"Guardian Protection (CE Pro 100 #2)",tag:"$200M, 71% RMR",url:"cepro.com/business-support/2024-ce-pro-100-top-firms-take-in-combined-6-33-billion-revenue/",where:"US",rev:"~$200M/yr; 71% from recurring monthly revenue",model:"Security/automation integrator where the majority of revenue is recurring monitoring, not one-time installs.",note:"The extreme proof of the RMR lesson: the biggest, most valuable integrators are RMR machines. The top 100 US integrators combined did $6.33B in 2024."}],
streams:[
{name:"Device install — locks, cameras, thermostats, networking",inIt:true,who:"Homeowners, vacation-rental owners/PMs",ticket:"$129-499 per device installed (e.g. $379 wifi smart-lock)",freq:"Project-based; repeat as homes add devices",ltv:"$1,500-6,000+ per home over time",note:"The bread-and-butter. Always sell the working OUTCOME (device + wifi + setup), not just the box."},
{name:"Starlink + whole-home wifi installs",inIt:true,who:"Rentals & homes with poor connectivity",ticket:"$299-499 install + mesh add-ons",freq:"One-time + support",ltv:"$500-1,500 + ongoing support",note:"High demand on the OBX. Bundle into a rental-ready package, do not sell standalone."},
{name:"Home theater & whole-home audio",inIt:true,who:"Higher-end homeowners",ticket:"$2,000-20,000+ per project",freq:"Episodic, high ticket",ltv:"$5,000-30,000 over years",note:"Soundwaves owns this locally — enter selectively once you have wins; do not lead here."},
{name:"RMR — recurring support/monitoring plans",inIt:false,who:"Every install client, especially PMs with many doors",ticket:"$20-100+/mo per home/account",freq:"Monthly recurring",ltv:"Massive — adds $600k-1.9M business value by year 5",note:"ADD THIS FIRST. The single biggest lever in the whole industry. ~50% margin. Start with a simple 'we keep it running' plan + remote monitoring."},
{name:"Structured wiring / prewire for new builds",inIt:false,who:"Home builders, renovation contractors",ticket:"$2,000-8,000 per home prewire",freq:"Per project; steady via builder relationships",ltv:"Pipeline of booked work",note:"ADD via builder partnerships — get specced in before drywall, far cheaper than retrofits."},
{name:"Outdoor permanent LED lighting",inIt:false,who:"Homeowners + commercial",ticket:"~$2,200 starter (100 ft) up to $25/linear ft installed",freq:"One-time install + seasonal app reconfig",ltv:"$2,500-8,000 + referrals",note:"ADD as the high-ticket bet. Low-voltage + app config = your wheelhouse; OBX Lot Solutions can sell it into wash/lighting customers."},
{name:"Commercial low-voltage & networking",inIt:false,who:"OBX small businesses, rental offices, retail",ticket:"$1,500-15,000+ per project",freq:"Project + service contracts",ltv:"$5,000-25,000 with RMR",note:"ADD — your IT/networking strength shines here, and it pairs with OBX Lot Solutions commercial accounts."}],
levers:[
{name:"Attach RMR to every install",invest:"Low — remote-monitoring software (e.g. OvrC) + a simple plan",horizon:"Start now; compounds for years",fail:"Selling installs only and never offering the plan — leaving the 50%-margin recurring money (and most of the company's value) on the table.",caseStudy:"Sage AV reached ~$10M in 8 years by selling a 'Sage Support' RMR plan to every client."},
{name:"Productize 'rental-ready' packages for PMs",invest:"Low — define 2-3 fixed-price bundles",horizon:"30-90 days via existing PM relationships",fail:"Custom-quoting every door = slow and unscalable; PMs want one price per unit.",caseStudy:"Rentals need lock + wifi + cameras + thermostat on every door — one PM portfolio = dozens of identical, repeatable jobs."},
{name:"Become a dealer + lead with networking",invest:"Dealer onboarding; certifications",horizon:"3-6 months",fail:"Competing on home theater vs entrenched incumbents instead of winning on networking, where most rivals are weak.",caseStudy:"Snap One/Control4 dealer programs hand you standardized packages + a branded support subscription to resell."},
{name:"Builder & contractor prewire partnerships",invest:"Sweat — relationship building",horizon:"6-12 months to a steady pipeline",fail:"Chasing one-off retrofits forever instead of getting specced into new builds early.",caseStudy:"Prewire integrators get booked before drywall via a handful of builder relationships — predictable pipeline."},
{name:"Cross-sell through OBX Lot Solutions",invest:"$0 — shared customer base",horizon:"Immediate",fail:"Treating the two businesses as separate; the washing/home-watch customer is a warm, trusting tech lead you are not pitching.",caseStudy:"Home-watch makes you the trusted person at the property — the cheapest path to high-margin tech work (see Expansion tab)."}],
examples:[
{tier:"Small — solo installer",rev:"$100k-150k/yr",detail:"One skilled tech doing locks, cameras, wifi, Starlink and TV mounts, project-by-project, mostly word-of-mouth + Google. No recurring revenue yet. This is Jamieson today — high skill, but trading hours for dollars."},
{tier:"Mid — regional integrator with early RMR",rev:"$500k-1M/yr",detail:"Owner + 1-2 techs, mix of residential installs, rental-package work for PMs, light commercial, and a growing book of support plans. RMR starts smoothing cash flow and lifting margins. Reachable in a few years by adding RMR + PM packages."},
{tier:"Upper — multi-tier service integrator",rev:"$2M-10M/yr",detail:"Standardized projects + a substantial RMR book (50% margin) + commercial work, possibly two locations. Sage AV reached ~$10M in 8 years on this model. The RMR book alone can add $1M+ to the company's sale value."}],
industries:[
{key:"control",name:"Smart-home automation & control",tag:"The largest category of the industry.",kpis:[{n:"$4.7B",l:"control systems (top cat.)"},{n:"~$30B",l:"US pro smart home"},{n:"~20,000",l:"US integrators"}],size:"Integrated control systems are the single largest slice of the ~$30B US professional smart-home market at ~$4.7B. It is highly fragmented across ~20,000 integrators. The hardware brands consolidate the product layer; the local install/service layer is wide open.",chart:{title:"US home-automation services market ($B)",type:"bars",rows:[{l:"2024",v:35.8,n:"$35.8B"},{l:"2028e",v:65.5,n:"~$65B"},{l:"2032e",v:118.9,n:"$118.9B"}],note:"~16.3%/yr growth; small/mid integrators lead it."},players:[{name:"Control4 / Snap One, Crestron, Savant, Lutron",note:"The control brands you become a dealer for — they do not take your local work."},{name:"~20,000 local integrators",note:"The real competition — mostly small shops weak on networking."}],note:"Become a dealer, lead with your networking strength, and standardize packages so installs are repeatable.",sources:[{t:"CEDIA",u:"cedia.org/smart-home-professionals/news/cedias-reinvigorated-research-approach-uncovers-us-professional-smart-home-industry-nears-30-billion/"}]},
{key:"security",name:"Security & cameras",tag:"Where the recurring money lives.",kpis:[{n:"~50%",l:"margin on monitoring"},{n:"$200M",l:"Guardian (71% RMR)"},{n:"No fee",l:"PoE/NVR vs cloud"}],size:"Cameras and security are the most RMR-heavy slice: monitoring plans carry ~50% margin vs ~20% on one-time installs. The biggest integrators are essentially recurring-revenue machines — Guardian Protection does ~$200M with 71% from RMR. PoE/NVR systems (no monthly fee) are your wheelhouse vs cloud cameras.",chart:{title:"Where integrator value comes from",type:"donut",rows:[{l:"Recurring (RMR) value",v:70},{l:"One-time installs",v:30}],note:"Illustrative — the recurring book is most of the company's worth."},players:[{name:"ADT, Vivint, Ring (Amazon)",note:"National brands; cookie-cutter installs you beat on custom + local."},{name:"Guardian Protection",note:"CE Pro #2, ~$200M, 71% RMR — proof of the recurring model."},{name:"Local alarm/camera installers",note:"Your direct local competition; many weak on networking."}],note:"Recommend PoE for anyone with 4+ cameras, and attach a monitoring/support plan to every job — that plan is the real prize.",sources:[{t:"CE Pro 100",u:"www.cepro.com/business-support/2024-ce-pro-100-top-firms-take-in-combined-6-33-billion-revenue/"}]},
{key:"network",name:"Networking & wifi",tag:"Your home turf — it underpins everything.",kpis:[{n:"$149+",l:"network design fee"},{n:"#1",l:"cause of callbacks"},{n:"UniFi",l:"your specialty"}],size:"Most 'my lock/camera dropped' calls are really wifi-coverage problems, so networking underpins every other service. Mesh covers most homes; UniFi (your specialty) is the right call for big homes, multi-unit and commercial. Always sell network design + config — it is the difference between 'works' and 'works reliably.'",players:[{name:"Consumer mesh (Eero, Google)",note:"DIY-grade; you upgrade past it for reliability."},{name:"UniFi / commercial-grade",note:"Your differentiator vs most local AV shops."},{name:"ISPs' bundled routers",note:"Weak coverage = your opportunity to fix it."}],note:"Lead with networking — most rivals are weak here, and it is the foundation that prevents 80% of callbacks.",},
{key:"starlink",name:"Starlink & connectivity install",tag:"High demand, crowded with installers.",kpis:[{n:"$349",l:"kit (customer buys)"},{n:"$199",l:"Starlink official install"},{n:"$299-499",l:"your value-add install"}],size:"Starlink sells the kit; install is open to anyone, so the OBX has a flood of small installers. The job is really a clear view of sky + a clean cable path + wifi coverage. Starlink's own install is ~$199, so a value-added local install at $299-499 (with mesh + setup) is easy to justify.",chart:{title:"Install pricing ladder",type:"bars",rows:[{l:"Starlink official",v:199,n:"$199"},{l:"Your standard",v:349,n:"~$349"},{l:"Roof/pole mount",v:475,n:"$449-499"}]},players:[{name:"OBX Starlink, JAMCY, Pro Starlink Installers",note:"Local/regional specialists — single-service focused."},{name:"Soundwaves, OBX Tech",note:"Full integrators that also do Starlink."}],note:"Do not sell Starlink standalone — bundle it into a rental-ready package (Starlink + mesh + lock + cameras) per door.",sources:[{t:"Product guide",u:"www.satelliteinternet.com/providers/starlink/"}]},
{key:"av",name:"AV, home theater & lighting",tag:"High-ticket — enter selectively.",kpis:[{n:"$2k-20k+",l:"theater project"},{n:"$25/ft",l:"permanent LED lighting"},{n:"$35.6B",l:"outdoor lighting by 2030"}],size:"Home theater and whole-home audio are high-ticket ($2k-20k+) but this is Soundwaves' turf since 2004 — enter selectively once you have wins. Permanent outdoor LED lighting is the high-ticket bet that suits you (low-voltage + app config): ~$25/linear ft installed, and the outdoor-lighting market is heading to ~$35.6B by 2030 (+13.7%/yr).",players:[{name:"Soundwaves Integrated Solutions",note:"Entrenched local AV/theater incumbent — do not fight head-on."},{name:"Trimlight / Jellyfish / Gemstone (lighting)",note:"Become a dealer for one permanent-LED brand."},{name:"Big-box installers",note:"Basic TV mounts; you win on whole-room design."}],note:"Skip competing on theater early; make permanent LED lighting your high-ticket play and cross-sell it through OBX Lot Solutions customers.",sources:[{t:"Lighting market",u:"www.jellyfishlighting.com/pricing"}]}

sizeText:"Aeroponics (growing plants in misted air, no soil) sits inside controlled-environment agriculture. The global aeroponics market is ~$3.92B in 2025, projected toward ~$24B by 2035 at ~20%/yr — though estimates vary widely (some sources put it nearer $1.5B, so treat the headline as directional). The broader vertical-farming market is ~$8B in 2025 growing ~25%/yr; within it hydroponics dominates at 52% share and aeroponics is a smaller, faster-growing slice. North America holds ~30% of the global market.\n\nHonest weak spot: this is the thinnest data of your three businesses, and the cautionary tales are loud. Several large, well-funded vertical farms (AppHarvest, parts of Bowery, Fifth Season) failed or went bankrupt because growing commodity lettuce indoors is capital-intensive and energy-hungry. The companies that survive either (a) sell CONSUMABLES on a recurring basis to hobbyists, or (b) grow HIGH-VALUE crops (microgreens, herbs) for local buyers. There is no meaningful 'local OBX competitor' set — this is a product/B2B play, not a service territory.",

   {name:"Home watch -> everything",note:"Home watch makes you the trusted person at an absentee-owned property. That trust is the cheapest path to selling washing, junk, gutters AND Jamieson locks/wifi/cameras. It is the keystone — push it hardest."},
   {name:"OBX Lot Solutions -> Jamieson tech",note:"Every washing/home-watch customer is a warm Jamieson lead. 'While we're out, did you know we also do smart locks, wifi and cameras for rentals?' Zero acquisition cost."},
   {name:"Property managers -> both, at portfolio scale",note:"One PM relationship can mean washing + cleanup across many properties AND rental-ready tech (locks/wifi/cameras) on every door. Land the PM once; sell both businesses into the whole portfolio."},

  h+=feeds.map(f=>`<div class="mcard"><div class="mt">${esc(f.name)}</div><div style="font-size:12.5px;margin-top:4px;line-height:1.5">${esc(f.note)}</div></div>`).join("");
  h+=mSect("Adjacent markets that are wide open");
  const adj=[
   {name:"Short-term-rental 'turnover tech + care' bundle",tag:"combines both",note:"Per-door package for vacation rentals: smart lock + wifi + cameras (Jamieson) + exterior wash + home watch + turnover-ready checks (OBX). One price, one vendor, every door a PM manages. This is the single biggest combined opportunity on the OBX. Context: the US short-term-rental market is ~$72B (2025) heading to ~$125B by 2033; the OBX runs ~60% occupancy (just above the US average), and Vacasa alone (recently bought by Casago) manages ~40,000 units — that is how many doors PMs control."},

   {name:"Local microgreens supply to OBX restaurants",tag:"aeroponics, viable",note:"The one realistic aeroponics path: small high-value grow, sold weekly to local farm-to-table restaurants/grocers. AeroFarms proved microgreens (not lettuce) is where the money is."},
   {name:"Storm prep / board-up & post-storm checks",tag:"OBX seasonal premium",note:"Hurricane-season urgent + premium work; ties directly to home watch (you are already checking the property). High willingness to pay when a storm is coming."},
   {name:"Marine Starlink / boat tech",tag:"Jamieson niche",note:"OBX has lots of boat owners; Starlink maritime + electronics is a niche a local competitor (Pro Starlink Installers) already touches — room for a networking-strong specialist."}];
  h+=adj.map(a=>`<div class="mcard"><div class="mt">${esc(a.name)}<span class="mtag gap">${esc(a.tag)}</span></div><div style="font-size:12.5px;margin-top:4px;line-height:1.5">${esc(a.note)}</div></div>`).join("");
  h+=`<div class="card"><div class="msrc">These are strategic syntheses of the per-business research in the other tabs; revisit each tab for the sourced market data behind them.</div></div>`;

}
function mColumns(vals,labels){
  const max=Math.max.apply(null,vals)||1,W=330,H=120,n=vals.length,gap=4,bw=(W-gap*(n-1))/n;
  let bars="";vals.forEach((v,i)=>{const bh=Math.max(2,Math.round(v/max*(H-24)));const x=i*(bw+gap),y=H-bh-16;bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--accent)"></rect><text x="${x+bw/2}" y="${H-4}" font-size="7" text-anchor="middle" fill="var(--muted)">${esc(labels[i])}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin:6px 0">${bars}</svg>`;
}

function mPlan(key){
  const p=PLANS[key];if(!p)return `<div class="empty" style="padding:16px">No plan yet.</div>`;
  let h=`<div class="card" style="border-left:5px solid var(--accent)"><div class="nm" style="font-size:16px">${esc(p.title)}</div><div class="sub">${esc(p.subtitle)}</div></div>`;
  const tgt=(p.compare&&p.compare[1])?p.compare[1].n:"";
  h+=`<div class="tldr"><div class="t"><div class="v">${esc(tgt)}</div><div class="k">12-month target</div></div><div class="t"><div class="v">${p.actions.d30.length}</div><div class="k">moves in 30 days</div></div><div class="t"><div class="v">${p.add.length}</div><div class="k">streams to add</div></div></div>`;
  h+=mCallout("","The one growth lever",p.lever.name);
  h+=mCallout("info","Do this first",p.actions.d30[0].t);
  h+=`<button class="xlink" onclick="mktView('research')">📊 See the market research →</button>`;
  h+=mAcc("1 · Who we are right now",`<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.55">${esc(p.now)}</div>`,true);
  let goal=`<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.55">${esc(p.goal)}</div><div style="margin-top:10px"><strong>Now vs 12-month target</strong>`+mBars(p.compare)+`</div>`;
  h+=mAcc("2 · Where we're going (12-month target)",goal,true);
  h+=mAcc("3 · The customer we're going to win",`<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.55">${esc(p.customer)}</div>`,false);
  let ch=`<div style="margin-bottom:8px"><strong>Rough lead potential by channel</strong>`+mBars(p.channelChart)+`<div class="sub">Illustrative ranking, not a guarantee.</div></div>`+p.channels.map((c,i)=>`<div class="mcard"><div class="mt">${i+1}. ${esc(c.name)}</div><div style="font-size:12.5px;margin-top:4px;line-height:1.5"><div><b>Spend:</b> ${esc(c.spend)}</div><div><b>Expect:</b> ${esc(c.expect)}</div><div><b>Measure:</b> ${esc(c.measure)}</div><div><b>Cut if:</b> ${esc(c.cut)}</div></div></div>`).join("");
  h+=mAcc(`4 · How we'll reach them (${p.channels.length} channels, ranked)`,ch,false);
  h+=mAcc("5 · What we'll charge",`<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.55">${esc(p.pricing)}</div>`,false);
  h+=mAcc(`6 · What we'll add (${p.add.length})`,p.add.map(a=>`<div class="mcard"><div class="mt">${esc(a.stream)}</div><div style="font-size:12.5px;margin-top:4px;line-height:1.5"><div><b>Why:</b> ${esc(a.why)}</div><div><b>Cost to add:</b> ${esc(a.cost)}</div><div><b>Return:</b> ${esc(a.ret)}</div></div></div>`).join(""),false);
  const lv=p.lever;
  h+=mAcc("7 · The growth lever we're pulling",`<div class="mcard"><div class="mt">${esc(lv.name)}</div><div style="font-size:12.5px;margin-top:4px;line-height:1.5"><div><b>Why this one:</b> ${esc(lv.why)}</div><div><b>Investment:</b> ${esc(lv.invest)}</div><div><b>Horizon:</b> ${esc(lv.horizon)}</div><div style="margin-top:4px"><b>First 3 milestones:</b></div>${lv.milestones.map((m,i)=>`<div>${i+1}. ${esc(m)}</div>`).join("")}</div></div>`,false);
  let act=mTimeline()+`<button class="btn acc" onclick="planLoadTodos('${key}')">Load the 30-day actions into my To-Do list</button>`;
  [["d30","First 30 days"],["d60","31-60 days"],["d90","61-90 days"]].forEach(d=>{act+=`<div style="margin-top:10px"><strong>${d[1]}</strong>`+p.actions[d[0]].map(a=>`<div class="li"><div class="grow"><div class="nm" style="font-size:13px">${esc(a.t)}</div><div class="sub">${esc(a.owner)} · ${esc(a.cost)}</div></div></div>`).join("")+`</div>`;});
  h+=mAcc("8 · 30 / 60 / 90-day actions",act,true);
  h+=mAcc(`9 · What we're NOT doing (${p.not.length})`,p.not.map(n=>`<div class="li"><div class="grow" style="font-size:13px">&#9940; ${esc(n)}</div></div>`).join(""),false);
  let nums=`<div style="font-size:13px;margin-bottom:6px">${esc(p.proj.note)}</div><strong>Projected monthly revenue (12 mo)</strong>`+mColumns(p.proj.rev,p.proj.rev.map((_,i)=>"M"+(i+1)));
  const tot=p.proj.rev.reduce((a,b)=>a+b,0),ctot=p.proj.cost.reduce((a,b)=>a+b,0);
  nums+=`<div class="kpi"><div class="k"><div class="kn">${money(tot)}</div><div class="kl">12-mo revenue</div></div><div class="k"><div class="kn">${money(ctot)}</div><div class="kl">12-mo costs</div></div><div class="k"><div class="kn">${money(tot-ctot)}</div><div class="kl">net (pre-tax, whole business)</div></div></div>`;
  h+=mAcc("10 · The numbers (12-month projection)",nums,true);
  if(p.caveat)h+=`<div class="card"><div class="msrc"><b>Honest caveat:</b> ${esc(p.caveat)}</div></div>`;
  return h;
}
window.planLoadTodos=function(key){
  const biz=key==="obx"?"obx":"jam",p=PLANS[key];if(!p)return;
  const bizName=biz==="obx"?"OBX Lot Solutions":"Jamieson Automation";
  if(!confirm("Add the "+p.actions.d30.length+" first-30-day actions to the "+bizName+" To-Do list?"))return;
  let added=0;p.actions.d30.forEach(a=>{const t="[Plan] "+a.t;if(!(S[biz].todos||[]).some(x=>!x.deleted&&x.title===t)){S[biz].todos.push({id:uid(),title:t,priority:"High",due:today(),done:false,notes:"Owner: "+a.owner+" · Cost: "+a.cost,updatedAt:now()});added++;}});
  save();alert(added+" action"+(added===1?"":"s")+" added to the "+bizName+" To-Do list"+(added===0?" (already there)":"")+".");
};

function oppLev(o){return o.revMid/Math.max(o.maint,0.25);}
function fmtK(n){return n>=1000?"$"+(n%1000?(n/1000).toFixed(1):(n/1000))+"k":"$"+n;}
function mScatter(){
  const W=340,H=210,L=34,Rm=10,T=14,B=26,pw=W-L-Rm,ph=H-T-B,maxMaint=26,maxRev=8000;
  const aiColor={1:"#c0392b",2:"#e0a800",3:"#0099e5",4:"#1B2A4E",5:"#8BC34A"};
  let dots="";OPPS.forEach(o=>{const mx=Math.min(o.maint,maxMaint),rv=Math.min(o.revMid,maxRev);const x=L+(mx/maxMaint)*pw,y=T+ph-(rv/maxRev)*ph,r=2.5+o.ai;dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${aiColor[o.ai]}" fill-opacity="0.7"></circle>`;});
  let ax=`<line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="var(--line)"></line><line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="var(--line)"></line>`;
  ax+=`<text x="${L+pw/2}" y="${H-2}" font-size="8" text-anchor="middle" fill="var(--muted)">maintenance hrs/wk &#8594;</text>`;
  ax+=`<text x="9" y="${T+ph/2}" font-size="8" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 9 ${T+ph/2})">monthly revenue &#8594;</text>`;
  ax+=`<text x="${L+3}" y="${T+7}" font-size="7.5" fill="var(--accent-ink)">best: low effort, high $</text>`;
  const legend=[5,4,3,2,1].map(a=>`<span class="lg"><span class="sw" style="background:${aiColor[a]}"></span>AI ${a}</span>`).join("");
  return `<div class="card"><strong>Revenue vs. maintenance</strong> <span class="sub">(dot size/color = AI-leverage)</span><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin:6px 0">${ax}${dots}</svg><div class="mlg" style="display:flex;gap:12px;flex-wrap:wrap">${legend}</div><div class="sub">Each dot is one opportunity. Top-left is the passive sweet spot: high revenue, low upkeep. Bigger/greener dots are more AI-automatable.</div></div>`;
}
function oppPill(o){

  if(o.ttrW<=6&&o.setupCost<2000)return `<span class="pill qw">Quick win</span>`;

}

function oppCard(o,rank){

window.junkCalc=function(){
  const base={min:125,quarter:200,half:375,tquarter:525,full:700};
  const wt={min:200,quarter:450,half:900,tquarter:1400,full:1800};
  const load=val("je_load")||"half",extra=+val("je_extra")||0;
  const access=parseFloat(val("je_access"))||1,labor=parseFloat(val("je_labor"))||0;
  const fr=+val("je_freon")||0,ma=+val("je_mattress")||0,ti=+val("je_tire")||0,ew=+val("je_ewaste")||0,pa=+val("je_paint")||0,ap=+val("je_appl")||0;
  const baseHaul=(base[load]||0)+extra*600;
  const accessAdd=Math.round(baseHaul*(access-1));
  const laborAdd=labor*75;
  const special=fr*45+ma*25+ti*8+ew*30+pa*10+ap*25;
  const lbs=(wt[load]||0)+extra*1800;
  const dump=Math.round(lbs/2000*94);
  let total=Math.ceil((baseHaul+accessAdd+laborAdd+special+dump)/25)*25;
  const floor=Math.ceil((baseHaul*0.55+special+dump)/25)*25;
  const cost=dump+30;
  const b=document.getElementById("je_break");
  if(b)b.innerHTML=`<div style="font-size:13px;line-height:1.85">Base haul (by volume): <b>${money(baseHaul)}</b><br>Access factor (${access}×): <b>+${money(accessAdd)}</b><br>Extra labor: <b>+${money(laborAdd)}</b><br>Special-item disposal: <b>+${money(special)}</b><br>Landfill fee (est. ${lbs} lb @ $94/ton): <b>+${money(dump)}</b></div><div class="sub" style="margin-top:6px">Rough hard cost (dump+fuel) ≈ ${money(cost)} · don't go below ~${money(floor)}.</div>`;
  const t=document.getElementById("je_total");if(t)t.textContent=money(total);
  window._jeTotal=total;
};
window.saveJunkQuote=function(){

function tierPrice(qty,tiers){let rem=qty,prev=0,sum=0;for(let k=0;k<tiers.length;k++){const cap=tiers[k][0],rate=tiers[k][1];const span=Math.min(rem,cap-prev);if(span>0){sum+=span*rate;rem-=span;}prev=cap;if(rem<=0)break;}return sum;}
function rnd5(n){return Math.round(n/5)*5;}
/* each calculator returns {name, price, notes:[]} */
function calcQuote(key,inp){
  const R=getRates(),r=R[key];if(!r)return null;
  let price=0,notes=[],name=r.label,qty=inp.qty||0;
  if(key==="softwash"||key==="roofwash"||key==="pressure"||key==="deck"){
    price=tierPrice(qty,r.tiers);
    if(inp.stories>=3&&r.stories3)price*=r.stories3;else if(inp.stories>=2&&r.stories2)price*=r.stories2;
    if(inp.steep&&r.steep)price*=r.steep;
    if(inp.heavy&&r.heavy){price*=r.heavy;notes.push("Heavy soiling/algae — extra solution & dwell time.");}
    if(inp.oil&&r.oil)price*=r.oil;
    price=Math.max(price,r.min);name=r.label+" — "+qty+" "+r.unit;
  } else if(key==="windows"){
    price=tierPrice(qty,r.tiers); if(inp.intext)price*=r.intext; if(inp.upper)price+=r.upperAdd*inp.upper;
    price=Math.max(price,r.min);name=r.label+" — "+qty+" panes"+(inp.intext?" (in+out)":"");
  } else if(key==="gutters"){
    price=tierPrice(qty,r.tiers); if(inp.stories>=2)price*=r.stories2; price=Math.max(price,r.min);
    name=r.label+" — "+qty+" ft";
  } else if(key==="parking"){
    price=tierPrice(qty,r.tiers)*(r.freq[inp.freq]||1); price=Math.max(price,r.min);
    name=r.label+" — "+qty+" spaces ("+(inp.freq||"one-time")+")";
    if((inp.freq||"one-time")!=="one-time")notes.push("Recurring route — price is per service.");
  } else if(key==="housewatch"){
    price=(r.base+(r.size[inp.size]||0))*(r.freq[inp.freq]||1);
    name=r.label+" — "+(inp.size||"medium")+" home, "+(inp.freq||"monthly")+" (per visit)";
    notes.push("Recurring — bill per visit on the chosen frequency.");
  } else if(key==="junk"){
    price=r.base+r.perEighth*(inp.eighths||1)+r.dumpFee; name=r.label+" — ~"+(inp.eighths||1)+"/8 truck";
    notes.push("Includes ~$"+r.dumpFee+" dump fee estimate; confirm on site.");
  } else if(key==="lock"){
    const n=Math.max(1,inp.count||1),hw=r.hardware[inp.type]||0;
    price=hw*n+r.install+r.addl*(n-1)+(inp.hub?r.hub:0)+(inp.code?r.code*n:0);
    name=r.label+" — "+n+"× "+(inp.type||"wifi");
    if(inp.weakwifi)notes.push("Weak Wi-Fi at the door — add a mesh node / access point or it'll drop.");
  } else if(key==="camera"){
    const n=Math.max(1,inp.count||1);
    price=r.nvr+r.perCam*n+r.install1+r.addl*(n-1)+r.run*(inp.runs||n);
    name=r.label+" — "+n+" cameras";
  } else if(key==="network"){
    price=r.base+r.perAp*(inp.aps||0)+r.perDrop*(inp.drops||0)+(inp.design?r.design:0);
    name=r.label+" — "+(inp.aps||0)+" AP / "+(inp.drops||0)+" drops";
  } else if(key==="starlink"){
    price=(r.mount[inp.mount]||r.mount.eave)+r.perExt*(inp.ext||0); name=r.label+" — "+(inp.mount||"eave")+" mount";
  } else if(key==="labor"){
    price=r.rate*(inp.hours||1); name=r.label+" — "+(inp.hours||1)+" hr";
  }
  return {name:name,price:rnd5(price),cost:calcCost(key,inp),notes:notes};
}

/* COGS_LAYER_V1 — COGS + payment layer, Part 1 (pure logic). Idempotency sentinel; do not duplicate. */
var DISPOSAL_RATE_PER_TON = 73.16;   // $/ton (Dare County C&D, Manns Harbor)
var DISPOSAL_FREE_LBS     = 500;     // residential free allowance
var LBS_PER_TON           = 2000;
var MARGIN_FLOOR          = 0.35;    // soft floor — warn below 35%
var MILEAGE_RATE          = 0.725;   // $/mi round-trip vehicle cost — 2026 IRS rate 72.5¢ (absorbs fuel; no separate gas line, no hourly wage)
var MILEAGE_RATE_LABEL    = "72.5¢"; // display form (avoids $0.725 rounding to $0.72)
var CONSUMABLES_PCT       = 0.05;    // washing/cleaning chemical + consumable allowance, as % of labor sub
var VEG_FREE              = true;    // clean vegetative debris dumps FREE in Dare County (mixed loads = $73.16/ton)
function mileageCost(miles){ return Math.round((Math.max(0,+miles||0) * MILEAGE_RATE) * 100) / 100; }
function disposalCost(lbs){
  lbs = Math.max(0, +lbs || 0);
  var billable = Math.max(0, lbs - DISPOSAL_FREE_LBS);
  return Math.round((billable / LBS_PER_TON) * DISPOSAL_RATE_PER_TON * 100) / 100;
}
function lineFigures(price, cost, qty){
  qty = qty || 1;
  var P = (+price || 0) * qty;
  var C = (+cost  || 0) * qty;
  var profit = P - C;
  return { price: P, cost: C, profit: profit, margin: P > 0 ? profit / P : 0 };
}
function quoteCogs(items, discount){
  var price = 0, cost = 0;
  (items || []).forEach(function(it){
    var f = lineFigures(it.price, it.cost, it.qty);
    price += f.price; cost += f.cost;
  });
  price = Math.max(0, price - (+discount || 0));
  var profit = price - cost;
  return { price: price, cost: cost, profit: profit, margin: price > 0 ? profit / price : 0 };
}
function belowMarginFloor(margin, floor){
  return margin < (floor == null ? MARGIN_FLOOR : floor);
}
function pct(margin){ return (margin * 100).toFixed(1) + "%"; }
var COST_DEFAULT = {
  obx: {
    softwash:  { base: 8,  perUnit: 0.0088 },
    roofwash:  { base: 8,  perUnit: 0.011  },
    pressure:  { base: 12, perUnit: 0.004  },
    deck:      { base: 8,  perUnit: 0.010  },
    windows:   { base: 5,  perUnit: 0.10   },
    gutters:   { base: 10, perUnit: 0.05   },
    parking:   { base: 15, perUnit: 0.20   },
    housewatch:{ base: 4                    },
    junk:      { base: 25, lbsPerEighth: 312.5 }
  },
  jam: {
    lock:    { hardware: { wifi: 220, retrofit: 210, budget: 100, "customer-supplied": 0 }, addlHw: 200, hub: 130, misc: 10 },
    camera:  { nvr: 300, perCam: 129, run: 20, misc: 15 },
    network: { base: 120, perAp: 130, perDrop: 20, design: 0 },
    starlink:{ mount: { eave: 50, roof: 50, pole: 65 }, perExt: 25 },
    labor:   { rate: 0 }
  }
};
function calcCost(key, inp, costs){
  costs = costs || COST_DEFAULT;
  var biz = (typeof S !== "undefined" && S.biz) ? S.biz : (costs.obx && costs.obx[key] ? "obx" : "jam");
  var table = costs[biz] || {};
  var c = table[key];
  if (!c) return 0;
  inp = inp || {};
  var qty = inp.qty || 0, n = Math.max(1, inp.count || 1);
  switch (key) {
    case "softwash": case "roofwash": case "pressure": case "deck": case "windows": case "gutters":
      return Math.round(((c.base || 0) + (c.perUnit || 0) * qty) * 100) / 100;
    case "parking":
      return Math.round(((c.base || 0) + (c.perUnit || 0) * qty) * 100) / 100;
    case "housewatch":
      return c.base || 0;
    case "junk": {
      var lbs = inp.lbs != null ? inp.lbs : (inp.eighths || 1) * (c.lbsPerEighth || 312.5);
      return Math.round(((c.base || 0) + disposalCost(lbs)) * 100) / 100;
    }
    case "lock":
      return (c.hardware[inp.type] || 0) * n + (c.addlHw || 0) * (n - 1) + (inp.hub ? c.hub : 0) + (c.misc || 0);
    case "camera":
      return (c.nvr || 0) + (c.perCam || 0) * n + (c.run || 0) * (inp.runs != null ? inp.runs : n) + (c.misc || 0);
    case "network":
      return (c.base || 0) + (c.perAp || 0) * (inp.aps || 0) + (c.perDrop || 0) * (inp.drops || 0) + (inp.design ? c.design : 0);
    case "starlink":
      return (c.mount[inp.mount] || c.mount.eave) + (c.perExt || 0) * (inp.ext || 0);
    case "labor":
      return (c.rate || 0) * (inp.hours || 1);
    default:
      return 0;
  }
}
function disposalLine(lbs, veg){
  var c = veg ? 0 : disposalCost(lbs);
  return { serviceId: "", name: "Dump fee — " + lbs + " lbs " + (veg ? "(clean vegetative debris — free, Dare County)" : "(mixed C&D, first 500 lbs free)"),
           unit: "cost", price: 0, qty: 1, cost: c, costLine: true };
}

  WZ.items.push({name:"Junk / move-out — "+itemCount+" items (~"+c.eighths.toFixed(1)+"/8 truck)",price:c.total,cost:junkCost,notes:notes,qty:1,unit:"job",serviceId:""});

function deepOverrides(){try{const d=D().docs.find(x=>x.id==="deepover"&&!x.deleted);if(d)return JSON.parse(d.text);}catch(e){}return {};}
function setDeepOverrides(o){let d=D().docs.find(x=>x.id==="deepover");if(d){d.text=JSON.stringify(o);d.updatedAt=now();}else D().docs.push({id:"deepover",text:JSON.stringify(o),updatedAt:now()});save();}
function getDeepCfg(key){const base=JSON.parse(JSON.stringify(DEEP[key]));const ov=(deepOverrides()||{})[key];if(!ov)return base;
  if(ov.min!=null)base.min=ov.min;
  base.groups.forEach(g=>g[1].forEach(it=>{const o=ov.items&&ov.items[it.k];if(o){if(o.rate!=null)it.rate=o.rate;if(o.tiers)it.tiers=o.tiers;}
    if(it.mods&&ov.lmods&&ov.lmods[it.k])it.mods=it.mods.map(m=>{const nv=ov.lmods[it.k][m[0]];return nv!=null?[m[0],m[1],nv]:m;});}));
  if(ov.jmods&&base.mods)base.mods=base.mods.map(md=>{const o=ov.jmods[md.k];if(o==null)return md;const m=JSON.parse(JSON.stringify(md));
    if(md.t==="chk"){if(m.pct!=null)m.pct=o;else m.flat=o;}
    else if(md.t==="sel"&&typeof o==="object")m.opts=m.opts.map(opt=>{const nv=o[opt[0]];if(nv==null)return opt;const e=Object.assign({},opt[2]||{});if(e.pct!=null)e.pct=nv;else if(e.flat!=null)e.flat=nv;return [opt[0],opt[1],e];});
    return m;});
  return base;}

function deepLines(key){if(!WZ.deep)WZ.deep={};if(!WZ.deep[key])WZ.deep[key]=[];return WZ.deep[key];}
function calcDeep(key){
  const cfg=getDeepCfg(key);const lines=(WZ.deep&&WZ.deep[key])||[];const mods=(WZ.deepMods&&WZ.deepMods[key])||{};
  let sub=0,fees=0,rows=[];
  lines.forEach(li=>{const it=deepItem(key,li.key);if(!it||!li.qty)return;
    let base=it.kind==="area"?tierPrice(li.qty,it.tiers):it.rate*li.qty;
    let pct=0,ml="";
    if(it.mods){const m=it.mods.find(x=>x[0]===(li.mod||it.mods[0][0]));if(m&&m[2]){pct=m[2];ml=" · "+m[1];}}
    const afterMod=base*(1+pct),fee=it.fee?it.fee*li.qty:0;
    sub+=afterMod;fees+=fee;
    rows.push({label:it.label+" ×"+(+li.qty.toFixed(2))+" "+it.unit+ml,amt:Math.round(afterMod+fee)});
  });
  let mult=1,adds=0,modRows=[];
  (cfg.mods||[]).forEach(md=>{const v=mods[md.k];
    if(md.t==="chk"){if(v){if(md.pct){mult*=(1+md.pct);modRows.push([md.label,(md.pct>0?"+":"")+Math.round(md.pct*100)+"%"]);}else if(md.flat){adds+=md.flat;modRows.push([md.label,"+"+money(md.flat)]);}}}
    else if(md.t==="sel"){const o=md.opts.find(x=>x[0]===v);if(o&&o[2]){if(o[2].pct){mult*=(1+o[2].pct);modRows.push([o[1],(o[2].pct>0?"+":"")+Math.round(o[2].pct*100)+"%"]);}else if(o[2].flat){adds+=o[2].flat;modRows.push([o[1],"+"+money(o[2].flat)]);}}}
  });
  let total=sub*mult+fees+adds;
  if(sub<=0&&fees<=0)total=0;else total=Math.max(cfg.min,rnd5(total));
  const unc=cfg.unc&&cfg.unc.pct?Math.round(total*cfg.unc.pct/5)*5:0;
  return {sub:Math.round(sub),fees:Math.round(fees),rows:rows,modRows:modRows,total:total,unc:unc};
}

      ${jobs.map(j=>{const p=j.propertyId?(D().properties||[]).find(x=>x.id===j.propertyId):null;const ok=p&&p.lat!=null;return `<div class="li"><div class="grow"><div class="nm" style="font-size:15px">${esc(j.title)}</div><div class="sub">${p?esc(p.label||p.address||""):"no property linked"}${ok?"":' · <span style="color:var(--danger)">⚠ no location</span>'}</div></div></div>`;}).join("")}</div>`;
  }
  h+=`<div class="card"><label>Start / home base (optional — defaults to first stop)</label><div class="acwrap"><input id="s_home" value="${esc(localStorage.getItem("jra_home")||"")}" placeholder="Your start address" oninput="addrSuggest('s_home','s_hbox')" onchange="localStorage.setItem('jra_home',this.value)"><div class="acbox" id="s_hbox"></div></div>

window.salesSub=function(s){SALESSUB=s;SADDED=[];SORDERED=[];render();};
function initSMap(){const el=document.getElementById("smap");if(!el)return;
  if(typeof L==="undefined"){el.innerHTML='<div class="muted" style="padding:20px">Map needs an internet connection.</div>';return;}
  SMAP=L.map("smap").setView([36.07,-75.70],10);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,attribution:"Imagery © Esri"}).addTo(SMAP);
  SLAYER=L.layerGroup().addTo(SMAP);

window.salesAddAddr=function(){const v=val("s_addr");if(!v){alert("Type an address first.");return;}
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(v)).then(r=>r.json()).then(d=>{if(!d||!d[0]){alert("Address not found.");return;}

function collectStops(){let stops=[];
  if(SALESSUB==="prospect"){document.querySelectorAll(".sstop:checked").forEach(cb=>{const la=parseFloat(cb.getAttribute("data-lat")),ln=parseFloat(cb.getAttribute("data-lng"));if(!isNaN(la)&&!isNaN(ln))stops.push({name:cb.getAttribute("data-name"),lat:la,lng:ln});});SADDED.forEach(s=>stops.push(s));}
  else{actJ().filter(j=>!j.done&&j.date===JOBDATE).forEach(j=>{const p=j.propertyId?(D().properties||[]).find(x=>x.id===j.propertyId):null;if(p&&p.lat!=null)stops.push({name:j.title,lat:p.lat,lng:p.lng});});}

window.salesOptimize=function(){
  const stops=collectStops();const home=val("s_home");const res=document.getElementById("s_result");
  const go=function(homePt){let all=stops.slice();if(homePt)all.unshift(homePt);
    if(all.length<2){res.innerHTML='<span style="color:var(--danger)">Add at least 2 stops with a location.</span>';return;}
    res.innerHTML='<span class="muted">Optimizing…</span>';
    const coords=all.map(s=>s.lng+","+s.lat).join(";");
    fetch("https://router.project-osrm.org/trip/v1/driving/"+coords+"?source=first&roundtrip=true&overview=full&geometries=geojson")
      .then(r=>r.json()).then(d=>{if(d.code!=="Ok"){res.innerHTML='<span style="color:var(--danger)">Routing failed: '+esc(d.message||d.code)+'</span>';return;}drawRoute(d,all);})
      .catch(function(){res.innerHTML='<span style="color:var(--danger)">Routing error — need internet.</span>';});};
  if(home){fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(home)).then(r=>r.json()).then(d=>go(d&&d[0]?{name:"Start",lat:+d[0].lat,lng:+d[0].lon}:null)).catch(function(){go(null);});}
  else go(null);
};
function drawRoute(d,all){const trip=d.trips[0];const ordered=[];d.waypoints.forEach((w,i)=>{ordered[w.waypoint_index]=all[i];});SORDERED=ordered.filter(Boolean);
  if(SLAYER){SLAYER.clearLayers();L.geoJSON(trip.geometry,{style:{color:"#2A6CF0",weight:5,opacity:.8}}).addTo(SLAYER);
    SORDERED.forEach((s,i)=>L.marker([s.lat,s.lng]).addTo(SLAYER).bindPopup((i+1)+". "+esc(s.name)));
    try{SMAP.fitBounds(L.geoJSON(trip.geometry).getBounds(),{padding:[30,30]});}catch(e){}}
  const mi=(trip.distance/1609.34).toFixed(1),min=Math.round(trip.duration/60);
  document.getElementById("s_result").innerHTML=`<div class="nm">${SORDERED.length} stops · ${mi} mi · ~${min} min driving</div>
    <ol style="margin:8px 0 8px 18px;font-size:14px">${SORDERED.map(s=>`<li>${esc(s.name)}</li>`).join("")}</ol>
    <button class="btn acc sm" onclick="salesNavigate()">🧭 Navigate (Google Maps)</button>`;}
window.salesNavigate=function(){if(!SORDERED.length)return;const o=SORDERED[0];const wp=SORDERED.slice(1).map(s=>s.lat+","+s.lng).join("|");
  window.open("https://www.google.com/maps/dir/?api=1&origin="+o.lat+","+o.lng+"&destination="+o.lat+","+o.lng+(wp?"&waypoints="+encodeURIComponent(wp):""),"_blank");};

function deepEditorHTML(){
  const ov=deepOverrides();
  const svcs=WZ_SVC[S.biz].filter(s=>DEEP[s[0]]);
  return svcs.map(s=>{const key=s[0];const cfg=getDeepCfg(key);const edited=!!ov[key];
    let h=`<details class="card"><summary style="font-weight:800;cursor:pointer">${esc(s[1])}${edited?` <span class="badge" style="background:var(--accent);color:var(--accent-ink)">edited</span>`:""}</summary><div style="margin-top:8px">`;
    h+=`<div class="sub" style="margin-bottom:8px;line-height:1.5">📚 <b>Source:</b> ${esc(DEEP_SRC[key]||"")}</div>`;
    h+=`<div class="row" style="align-items:center;gap:8px"><div class="grow"><b>Minimum charge</b></div><span class="sub">$</span><input type="number" style="width:90px" value="${cfg.min}" onchange="setDeepMin('${key}',this.value)"></div>`;
    cfg.groups.forEach(g=>{h+=`<div style="font-weight:700;margin-top:12px;border-top:1px solid var(--line);padding-top:8px">${esc(g[0])}</div>`;
      g[1].forEach(it=>{
        if(it.kind==="area"){h+=`<div class="sub" style="margin-top:6px">${esc(it.label)} — $/${esc(it.unit)} (sliding scale by size):</div><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px">`+it.tiers.map((t,ti)=>`<span class="sub">${t[0]>=1e9?"largest:":"≤"+t[0].toLocaleString()+":"}</span><input type="number" step="0.01" style="width:72px" value="${t[1]}" onchange="setDeepTier('${key}','${it.k}',${ti},this.value)">`).join("")+`</div>`;}
        else h+=`<div class="row" style="align-items:center;gap:8px;margin-top:6px"><div class="grow sub">${esc(it.label)}</div><span class="sub">$</span><input type="number" step="0.01" style="width:86px" value="${it.rate}" onchange="setDeepItemRate('${key}','${it.k}',this.value)"><span class="sub">/${esc(it.unit)}</span></div>`;
        if(it.mods)h+=it.mods.filter(m=>m[2]!==0||true).map(m=>`<div class="row" style="align-items:center;gap:8px;margin:2px 0 2px 16px"><div class="grow sub">↳ ${esc(m[1])}</div><input type="number" style="width:64px" value="${Math.round(m[2]*100)}" onchange="setDeepLmod('${key}','${it.k}','${m[0]}',this.value)"><span class="sub">%</span></div>`).join("");
      });
    });
    if(cfg.mods&&cfg.mods.length){h+=`<div style="font-weight:700;margin-top:12px;border-top:1px solid var(--line);padding-top:8px">Job conditions</div>`;
      cfg.mods.forEach(md=>{
        if(md.t==="chk"){const isFlat=md.flat!=null;h+=`<div class="row" style="align-items:center;gap:8px;margin-top:4px"><div class="grow sub">${esc(md.label)}</div><span class="sub">${isFlat?"$":""}</span><input type="number" style="width:74px" value="${isFlat?md.flat:Math.round(md.pct*100)}" onchange="setDeepJmodChk('${key}','${md.k}',this.value)"><span class="sub">${isFlat?"":"%"}</span></div>`;}
        else {h+=`<div class="sub" style="margin-top:6px">${esc(md.label)}:</div>`+md.opts.map(o=>{const e=o[2]||{};if(e.pct==null&&e.flat==null)return"";const isFlat=e.flat!=null;return `<div class="row" style="align-items:center;gap:8px;margin:2px 0 2px 16px"><div class="grow sub">↳ ${esc(o[1])}</div><span class="sub">${isFlat?"$":""}</span><input type="number" style="width:74px" value="${isFlat?e.flat:Math.round(e.pct*100)}" onchange="setDeepJmodSel('${key}','${md.k}','${o[0]}',this.value)"><span class="sub">${isFlat?"":"%"}</span></div>`;}).join("");}
      });
    }
    h+=`<button class="btn ghost sm" style="margin-top:12px" onclick="resetDeepKey('${key}')">↺ Reset this service to researched defaults</button>`;
    return h+`</div></details>`;
  }).join("");
}

function _ovset(key,fn){const o=deepOverrides();if(!o[key])o[key]={};fn(o[key]);setDeepOverrides(o);}
window.setDeepMin=function(key,v){_ovset(key,x=>x.min=parseFloat(v)||0);};
window.setDeepItemRate=function(key,ik,v){_ovset(key,x=>{x.items=x.items||{};x.items[ik]=x.items[ik]||{};x.items[ik].rate=parseFloat(v)||0;});};
window.setDeepTier=function(key,ik,ti,v){const it=getDeepCfg(key).groups.reduce((a,g)=>a.concat(g[1]),[]).find(z=>z.k===ik);const tiers=it.tiers.map(t=>[t[0],t[1]]);tiers[ti][1]=parseFloat(v)||0;_ovset(key,x=>{x.items=x.items||{};x.items[ik]=x.items[ik]||{};x.items[ik].tiers=tiers;});};
window.setDeepLmod=function(key,ik,mv,v){_ovset(key,x=>{x.lmods=x.lmods||{};x.lmods[ik]=x.lmods[ik]||{};x.lmods[ik][mv]=(parseFloat(v)||0)/100;});};
window.setDeepJmodChk=function(key,mk,v){_ovset(key,x=>{x.jmods=x.jmods||{};const md=DEEP[key].mods.find(m=>m.k===mk);x.jmods[mk]=(md.flat!=null)?(parseFloat(v)||0):((parseFloat(v)||0)/100);});};
window.setDeepJmodSel=function(key,mk,opt,v){_ovset(key,x=>{x.jmods=x.jmods||{};if(typeof x.jmods[mk]!=="object"||x.jmods[mk]==null)x.jmods[mk]={};const md=DEEP[key].mods.find(m=>m.k===mk);const o=md.opts.find(z=>z[0]===opt);const isFlat=o[2]&&o[2].flat!=null;x.jmods[mk][opt]=isFlat?(parseFloat(v)||0):((parseFloat(v)||0)/100);});};
window.resetDeepKey=function(key){const o=deepOverrides();delete o[key];setDeepOverrides(o);const b=document.getElementById("deepEditBody");if(b)b.innerHTML=deepEditorHTML();};
window.resetDeepAll=function(){if(!confirm("Reset ALL deep quote rates for this business to the researched defaults?"))return;setDeepOverrides({});const b=document.getElementById("deepEditBody");if(b)b.innerHTML=deepEditorHTML();};

window.saveSync=function(){S.sync.url=val("sy_url");S.sync.token=val("sy_token");
  S.sync.auto=document.getElementById("sy_auto").checked;save();syMsg("Saved.");renderSyncPill();};
function syMsg(t){const e=document.getElementById("sy_msg");if(e)e.textContent=t;}
function renderSyncPill(){const b=document.getElementById("syncbtn");
  if(!S.sync.url){b.style.display="none";return;}
  b.style.display="";b.textContent="⟳ Sync";}
window.syncNow=async function(){
  if(!S.sync.url){if(TAB==="data")syMsg("Set a server URL first.");else{TAB="data";render();}return;}
  syMsg("Syncing…");const btn=document.getElementById("syncbtn");if(btn)btn.textContent="⟳ …";
  try{
    const res=await fetch(S.sync.url.replace(/\/+$/,"")+"/sync",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:S.sync.token,state:{obx:S.obx,jam:S.jam,users:S.users}})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(!data||!data.state||!data.state.obx)throw new Error("bad response");
    S.obx=data.state.obx;S.jam=data.state.jam;if(data.state.users)S.users=data.state.users;S.sync.last=now();save();
    render();syMsg("Synced ✓");
  }catch(e){syMsg("Sync failed: "+e.message);if(btn)btn.textContent="⟳ Sync";}
};
window.exportData=function(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="business-app-backup-"+today()+".json";a.click();
};
window.importData=function(inp){
  const file=inp.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.obx||!o.jam)throw 0;
    if(!confirm("Replace all current data with this backup?"))return;
    o.sync=o.sync||S.sync;S=o;S.biz=S.biz||"obx";save();setBiz(S.biz);alert("Imported.");}
    catch(e){alert("That doesn't look like a valid backup file.")}};
  r.readAsText(file);
};

/* ---------- USERS / lightweight accounts ---------- */
async function hashPw(pw){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+"::jsuite"));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
  catch(e){let h=5381;const s=pw+"::jsuite";for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "f"+h.toString(16);}
}
function users(){return (S.users||[]).filter(u=>!u.deleted);}
function curUser(){const id=localStorage.getItem("jra_session");return users().find(u=>u.id===id)||null;}
function userName(id){const u=(S.users||[]).find(x=>x.id===id);return u?u.username:"";}
window.openCreateAccount=function(){modal("New account",`
  <p class="muted" style="margin-bottom:8px">No email needed — just a username and password. This is lightweight identity for your team (for assigning to-dos), not bank-grade security.</p>
  <label>Username</label><input id="u_name" autocomplete="off">
  <label>Password</label><input id="u_pw" type="password" autocomplete="new-password">
  <button class="btn acc" style="margin-top:14px" onclick="createAccount()">Create account</button>`);};
window.createAccount=async function(){
  const un=val("u_name"),pw=val("u_pw");
  if(!un||!pw){alert("Username and password required.");return;}
  if(users().some(u=>u.username.toLowerCase()===un.toLowerCase())){alert("That username is taken.");return;}
  if(!S.users)S.users=[];
  S.users.push({id:uid(),username:un,passhash:await hashPw(pw),updatedAt:now()});
  const u=S.users[S.users.length-1];localStorage.setItem("jra_session",u.id);
  save();closeModal();render();
};
window.openLogin=function(){modal("Sign in",`
  <label>Username</label><input id="l_name" autocomplete="off">
  <label>Password</label><input id="l_pw" type="password" autocomplete="off">
  <button class="btn acc" style="margin-top:14px" onclick="loginUser()">Sign in</button>`);};
window.loginUser=async function(){
  const un=val("l_name"),pw=val("l_pw");
  const u=users().find(x=>x.username.toLowerCase()===un.toLowerCase());
  if(!u||u.passhash!==await hashPw(pw)){alert("Wrong username or password.");return;}
  localStorage.setItem("jra_session",u.id);closeModal();render();
};
window.logoutUser=function(){localStorage.removeItem("jra_session");render();};
window.delUser=function(id){if(!confirm("Remove this account?"))return;
  const u=S.users.find(x=>x.id===id);u.deleted=true;u.updatedAt=now();
  if(localStorage.getItem("jra_session")===id)localStorage.removeItem("jra_session");
  save();render();};
