<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 48" role="img" aria-label="OBX Junk Co.">
  <title>OBX Junk Co.</title>
  <!-- WORDMARK ONLY. Ray, 2026-08-05, after working through the category: junk removal brands are stylised
       NAMES, not pictures — 1-800-GOT-JUNK, Junk King, College Hunks, LoadUp. It is a recall business: the
       name has to be remembered and read off a truck at speed, which a picture mark does not help with.
       "OBX Junk Co." is also almost exactly what people type into Google, so the name IS the asset.
       All caps at weight 900 for signage legibility; textLength pins it so it can never overflow or clip. -->
  <text x="0" y="34" textLength="250" lengthAdjust="spacingAndGlyphs"
        font-family='system-ui,-apple-system,"Segoe UI Black","Segoe UI",Roboto,"Helvetica Neue","Arial Black",Arial,sans-serif' font-size="32" font-weight="900" letter-spacing="-0.5"
        fill="#14161a">OBX <tspan fill="#f26a1b">JUNK</tspan> CO.</text>
</svg>
