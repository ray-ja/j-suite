<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1080" fill="#002052"/>
  <!-- header -->
  <text x="60" y="92" fill="#0099E5" font-size="26" font-weight="700" letter-spacing="4">JAMIESON AUTOMATION</text>
  <rect x="60" y="112" width="120" height="6" fill="#0099E5"/>
  <!-- title -->
  <text x="60" y="240" fill="#ffffff" font-size="60" font-weight="800">Your smart lock</text>
  <text x="60" y="308" fill="#ffffff" font-size="60" font-weight="800">isn't broken.</text>
  <text x="60" y="392" fill="#0099E5" font-size="60" font-weight="800">It's the wifi.</text>
  <!-- icon motif: lock + signal -->
  <g transform="translate(700,470)">
    <!-- wifi arcs -->
    <path d="M-40 60 a120 120 0 0 1 240 0" fill="none" stroke="#0099E5" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
    <path d="M0 70 a80 80 0 0 1 160 0" fill="none" stroke="#0099E5" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 80 a40 40 0 0 1 80 0" fill="none" stroke="#0099E5" stroke-width="10" stroke-linecap="round"/>
    <circle cx="80" cy="98" r="9" fill="#0099E5"/>
    <!-- lock -->
    <rect x="40" y="130" width="80" height="64" rx="10" fill="#ffffff"/>
    <path d="M54 130 v-16 a26 26 0 0 1 52 0 v16" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="80" cy="160" r="9" fill="#002052"/>
  </g>
  <!-- explainer -->
  <rect x="60" y="500" width="560" height="300" rx="18" fill="#0a2d6b"/>
  <text x="90" y="560" fill="#ffffff" font-size="28" font-weight="700">Locks, cameras &amp; thermostats</text>
  <text x="90" y="598" fill="#ffffff" font-size="28" font-weight="700">drop for one reason:</text>
  <text x="90" y="652" fill="#cfe3f7" font-size="26">the signal doesn't reach the device.</text>
  <line x1="90" y1="686" x2="590" y2="686" stroke="#1c427e" stroke-width="2"/>
  <text x="90" y="740" fill="#0099E5" font-size="26" font-weight="700">The fix isn't a pricier lock —</text>
  <text x="90" y="776" fill="#0099E5" font-size="26" font-weight="700">it's getting the network right first.</text>
  <text x="60" y="868" fill="#9fb8d6" font-size="27">Every install we do starts with the signal at the door.</text>
  <!-- footer -->
  <rect x="0" y="980" width="1080" height="100" fill="#0099E5"/>
  <text x="60" y="1043" fill="#002052" font-size="30" font-weight="800">(252) 564-8717  ·  obxlotsolutions.com</text>
</svg>
