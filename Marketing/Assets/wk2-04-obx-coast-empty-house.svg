  <rect x="60" y="112" width="120" height="6" fill="#8BC34A"/>
  <text x="60" y="210" fill="#ffffff" font-size="48" font-weight="800">5 things the coast does</text>
  <text x="60" y="266" fill="#ffffff" font-size="48" font-weight="800">to an empty house</text>
  <text x="60" y="322" fill="#8BC34A" font-size="48" font-weight="800">in one month</text>
  <g font-size="29" fill="#e6ecf5">
    <g transform="translate(60,400)"><circle cx="20" cy="-9" r="22" fill="#8BC34A"/><text x="13" y="0" fill="#1B2A4E" font-size="26" font-weight="800">1</text><text x="62" y="0">Algae &amp; mildew on siding and roof</text></g>
    <g transform="translate(60,470)"><circle cx="20" cy="-9" r="22" fill="#8BC34A"/><text x="13" y="0" fill="#1B2A4E" font-size="26" font-weight="800">2</text><text x="62" y="0">Salt film dulling windows &amp; railings</text></g>
    <g transform="translate(60,540)"><circle cx="20" cy="-9" r="22" fill="#8BC34A"/><text x="13" y="0" fill="#1B2A4E" font-size="26" font-weight="800">3</text><text x="62" y="0">Humidity settling in — musty air, mold risk</text></g>
    <g transform="translate(60,610)"><circle cx="20" cy="-9" r="22" fill="#8BC34A"/><text x="13" y="0" fill="#1B2A4E" font-size="26" font-weight="800">4</text><text x="62" y="0">Pests finding the quiet corners</text></g>
