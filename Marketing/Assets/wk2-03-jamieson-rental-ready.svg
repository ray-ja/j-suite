<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1080" fill="#002052"/>
  <text x="60" y="92" fill="#0099E5" font-size="26" font-weight="700" letter-spacing="4">JAMIESON AUTOMATION</text>
  <rect x="60" y="112" width="120" height="6" fill="#0099E5"/>
  <text x="60" y="240" fill="#ffffff" font-size="56" font-weight="800">Rental-ready.</text>
  <text x="60" y="306" fill="#0099E5" font-size="56" font-weight="800">One install.</text>
  <text x="60" y="372" fill="#cfe3f7" font-size="29">Everything a guest needs to check in and stay connected.</text>
  <!-- four icons row -->
  <g transform="translate(60,440)">
    <!-- wifi -->
    <g transform="translate(0,0)">
      <rect width="210" height="210" rx="18" fill="#0a2d6b"/>
      <g transform="translate(105,95)" stroke="#0099E5" stroke-width="9" fill="none" stroke-linecap="round">
        <path d="M-55 0 a78 78 0 0 1 110 0"/>
        <path d="M-34 26 a48 48 0 0 1 68 0"/>
        <path d="M-14 50 a20 20 0 0 1 28 0"/>
      </g>
      <circle cx="105" cy="158" r="9" fill="#0099E5"/>
      <text x="105" y="195" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">WiFi</text>
    </g>
    <!-- lock -->
    <g transform="translate(250,0)">
      <rect width="210" height="210" rx="18" fill="#0a2d6b"/>
      <rect x="72" y="92" width="66" height="54" rx="8" fill="#0099E5"/>
      <path d="M84 92 v-14 a21 21 0 0 1 42 0 v14" fill="none" stroke="#0099E5" stroke-width="9"/>
      <text x="105" y="195" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Smart lock</text>
    </g>
    <!-- thermostat -->
    <g transform="translate(500,0)">
      <rect width="210" height="210" rx="18" fill="#0a2d6b"/>
      <circle cx="105" cy="100" r="46" fill="none" stroke="#0099E5" stroke-width="9"/>
      <text x="105" y="112" fill="#0099E5" font-size="34" font-weight="800" text-anchor="middle">72°</text>
      <text x="105" y="195" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Thermostat</text>
    </g>
    <!-- starlink dish -->
    <g transform="translate(750,0)">
      <rect width="210" height="210" rx="18" fill="#0a2d6b"/>
      <ellipse cx="105" cy="92" rx="58" ry="26" fill="none" stroke="#0099E5" stroke-width="9"/>
      <line x1="105" y1="100" x2="105" y2="150" stroke="#0099E5" stroke-width="9"/>
      <line x1="80" y1="150" x2="130" y2="150" stroke="#0099E5" stroke-width="9" stroke-linecap="round"/>
      <text x="105" y="195" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Starlink</text>
    </g>
  </g>
  <text x="60" y="760" fill="#ffffff" font-size="30" font-weight="700">Installed right the first time —</text>
  <text x="60" y="800" fill="#ffffff" font-size="30" font-weight="700">by someone who knows the systems.</text>
  <text x="60" y="858" fill="#9fb8d6" font-size="27">Multiple doors? We do it per-door so it scales.</text>
  <rect x="0" y="980" width="1080" height="100" fill="#0099E5"/>
  <text x="60" y="1043" fill="#002052" font-size="30" font-weight="800">(252) 564-8717  ·  obxlotsolutions.com</text>
</svg>
