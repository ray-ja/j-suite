  <rect x="60" y="98" width="100" height="5" fill="#8BC34A"/>
  <!-- photo placeholder panels -->
  <g>
    <rect x="60" y="140" width="450" height="640" rx="14" fill="#22335c" stroke="#3a4a72" stroke-width="2" stroke-dasharray="12 8"/>
