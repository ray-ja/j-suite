<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" font-family="Arial, sans-serif">
  <rect width="1080" height="760" fill="#F7FAFC"/>
  <text x="40" y="56" fill="#14233F" font-size="30" font-weight="bold">OBX-Trust Section Icons</text>
  <text x="40" y="86" fill="#5B6678" font-size="17">Teal line icons on sand/white — consistent stroke, rounded caps. Concept, not final art.</text>

  <!-- shared style: circle bg #E8DCC4, stroke #2E8BA6 -->
  <g stroke="#2E8BA6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1 Storm Prep: cloud + shield -->
    <g transform="translate(120,200)">
      <circle cx="0" cy="0" r="78" fill="#E8DCC4" stroke="none"/>
      <path d="M-34 -6 a20 20 0 0 1 8 -38 a26 26 0 0 1 49 6 a18 18 0 0 1 3 35 Z"/>
      <path d="M-2 8 L26 16 L26 40 Q26 60 2 70 Q-22 60 -22 40 L-22 18 Z" transform="translate(-2,4)"/>
    </g>
    <!-- 2 Insurance & Vacancy: document + check -->
    <g transform="translate(360,200)">
      <circle cx="0" cy="0" r="78" fill="#E8DCC4" stroke="none"/>
      <rect x="-34" y="-44" width="60" height="84" rx="6"/>
      <line x1="-22" y1="-22" x2="10" y2="-22"/>
      <line x1="-22" y1="-4" x2="14" y2="-4"/>
      <path d="M-18 22 l12 12 l26 -30"/>
    </g>
    <!-- 3 Off-Season Care: house + droplet -->
    <g transform="translate(600,200)">
      <circle cx="0" cy="0" r="78" fill="#E8DCC4" stroke="none"/>
      <path d="M-40 4 L0 -34 L40 4"/>
      <path d="M-30 0 L-30 40 L30 40 L30 0"/>
      <path d="M2 6 q14 18 14 28 a14 14 0 0 1 -28 0 q0 -10 14 -28 Z" transform="translate(-2,2)"/>
    </g>
    <!-- 4 Hurricane Checklist: clipboard -->
    <g transform="translate(840,200)">
      <circle cx="0" cy="0" r="78" fill="#E8DCC4" stroke="none"/>
      <rect x="-32" y="-40" width="64" height="80" rx="8"/>
      <rect x="-14" y="-50" width="28" height="18" rx="4"/>
      <path d="M-18 -10 l8 8 l16 -18"/>
      <line x1="-18" y1="18" x2="18" y2="18"/>
    </g>

  </g>
  <g fill="#14233F" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="120" y="312">Storm Prep</text>
    <text x="360" y="312">Insurance &amp; Vacancy</text>
    <text x="600" y="312">Off-Season Care</text>
    <text x="840" y="312">Hurricane Checklist</text>
  </g>

  <g stroke="#2E8BA6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 5 Hire a Home-Watch: house + eye -->
    <g transform="translate(120,470)">
      <circle cx="0" cy="0" r="78" fill="#E8DCC4" stroke="none"/>
      <path d="M-40 -8 L0 -42 L40 -8"/>
      <path d="M-30 -12 L-30 34 L30 34 L30 -12"/>
      <path d="M-22 14 q22 -26 44 0 q-22 26 -44 0 Z"/>
      <circle cx="0" cy="14" r="7" fill="#2E8BA6" stroke="none"/>
    </g>
    <!-- 6 Smart Monitoring: phone + signal -->
    <g transform="translate(360,470)">
      <circle cx="0" cy="0" r="78" fill="#E8DCC4" stroke="none"/>
      <rect x="-26" y="-44" width="52" height="88" rx="8"/>
      <line x1="-8" y1="32" x2="8" y2="32"/>
      <path d="M-12 -16 a18 18 0 0 1 24 0"/>
      <path d="M-4 -8 a8 8 0 0 1 8 0"/>
      <circle cx="0" cy="-2" r="3" fill="#2E8BA6" stroke="none"/>
    </g>
  </g>
  <g fill="#14233F" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="120" y="582">Hire a Home-Watch</text>
    <text x="360" y="582">Smart Monitoring</text>
  </g>

  <!-- palette swatches -->
  <text x="40" y="650" fill="#14233F" font-size="20" font-weight="bold">OBX-Trust palette</text>
  <g font-size="13" fill="#ffffff" text-anchor="middle">
    <rect x="40" y="668" width="150" height="62" rx="8" fill="#14233F"/><text x="115" y="704">Navy #14233F</text>
    <rect x="200" y="668" width="150" height="62" rx="8" fill="#2E8BA6"/><text x="275" y="704">Teal #2E8BA6</text>
    <rect x="360" y="668" width="150" height="62" rx="8" fill="#E8DCC4"/><text x="435" y="704" fill="#14233F">Sand #E8DCC4</text>
    <rect x="520" y="668" width="150" height="62" rx="8" fill="#8BC34A"/><text x="595" y="704" fill="#14233F">OBX Grn #8BC34A</text>
    <rect x="680" y="668" width="150" height="62" rx="8" fill="#F7FAFC" stroke="#dde3ee"/><text x="755" y="704" fill="#14233F">BG #F7FAFC</text>
  </g>
</svg>
