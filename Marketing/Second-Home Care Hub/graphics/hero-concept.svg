  <text x="1468" y="69" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#14233F">Checklist</text>

  <text x="80" y="330" fill="#8BC34A" font-family="Arial, sans-serif" font-size="20" font-weight="bold" letter-spacing="3">FOR OUTER BANKS SECOND-HOME OWNERS</text>
