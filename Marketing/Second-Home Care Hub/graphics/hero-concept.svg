  <text x="80" y="648" fill="#dbe6ec" font-family="Arial, sans-serif" font-size="25">Salt, storms, and humidity work on a coastal house every day you're not there.</text>
  <text x="80" y="684" fill="#dbe6ec" font-family="Arial, sans-serif" font-size="25">We're the local resource that helps you protect it.</text>

