<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" font-family="Arial, sans-serif">
  <rect width="1080" height="900" fill="#F7FAFC"/>
  <text x="40" y="52" fill="#14233F" font-size="28" font-weight="bold">Hub UI Components — concept</text>
  <text x="40" y="80" fill="#5B6678" font-size="16">Reusable pieces for Dev: wave divider, pick card, reassurance pull-quote, trust footer. Concept, not final art.</text>

  <!-- WAVE DIVIDER -->
  <text x="40" y="130" fill="#14233F" font-size="18" font-weight="bold">Wave divider (between sections)</text>
  <path d="M40 165 q 40 -16 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 40 0"
        fill="none" stroke="#2E8BA6" stroke-width="3" opacity="0.8"/>

  <!-- PICK CARD -->
  <text x="40" y="230" fill="#14233F" font-size="18" font-weight="bold">Affiliate "pick card"</text>
  <g transform="translate(40,250)">
    <rect width="480" height="220" rx="14" fill="#ffffff" stroke="#dde3ee" stroke-width="2"/>
    <!-- icon chip -->
    <rect x="24" y="24" width="64" height="64" rx="12" fill="#E8DCC4"/>
    <g transform="translate(56,56)" stroke="#2E8BA6" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-16 6 q16 -22 32 0 q-16 22 -32 0 Z"/>
      <circle cx="0" cy="6" r="6" fill="#2E8BA6" stroke="none"/>
    </g>
    <text x="104" y="48" fill="#14233F" font-size="20" font-weight="bold">Smart Leak Sensor</text>
    <text x="104" y="74" fill="#2E8BA6" font-size="15" font-weight="bold" font-style="italic">Best for: catching a burst pipe early</text>
    <line x1="24" y1="104" x2="456" y2="104" stroke="#eef2f6" stroke-width="2"/>
    <text x="24" y="132" fill="#243044" font-size="14" font-weight="bold">Why we like it:</text>
    <text x="24" y="154" fill="#243044" font-size="14">Cheap, reliable, and alerts your phone the moment water shows up.</text>
    <text x="24" y="184" fill="#5B6678" font-size="13" font-style="italic">Worth knowing: needs wifi at the sensor — pairs with the backup-internet layer.</text>
    <rect x="24" y="196" width="180" height="0" />
    <g transform="translate(300,168)">
      <rect width="156" height="40" rx="20" fill="#8BC34A"/>
      <text x="22" y="26" fill="#14233F" font-size="15" font-weight="bold">Check price &#8594;</text>
    </g>
  </g>

  <!-- DUAL PATH note card -->
  <g transform="translate(560,250)">
    <rect width="480" height="220" rx="14" fill="#14233F"/>
    <text x="28" y="48" fill="#8BC34A" font-size="13" font-weight="bold" letter-spacing="2">THE DUAL-PATH MOVE</text>
    <text x="28" y="84" fill="#ffffff" font-size="19" font-weight="bold">Two honest ways to act</text>
    <text x="28" y="120" fill="#dbe6ec" font-size="15">1 · Buy it yourself (affiliate link) — DIY-friendly gear.</text>
    <text x="28" y="150" fill="#dbe6ec" font-size="15">2 · Have it installed right — Jamieson Automation.</text>
    <text x="28" y="190" fill="#9fd3e0" font-size="13" font-style="italic">Captures value whether they DIY or hire — and</text>
    <text x="28" y="208" fill="#9fd3e0" font-size="13" font-style="italic">both are genuinely helpful answers.</text>
  </g>

  <!-- PULL QUOTE -->
  <text x="40" y="520" fill="#14233F" font-size="18" font-weight="bold">Reassurance pull-quote</text>
  <g transform="translate(40,540)">
    <rect width="1000" height="120" rx="14" fill="#E8DCC4"/>
    <text x="40" y="56" fill="#2E8BA6" font-size="64" font-weight="bold" font-family="Georgia, serif">&#8220;</text>
    <text x="90" y="58" fill="#14233F" font-size="24" font-weight="bold" font-family="Georgia, serif">A leak caught in week one is a cleanup.</text>
    <text x="90" y="92" fill="#14233F" font-size="24" font-weight="bold" font-family="Georgia, serif">The same leak in month three is a renovation.</text>
  </g>

  <!-- TRUST FOOTER -->
  <text x="40" y="710" fill="#14233F" font-size="18" font-weight="bold">Trust footer band</text>
  <g transform="translate(40,730)">
    <rect width="1000" height="120" rx="14" fill="#14233F"/>
    <text x="30" y="44" fill="#ffffff" font-size="16" font-weight="bold">OBX Second-Home Care Hub</text>
    <text x="30" y="74" fill="#bcd2ec" font-size="13">Run by OBX Lot Solutions, a local Outer Banks property-care company. Some links are affiliate links —</text>
    <text x="30" y="94" fill="#bcd2ec" font-size="13">if you buy through them we may earn a small commission at no cost to you. We only recommend gear</text>
    <text x="30" y="114" fill="#bcd2ec" font-size="13">we'd put in our own coastal homes.</text>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#8BC34A"/>
  </g>
</svg>
